<script>
(function () {
  'use strict';

  // ---------- 共用工具 ----------
  function escapeHtml(s) {
    return String(s === null || s === undefined ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function callServer(fnName) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      var runner = google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(function (err) { reject(err); });
      runner[fnName].apply(runner, args);
    });
  }

  function fmtNum(v, digits) {
    if (v === null || v === undefined || isNaN(v)) return '-';
    return Number(v).toLocaleString('zh-TW', { maximumFractionDigits: digits === undefined ? 2 : digits });
  }

  function errorBox(msg) {
    return '<div class="error-box">⚠️ ' + escapeHtml(msg && msg.message ? msg.message : msg) + '</div>';
  }

  var refreshBtn = document.getElementById('refreshBtn');
  function withSpin(promise) {
    refreshBtn.classList.add('spinning');
    return promise.finally(function () { refreshBtn.classList.remove('spinning'); });
  }

  // ---------- Tab 切換 ----------
  var TAB_TITLES = {
    dashboard: '今日戰報', portfolio: '持股管理', stock: '個股分析',
    research: '研究', data: '資料總覽', admin: '後台管理'
  };
  var loadedTabs = {};

  function activateTab(tab) {
    document.querySelectorAll('.tab-panel').forEach(function (el) { el.classList.remove('active'); });
    document.querySelectorAll('.nav-btn').forEach(function (el) { el.classList.remove('active'); });
    document.getElementById('tab-' + tab).classList.add('active');
    document.querySelector('.nav-btn[data-tab="' + tab + '"]').classList.add('active');
    document.getElementById('topbarTitle').textContent = TAB_TITLES[tab];
    ensureTabLoaded(tab);
  }

  function ensureTabLoaded(tab, force) {
    if (loadedTabs[tab] && !force) return;
    loadedTabs[tab] = true;
    if (tab === 'dashboard') loadDashboard();
    if (tab === 'portfolio') loadPortfolio();
    if (tab === 'admin') loadAdmin();
    if (tab === 'data') loadDataTab_();
    if (tab === 'research') loadResearchTab_();
  }

  document.querySelectorAll('.nav-btn').forEach(function (btn) {
    btn.addEventListener('click', function () { activateTab(btn.getAttribute('data-tab')); });
  });

  refreshBtn.addEventListener('click', function () {
    var activeTab = document.querySelector('.nav-btn.active').getAttribute('data-tab');
    if (activeTab === 'dashboard') withSpin(loadDashboard(true));
    else if (activeTab === 'portfolio') withSpin(loadPortfolio());
    else if (activeTab === 'admin') withSpin(loadAdmin());
    else if (activeTab === 'data') withSpin(loadDataTab_());
    else if (activeTab === 'stock' && currentStockCode) withSpin(loadStock(currentStockCode));
  });

  // ---------- 今日戰報 ----------
  var STRATEGY_HINT = {
    '🛑 止盈/止損': 'var(--red)',
    '🛡️ 持股守護': 'var(--green)',
    '🚀 趨勢啟動': 'var(--accent)',
    '🔥 趨勢領航': 'var(--amber)'
  };

  function loadDashboard(forceRefresh) {
    var listEl = document.getElementById('dashboardList');
    var metaEl = document.getElementById('dashboardMeta');
    listEl.innerHTML = '<div class="loading">分析中，第一次執行可能要等資料抓取…</div>';
    var fn = forceRefresh ? 'runManualFullUpdate' : 'getDashboardReport';
    return withSpin(callServer(fn)).then(function (res) {
      if (forceRefresh && res.fetch && !res.fetch.ok) {
        metaEl.textContent = '';
        listEl.innerHTML = errorBox('今日資料抓取失敗：' + res.fetch.error);
        return;
      }
      var result = forceRefresh ? res.analysis : res;
      if (!result || !result.latestDate) {
        metaEl.textContent = '目前還沒有資料，請先到「後台管理」執行一次資料抓取。';
        listEl.innerHTML = '';
        return;
      }
      metaEl.textContent = '資料日期：' + result.latestDate + '　共 ' + result.report.length + ' 檔訊號' + (result.cached ? '（快取，未重新查詢）' : '');
      if (result.report.length === 0) {
        listEl.innerHTML = '<div class="loading">篩選出 0 檔，讀取篩選漏斗明細中...</div>';
        callServer('getScreeningDiagnostics').then(function (d) {
          if (!d.latestDate) { listEl.innerHTML = '<div class="empty-hint">今天沒有符合條件的訊號</div>'; return; }
          listEl.innerHTML = '<div class="empty-hint">今天沒有符合條件的訊號</div>' +
            '<div class="meta-bar" style="margin-top:10px;">篩選漏斗明細（' + escapeHtml(d.latestDate) + '，共 ' + d.totalStocks + ' 檔股票，其中 ' + d.holdingCount + ' 檔是持股不算在漏斗內）：</div>' +
            '<table class="simple-table"><tbody>' +
            '<tr><td>成交金額達門檻</td><td>' + d.liquidityPass + '</td></tr>' +
            '<tr><td>多頭排列（Trend_Score=2）</td><td>' + d.upwardTrend + '</td></tr>' +
            '<tr><td>法人參與度前20%</td><td>' + d.highInstParticipation + '（' + d.nullInstPartRank + ' 檔無法計算）</td></tr>' +
            '<tr><td>量能前15%</td><td>' + d.volumeSpark + '（' + d.nullVolRatioRank + ' 檔無法計算）</td></tr>' +
            '<tr><td>同時符合「趨勢啟動」三條件</td><td>' + d.breakoutMatches + '</td></tr>' +
            '<tr><td>多頭+法人逢低承接前30%（「趨勢領航」）</td><td>' + d.ibfHighWithUpward + '（' + d.nullIbfRank + ' 檔無法計算）</td></tr>' +
            '</tbody></table>' +
            '<div class="meta-bar" style="margin-top:8px;">如果「無法計算」的數字接近總股票數，通常代表資料有問題（常見於 BigQuery external 模式欄位順序對錯）；' +
            '如果數字都正常但某一關就是掉到 0，代表今天確實沒有股票同時符合這麼嚴格的條件，是策略設計上會發生的正常情況。</div>';
        }).catch(function (err) { listEl.innerHTML = '<div class="empty-hint">今天沒有符合條件的訊號</div>' + errorBox(err); });
        return;
      }
      listEl.innerHTML = result.report.map(function (r) {
        var color = STRATEGY_HINT[r['操作策略']] || 'var(--text)';
        var code = r['證券代號'];
        var predReturn = r['因子模型_預測1月報酬'];
        var predResist = r['因子模型_預測抗跌力'];
        var predictedLine = (predReturn === null || predReturn === undefined) ? '' :
          '<div class="stock-card-note" style="opacity:0.8;">因子模型預測：1個月 ' +
          (predReturn >= 0 ? '+' : '') + fmtNum(predReturn * 100, 1) + '%' +
          (predResist === null || predResist === undefined ? '' : '　抗跌力 ' + (predResist >= 0 ? '+' : '') + fmtNum(predResist * 100, 2) + '%') +
          '</div>';
        return '<div class="stock-card">' +
          '<div class="stock-card-head">' +
          '<span><span class="stock-card-code">' + escapeHtml(code) + '</span>' +
          '<span class="stock-card-name">' + escapeHtml(r['證券名稱']) + '</span></span>' +
          '<span class="stock-card-score">' + fmtNum(r['Armor_Score'], 1) + '</span>' +
          '</div>' +
          '<div class="stock-card-strategy" style="color:' + color + '">' + escapeHtml(r['操作策略']) + ' · ' + escapeHtml(r['建議動作']) + '</div>' +
          '<div class="stock-card-note">' + escapeHtml(r['實相解讀']) + '</div>' +
          predictedLine +
          '<div class="form-actions">' +
          '<a class="stock-card-link" href="' + escapeHtml(r['監控連結']) + '" target="_blank" rel="noopener">查看個股詳情 ↗</a>' +
          '<button type="button" class="btn-secondary ai-diagnose-btn" data-code="' + escapeHtml(code) + '">🧠 AI 深度診斷</button>' +
          '</div>' +
          '<div id="aiResult-' + escapeHtml(code) + '"></div>' +
          '</div>';
      }).join('');
      listEl.querySelectorAll('.ai-diagnose-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          runAiDiagnosisForButton_(btn.getAttribute('data-code'), document.getElementById('aiResult-' + btn.getAttribute('data-code')));
        });
      });
    }).catch(function (err) {
      metaEl.textContent = '';
      listEl.innerHTML = errorBox(err);
    });
  }

  /** 供 Dashboard 卡片與個股分析頁共用：跑一次 AI 診斷並把結果渲染進指定容器。 */
  function runAiDiagnosisForButton_(code, containerEl) {
    containerEl.innerHTML = '<div class="loading">AI 診斷中，會需要一點時間（要呼叫 Claude API + 抓 Goodinfo）...</div>';
    withSpin(callServer('runAiDiagnosis', [code])).then(function (results) {
      var res = results[0];
      if (!res.ok) { containerEl.innerHTML = errorBox(res.error); return; }
      containerEl.innerHTML =
        '<div class="ai-report">' +
        '<div>最終建議：<span class="ai-verdict-badge">' + escapeHtml(res.verdict) + '</span>' +
        (res.cost !== undefined ? '　<span class="meta-bar" style="display:inline;">本次預估費用 $' + fmtNum(res.cost, 4) + '</span>' : '') + '</div>' +
        renderMarkdownLite(res.text) +
        '</div>';
    }).catch(function (err) { containerEl.innerHTML = errorBox(err); });
  }

  /** 輕量 markdown -> HTML（只處理 AI 診斷模板用到的標題/表格/引用/粗體/清單，不是完整 markdown 解析器）。 */
  function renderMarkdownLite(md) {
    if (!md) return '';
    var lines = String(md).split(/\r?\n/);
    var out = [];
    var tableRows = [];

    function inlineMd(s) {
      return escapeHtml(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    }
    function flushTable() {
      if (tableRows.length === 0) return;
      var rowsHtml = tableRows.map(function (cells, idx) {
        var tag = idx === 0 ? 'th' : 'td';
        return '<tr>' + cells.map(function (c) { return '<' + tag + '>' + inlineMd(c.trim()) + '</' + tag + '>'; }).join('') + '</tr>';
      }).join('');
      out.push('<div class="table-scroll"><table class="simple-table">' + rowsHtml + '</table></div>');
      tableRows = [];
    }

    lines.forEach(function (line) {
      var tableMatch = line.match(/^\s*\|(.+)\|\s*$/);
      if (tableMatch) {
        var cells = tableMatch[1].split('|');
        var isSeparator = cells.every(function (c) { return /^\s*:?-+:?\s*$/.test(c); });
        if (!isSeparator) tableRows.push(cells);
        return;
      }
      flushTable();

      if (/^\s*---+\s*$/.test(line)) { out.push('<hr>'); return; }
      var h = line.match(/^(#{1,6})\s+(.*)$/);
      if (h) { out.push('<h' + (h[1].length <= 2 ? 4 : 5) + '>' + inlineMd(h[2]) + '</h' + (h[1].length <= 2 ? 4 : 5) + '>'); return; }
      var bq = line.match(/^>\s?(.*)$/);
      if (bq) { out.push('<blockquote>' + inlineMd(bq[1]) + '</blockquote>'); return; }
      var li = line.match(/^\s*[*-]\s+(.*)$/);
      if (li) { out.push('<div class="md-li">• ' + inlineMd(li[1]) + '</div>'); return; }
      if (line.trim() === '') return;
      out.push('<p>' + inlineMd(line) + '</p>');
    });
    flushTable();
    return out.join('\n');
  }

  // ---------- 持股管理 ----------
  var pfForm = document.getElementById('portfolioForm');
  var pfClearBtn = document.getElementById('pfClearBtn');

  function loadPortfolio() {
    var listEl = document.getElementById('portfolioList');
    listEl.innerHTML = '<div class="loading">載入中...</div>';
    return callServer('getPortfolio').then(function (items) {
      if (!items.length) {
        listEl.innerHTML = '<div class="empty-hint">尚未新增任何持股</div>';
        return;
      }
      listEl.innerHTML = items.map(function (it) {
        var profit = (it.cost && it.latestClose !== null) ? (it.latestClose - it.cost) / it.cost * 100 : null;
        var profitHtml = profit === null ? '' :
          '<div class="stock-card-strategy" style="color:' + (profit >= 0 ? 'var(--green)' : 'var(--red)') + '">' +
          '現價 ' + fmtNum(it.latestClose) + '　損益 ' + (profit >= 0 ? '+' : '') + fmtNum(profit, 1) + '%</div>';
        return '<div class="stock-card">' +
          '<div class="stock-card-head">' +
          '<span><span class="stock-card-code">' + escapeHtml(it.code) + '</span>' +
          '<span class="stock-card-name">' + escapeHtml(it.name) + '</span></span>' +
          '</div>' +
          '<div class="stock-card-note">成本 ' + fmtNum(it.cost) + '　買進日 ' + escapeHtml(it.buyDate || '-') + '</div>' +
          profitHtml +
          (it.note ? '<div class="stock-card-note">備註：' + escapeHtml(it.note) + '</div>' : '') +
          '<div class="form-actions">' +
          '<button type="button" class="btn-secondary pf-edit" data-code="' + escapeHtml(it.code) + '">編輯</button>' +
          '<button type="button" class="btn-danger pf-delete" data-code="' + escapeHtml(it.code) + '">刪除</button>' +
          '</div></div>';
      }).join('');

      var byCode = {};
      items.forEach(function (it) { byCode[it.code] = it; });
      listEl.querySelectorAll('.pf-edit').forEach(function (btn) {
        btn.addEventListener('click', function () { fillPortfolioForm(byCode[btn.getAttribute('data-code')]); });
      });
      listEl.querySelectorAll('.pf-delete').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var code = btn.getAttribute('data-code');
          if (!confirm('確定要刪除持股 ' + code + ' 嗎？')) return;
          callServer('deletePortfolioItem', code).then(function () { loadPortfolio(); });
        });
      });
    }).catch(function (err) { listEl.innerHTML = errorBox(err); });
  }

  function fillPortfolioForm(it) {
    document.getElementById('portfolioFormTitle').textContent = '編輯持股 ' + it.code;
    document.getElementById('pfOriginalCode').value = it.code;
    document.getElementById('pfCode').value = it.code;
    document.getElementById('pfName').value = it.name || '';
    document.getElementById('pfCost').value = it.cost;
    document.getElementById('pfBuyDate').value = it.buyDate || '';
    document.getElementById('pfNote').value = it.note || '';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  pfClearBtn.addEventListener('click', function () {
    pfForm.reset();
    document.getElementById('portfolioFormTitle').textContent = '新增持股';
    document.getElementById('pfOriginalCode').value = '';
  });

  pfForm.addEventListener('submit', function (e) {
    e.preventDefault();
    var item = {
      code: document.getElementById('pfCode').value.trim(),
      name: document.getElementById('pfName').value.trim(),
      cost: parseFloat(document.getElementById('pfCost').value),
      buyDate: document.getElementById('pfBuyDate').value,
      note: document.getElementById('pfNote').value.trim()
    };
    callServer('savePortfolioItem', item).then(function () {
      pfForm.reset();
      document.getElementById('portfolioFormTitle').textContent = '新增持股';
      document.getElementById('pfOriginalCode').value = '';
      loadPortfolio();
    }).catch(function (err) { alert(err.message || err); });
  });

  // ---------- 個股分析 ----------
  var stockSearchInput = document.getElementById('stockSearchInput');
  var stockSearchResults = document.getElementById('stockSearchResults');
  var currentStockCode = null;
  var priceChart = null, instChart = null;
  var searchDebounceTimer = null;

  stockSearchInput.addEventListener('input', function () {
    clearTimeout(searchDebounceTimer);
    var q = stockSearchInput.value.trim();
    if (!q) { stockSearchResults.innerHTML = ''; return; }
    searchDebounceTimer = setTimeout(function () {
      callServer('searchStockCodes', q).then(function (results) {
        if (!results.length) { stockSearchResults.innerHTML = '<div class="search-result-item">找不到符合的股票</div>'; return; }
        stockSearchResults.innerHTML = results.map(function (r) {
          return '<div class="search-result-item" data-code="' + escapeHtml(r.code) + '">' +
            escapeHtml(r.code) + ' ' + escapeHtml(r.name) + '</div>';
        }).join('');
        stockSearchResults.querySelectorAll('.search-result-item[data-code]').forEach(function (el) {
          el.addEventListener('click', function () {
            stockSearchInput.value = el.getAttribute('data-code') + ' ' + el.textContent.replace(el.getAttribute('data-code'), '').trim();
            stockSearchResults.innerHTML = '';
            loadStock(el.getAttribute('data-code'));
          });
        });
      });
    }, 250);
  });
  document.addEventListener('click', function (e) {
    if (!stockSearchResults.contains(e.target) && e.target !== stockSearchInput) stockSearchResults.innerHTML = '';
  });

  function loadStock(code) {
    currentStockCode = code;
    var detailEl = document.getElementById('stockDetail');
    detailEl.innerHTML = '<div class="loading">載入走勢中...</div>';
    return withSpin(callServer('getStockTimeSeries', code)).then(function (data) {
      if (!data.series.length) {
        detailEl.innerHTML = '<div class="empty-hint">目前沒有 ' + escapeHtml(code) + ' 的歷史資料</div>';
        return;
      }
      detailEl.innerHTML =
        '<div class="chart-card"><h4>' + escapeHtml(data.code) + ' ' + escapeHtml(data.name) + '　收盤價 / MA5 / MA20 / MA60</h4>' +
        '<canvas id="priceChartCanvas" height="220"></canvas></div>' +
        '<div class="chart-card"><h4>法人買賣超（投信+外資+自營商合計，股數）</h4>' +
        '<canvas id="instChartCanvas" height="160"></canvas></div>' +
        '<div class="chart-card"><h4>歷史 Armor_Score / 操作策略（每日戰報累積紀錄）</h4>' +
        '<div class="table-scroll">' + renderScoreHistoryTable(data.scoreHistory) + '</div></div>' +
        '<div class="chart-card"><h4>AI 深度診斷</h4>' +
        '<div class="form-actions"><button type="button" class="btn-primary" id="stockAiDiagnoseBtn">🧠 針對 ' + escapeHtml(data.code) + ' 跑一次 AI 診斷</button></div>' +
        '<div id="stockAiResult"></div>' +
        '<div id="stockAiHistory"></div></div>';

      renderPriceChart(data.series);
      renderInstChart(data.series);
      document.getElementById('stockAiDiagnoseBtn').addEventListener('click', function () {
        runAiDiagnosisForButton_(data.code, document.getElementById('stockAiResult'));
      });
      loadAiDiagnosisHistory_(data.code);
    }).catch(function (err) { detailEl.innerHTML = errorBox(err); });
  }

  function loadAiDiagnosisHistory_(code) {
    var el = document.getElementById('stockAiHistory');
    if (!el) return;
    callServer('getAiDiagnosisHistoryForCode', code).then(function (history) {
      if (!history.length) { el.innerHTML = '<div class="empty-hint">尚無 AI 診斷歷史紀錄</div>'; return; }
      el.innerHTML = '<h4 style="margin-top:12px;">過去診斷紀錄</h4>' + history.map(function (h) {
        return '<div class="ai-report"><div>' + escapeHtml(h.date) + '　最終建議：<span class="ai-verdict-badge">' + escapeHtml(h.verdict) + '</span></div>' +
          renderMarkdownLite(h.text) + '</div>';
      }).join('');
    }).catch(function (err) { el.innerHTML = errorBox(err); });
  }

  function renderScoreHistoryTable(rows) {
    if (!rows || !rows.length) return '<div class="empty-hint">尚無戰報歷史紀錄</div>';
    var recent = rows.slice(-30).reverse();
    var body = recent.map(function (r) {
      return '<tr><td>' + escapeHtml(r.date) + '</td><td>' + fmtNum(r.armorScore, 1) + '</td>' +
        '<td>' + escapeHtml(r.strategy || '-') + '</td><td>' + escapeHtml(r.action || '-') + '</td></tr>';
    }).join('');
    return '<table class="simple-table"><thead><tr><th>日期</th><th>Armor_Score</th><th>策略</th><th>建議</th></tr></thead><tbody>' + body + '</tbody></table>';
  }

  function renderPriceChart(series) {
    var ctx = document.getElementById('priceChartCanvas').getContext('2d');
    if (priceChart) priceChart.destroy();
    priceChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: series.map(function (r) { return r.date; }),
        datasets: [
          { label: '收盤價', data: series.map(function (r) { return r.close; }), borderColor: '#2563eb', pointRadius: 0, tension: 0.1 },
          { label: 'MA5', data: series.map(function (r) { return r.ma5; }), borderColor: '#16a34a', pointRadius: 0, borderWidth: 1 },
          { label: 'MA20', data: series.map(function (r) { return r.ma20; }), borderColor: '#d97706', pointRadius: 0, borderWidth: 1 },
          { label: 'MA60', data: series.map(function (r) { return r.ma60; }), borderColor: '#9333ea', pointRadius: 0, borderWidth: 1 }
        ]
      },
      options: {
        responsive: true,
        interaction: { mode: 'index', intersect: false },
        scales: { x: { ticks: { maxTicksLimit: 6 } } },
        plugins: { legend: { labels: { boxWidth: 12, font: { size: 11 } } } }
      }
    });
  }

  function renderInstChart(series) {
    var ctx = document.getElementById('instChartCanvas').getContext('2d');
    if (instChart) instChart.destroy();
    instChart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: series.map(function (r) { return r.date; }),
        datasets: [{
          label: '法人買賣超',
          data: series.map(function (r) { return r.instNet; }),
          backgroundColor: series.map(function (r) { return r.instNet >= 0 ? '#dc2626' : '#16a34a'; })
        }]
      },
      options: {
        responsive: true,
        scales: { x: { ticks: { maxTicksLimit: 6 } } },
        plugins: { legend: { display: false } }
      }
    });
  }

  // ---------- 回測研究 ----------
  document.querySelectorAll('.sub-tab-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('.sub-tab-btn').forEach(function (b) { b.classList.remove('active'); });
      document.querySelectorAll('.sub-tab-panel').forEach(function (p) { p.classList.remove('active'); });
      btn.classList.add('active');
      document.getElementById('subtab-' + btn.getAttribute('data-subtab')).classList.add('active');
    });
  });

  var lastBacktestResult = null;
  document.getElementById('backtestForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var start = document.getElementById('btStart').value;
    var end = document.getElementById('btEnd').value;
    var liquidity = parseFloat(document.getElementById('btLiquidity').value) || 20000000;
    var target = parseFloat(document.getElementById('btTarget').value) || 5;
    var resultEl = document.getElementById('backtestResult');
    resultEl.innerHTML = '<div class="loading">回測執行中...</div>';
    document.getElementById('btSaveBtn').disabled = true;
    withSpin(callServer('runBacktest', start, end, liquidity, target)).then(function (res) {
      if (res.error) { resultEl.innerHTML = errorBox(res.error); return; }
      lastBacktestResult = res;
      document.getElementById('btSaveBtn').disabled = !(res.results && res.results.length);
      if (res.warning) { resultEl.innerHTML = errorBox(res.warning); return; }
      var s = res.summary;
      var summaryHtml = '<div class="meta-bar">樣本數 ' + s.sampleSize +

  function uploadHistoryFileInChunks(text, fileName, resultEl) {
    var CHUNK_CHARS = 2 * 1024 * 1024; // 每段約 2MB 文字，避免單次呼叫塞太大
    var lines = text.split(/\r\n|\n/);
    var chunks = [];
    var cur = '';
    for (var i = 0; i < lines.length; i++) {
      var lineWithBreak = lines[i] + '\n';
      if (cur.length > 0 && cur.length + lineWithBreak.length > CHUNK_CHARS) {
        chunks.push(cur);
        cur = '';
      }
      cur += lineWithBreak;
    }
    if (cur.length > 0) chunks.push(cur);
    sendUploadChunk_(chunks, 0, null, fileName, resultEl);
  }

  function sendUploadChunk_(chunks, index, fileId, fileName, resultEl) {
    resultEl.innerHTML = '<div class="loading">上傳中（第 ' + (index + 1) + ' / ' + chunks.length + ' 段）...</div>';
    withSpin(callServer('uploadHistoryFileChunk', fileId, chunks[index], fileName)).then(function (res) {
      if (index + 1 < chunks.length) {
        sendUploadChunk_(chunks, index + 1, res.fileId, fileName, resultEl);
      } else {
        resultEl.innerHTML = '<div class="meta-bar">✅ 上傳完成，開始匯入...</div>';
        var uploadedFileId = res.fileId;
        runImportLoop(uploadedFileId, 0, resultEl, 0, function () {
          // 上傳用的暫存原始檔匯完就沒用了，清掉避免堆積在歷史資料資料夾裡
          callServer('deleteFile', uploadedFileId).catch(function () { /* 清理失敗不影響匯入結果，忽略即可 */ });
        });
      }
    }).catch(function (err) { resultEl.innerHTML = errorBox(err); });
  }

  function runImportLoop(input, startRow, resultEl, iteration, onDone) {
    if (iteration > 50) {
      resultEl.innerHTML = errorBox('已經連續匯入 50 批還沒結束，先停下來確認一下檔案內容或執行紀錄，需要的話可以再手動繼續。');
      return;
    }
    resultEl.innerHTML = '<div class="loading">匯入中' + (startRow > 0 ? '（已處理 ' + startRow + ' 列）' : '') + '，資料量大時請耐心等候...</div>';
    withSpin(callServer('importHistoryFromDriveFile', input, startRow)).then(function (res) {
      if (res.done) {
        resultEl.innerHTML = '<div class="meta-bar">✅ 匯入完成，共處理 ' + res.totalRows + ' 列（來源：' + escapeHtml(res.fileName) + '）</div>';
        loadedTabs.dashboard = false;
        if (onDone) onDone();
      } else {
        resultEl.innerHTML = '<div class="meta-bar">處理中… 已完成 ' + res.processedThrough + ' / ' + res.totalRows + ' 列，自動繼續下一批…</div>';
        runImportLoop(input, res.nextStart, resultEl, iteration + 1, onDone);
      }
    }).catch(function (err) { resultEl.innerHTML = errorBox(err); });
  }

  document.getElementById('importLatestBtn').addEventListener('click', function () {
    var el = document.getElementById('importLatestCandidates');
    el.innerHTML = '<div class="loading">讀取資料夾檔案清單中...</div>';
    withSpin(callServer('listHistoryFolderCandidates', null)).then(function (files) {
      if (!files.length) { el.innerHTML = '<div class="empty-hint">這個資料夾裡沒有檔案</div>'; return; }
      var rows = files.map(function (f, i) {
        var btn = f.tooLargeForDirectImport
          ? '<button disabled title="檔案太大，改用上面「直接上傳 CSV 並匯入」">太大，改用上傳</button>'
          : '<button data-file-id="' + escapeHtml(f.fileId) + '">' + (i === 0 ? '匯入（最新）' : '匯入這個') + '</button>';
        return '<tr' + (i === 0 ? ' style="font-weight:600;"' : '') + '><td>' + escapeHtml(f.name) + '</td>' +
          '<td>' + escapeHtml(f.detectedDate) + '（' + escapeHtml(f.detectedBy) + '）</td>' +
          '<td>' + escapeHtml(f.sizeLabel) + '</td><td>' + btn + '</td></tr>';
      }).join('');
      el.innerHTML = '<div class="table-scroll"><table class="simple-table"><thead><tr>' +
        '<th>檔名</th><th>判斷出的日期</th><th>大小</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>';
      el.querySelectorAll('button[data-file-id]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var resultEl = document.getElementById('importHistoryResult');
          runImportLoop(btn.getAttribute('data-file-id'), 0, resultEl, 0);
        });
      });
    }).catch(function (err) { el.innerHTML = errorBox(err); });
  });

  // ---------- 資料範圍重新彙整 ----------
  document.getElementById('remergeForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var start = document.getElementById('remergeStart').value;
    var end = document.getElementById('remergeEnd').value;
    if (!start || !end) return;
    runRemergeLoop(start, end, document.getElementById('remergeResult'), { succeeded: [], failed: [], skipped: [] }, 0);
  });

  function runRemergeLoop(start, end, resultEl, acc, iteration) {
    if (iteration > 50) {
      resultEl.innerHTML = errorBox('已經連續跑了 50 批還沒結束，先停下來看看執行紀錄，需要的話可以縮小區間再試一次。');
      return;
    }
    resultEl.innerHTML = '<div class="loading">重新彙整中' + (acc.succeeded.length ? '（已完成 ' + acc.succeeded.length + ' 天）' : '') + '...</div>';
    withSpin(callServer('backfillHistory', start, end)).then(function (res) {
      acc.succeeded = acc.succeeded.concat(res.succeeded);
      acc.failed = acc.failed.concat(res.failed);
      acc.skipped = acc.skipped.concat(res.skipped);
      if (res.done) {
        var summary = '<div class="meta-bar">✅ 完成：成功 ' + acc.succeeded.length + ' 天、略過 ' + acc.skipped.length + ' 天' +
          (acc.failed.length ? '、失敗 ' + acc.failed.length + ' 天' : '') + '</div>';
        var failHtml = acc.failed.length ?
          '<div class="table-scroll"><table class="simple-table"><thead><tr><th>日期</th><th>錯誤</th></tr></thead><tbody>' +
          acc.failed.map(function (f) { return '<tr><td>' + escapeHtml(f.date) + '</td><td>' + escapeHtml(f.error) + '</td></tr>'; }).join('') +
          '</tbody></table></div>' : '';
        resultEl.innerHTML = summary + failHtml;
        loadedTabs.dashboard = false;
      } else {
        runRemergeLoop(res.nextStart, end, resultEl, acc, iteration + 1);
      }
    }).catch(function (err) { resultEl.innerHTML = errorBox(err); });
  }

  // ---------- 資料總覽 ----------
  function loadDataTab_() {
    return Promise.all([loadHistoryOverview_(), loadBqUsage_(), loadBqPricing_()]);
  }

  function loadBqUsage_() {
    return callServer('getBigQueryUsageSummary', 30).then(function (s) {
      document.getElementById('bqUsageSummary').textContent =
        '今天預估費用：$' + fmtNum(s.todayCost, 4) + '　近 ' + s.days + ' 天共 ' + s.totalCalls +
        ' 次查詢，掃描 ' + formatBytesJs_(s.totalBytes) + '，預估總費用 $' + fmtNum(s.totalCost, 4);
      var tableEl = document.getElementById('bqUsageTable');
      if (!s.daily.length) { tableEl.innerHTML = ''; return; }
      var rows = s.daily.map(function (d) {
        return '<tr><td>' + escapeHtml(d.date) + '</td><td>' + d.calls + '</td>' +
          '<td>' + formatBytesJs_(d.bytes) + '</td><td>$' + fmtNum(d.cost, 4) + '</td></tr>';
      }).join('');
      tableEl.innerHTML = '<div class="table-scroll"><table class="simple-table"><thead><tr>' +
        '<th>日期</th><th>次數</th><th>掃描量</th><th>預估費用</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
    }).catch(function (err) { document.getElementById('bqUsageSummary').innerHTML = errorBox(err); });
  }

  function formatBytesJs_(bytes) {
    if (!bytes) return '0 B';
    var units = ['B', 'KB', 'MB', 'GB', 'TB'];
    var v = bytes, i = 0;
    while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
    return v.toFixed(1) + ' ' + units[i];
  }

  function loadBqPricing_() {
    return callServer('getBigQueryPricing').then(function (p) {
      document.getElementById('bqPricePerTb').value = p.pricePerTb;
    });
  }

  document.getElementById('bqPricingForm').addEventListener('submit', function (e) {
    e.preventDefault();
    withSpin(callServer('setBigQueryPricing', document.getElementById('bqPricePerTb').value)).then(function () {
      alert('✅ 已儲存單價設定');
    }).catch(function (err) { alert(err.message || err); });
  });

  function loadHistoryOverview_() {
    var el = document.getElementById('historyOverviewResult');
    el.innerHTML = '<div class="loading">讀取統計中...</div>';
    return withSpin(callServer('getHistoryOverview')).then(function (o) {
      if (o.mode === 'external' || o.mode === 'materialized') {
        if (!o.min) { el.innerHTML = '<div class="empty-hint">歷史資料夾裡還沒有任何資料</div>'; return; }
        var modeLabel = o.mode === 'materialized' ? 'materialized，自動整理進 BigQuery 原生表' : 'external，直接讀 Drive 檔案';
        el.innerHTML = '<div class="meta-bar">資料來源：BigQuery（' + modeLabel + '）' +
          (o.lastRefresh ? '　上次重新整理：' + escapeHtml(o.lastRefresh) : '') + '</div>' +
          '<table class="simple-table"><tbody>' +
          '<tr><td>資料日期範圍</td><td>' + escapeHtml(o.min) + ' ～ ' + escapeHtml(o.max) + '</td></tr>' +
          '<tr><td>交易日數</td><td>' + fmtNum(o.tradingDays, 0) + '</td></tr>' +
          '<tr><td>股票數（去重後）</td><td>' + fmtNum(o.stockCount, 0) + '</td></tr>' +
          '<tr><td>總列數（去重後）</td><td>' + fmtNum(o.rowCount, 0) + '</td></tr>' +
          '</tbody></table>';
      } else {
        el.innerHTML = '<div class="meta-bar">資料來源：Apps Script 直讀 Drive 月份檔案（native）</div>' +
          '<table class="simple-table"><tbody>' +
          '<tr><td>資料日期範圍</td><td>' + (o.min ? escapeHtml(o.min) + ' ～ ' + escapeHtml(o.max) : '尚無資料') + '</td></tr>' +
          '<tr><td>月份檔案數</td><td>' + fmtNum(o.monthsAvailable, 0) + '</td></tr>' +
          '</tbody></table>' +
          '<div class="meta-bar" style="margin-top:8px;">要看更完整的統計（股票數、總列數），到「研究」→「因子回歸模型」把資料來源模式切成 external。</div>';
      }
    }).catch(function (err) { el.innerHTML = errorBox(err); });
  }

  document.getElementById('overviewRefreshBtn').addEventListener('click', function () { loadHistoryOverview_(); });

  function loadRunLog() {
    return callServer('getRecentRunLogs', 50).then(function (logs) {
      var el = document.getElementById('runLogList');
      if (!logs.length) { el.innerHTML = '<div class="empty-hint">尚無執行紀錄</div>'; return; }
      el.innerHTML = logs.map(function (l) {
        var cls = l['狀態'] === '成功' ? 'ok' : (l['狀態'] === '失敗' ? 'fail' : 'skip');
        return '<div class="log-item"><span class="log-status ' + cls + '">[' + escapeHtml(l['狀態']) + ']</span> ' +
          escapeHtml(l['時間戳記']) + ' · ' + escapeHtml(l['類型']) + '<br>' + escapeHtml(l['訊息']) + '</div>';
      }).join('');
    });
  }

  var currentFolder = 'archive';
  document.querySelectorAll('.folder-tab-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('.folder-tab-btn').forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      currentFolder = btn.getAttribute('data-folder');
      loadFileList(currentFolder);
    });
  });

  function loadFileList(folderKey) {
    var el = document.getElementById('fileList');
    el.innerHTML = '<div class="loading">載入中...</div>';
    return callServer('listFiles', folderKey).then(function (files) {
      if (!files.length) { el.innerHTML = '<div class="empty-hint">這個資料夾目前沒有檔案</div>'; return; }
      el.innerHTML = files.map(function (f) {
        return '<div class="file-item"><div><div>' + escapeHtml(f.name) + '</div>' +
          '<div class="file-meta">' + escapeHtml(f.sizeLabel) + ' · ' + escapeHtml(f.updated) + '</div></div>' +
          '<div class="form-actions" style="margin:0;"><a href="' + escapeHtml(f.url) + '" target="_blank" rel="noopener">開啟</a>' +
          '<button type="button" class="btn-danger file-delete" data-id="' + escapeHtml(f.id) + '">刪除</button></div></div>';
      }).join('');
      el.querySelectorAll('.file-delete').forEach(function (btn) {
        btn.addEventListener('click', function () {
          if (!confirm('確定要刪除這個檔案嗎？（會移到 Google Drive 垃圾桶）')) return;
          callServer('deleteFile', btn.getAttribute('data-id')).then(function () { loadFileList(currentFolder); });
        });
      });
    }).catch(function (err) { el.innerHTML = errorBox(err); });
  }


  // ---------- App 開機 ----------
  function boot() {
    var today = new Date().toISOString().slice(0, 10);
    document.getElementById('btEnd').value = today;
    var d = new Date(); d.setDate(d.getDate() - 30);
    document.getElementById('btStart').value = d.toISOString().slice(0, 10);

    callServer('bootstrap').then(function (info) {
      window.__spreadsheetUrl = info.spreadsheetUrl;
      document.getElementById('spreadsheetLink').setAttribute('href', info.spreadsheetUrl);
      document.getElementById('historyFolderLink').setAttribute('href', info.historyFolderUrl || '#');
      loadDashboard();
    }).catch(function (err) {
      document.getElementById('dashboardList').innerHTML = errorBox(err);
    });
  }

  boot();
})();
</script>

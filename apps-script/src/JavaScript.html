<script>
(function () {
  'use strict';

  // ---------- 共用工具 ----------
  function escapeHtml(s) {
    return String(s === null || s === undefined ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function callServer(fnName) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      var runner = google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(function (err) { reject(err); });
      runner[fnName].apply(runner, args);
    });
  }

  function fmtNum(v, digits) {
    if (v === null || v === undefined || isNaN(v)) return '-';
    return Number(v).toLocaleString('zh-TW', { maximumFractionDigits: digits === undefined ? 2 : digits });
  }

  function errorBox(msg) {
    return '<div class="error-box">⚠️ ' + escapeHtml(msg && msg.message ? msg.message : msg) + '</div>';
  }

  var refreshBtn = document.getElementById('refreshBtn');
  function withSpin(promise) {
    refreshBtn.classList.add('spinning');
    return promise.finally(function () { refreshBtn.classList.remove('spinning'); });
  }

  // ---------- Tab 切換 ----------
  var TAB_TITLES = {
    dashboard: '戰報與個股', portfolio: '持股庫存',
    research: '策略研究', admin: '系統與資料後台'
  };
  var loadedTabs = {};

  function activateTab(tab) {
    document.querySelectorAll('.tab-panel').forEach(function (el) { el.classList.remove('active'); });
    document.querySelectorAll('.nav-btn').forEach(function (el) { el.classList.remove('active'); });
    document.getElementById('tab-' + tab).classList.add('active');
    document.querySelector('.nav-btn[data-tab="' + tab + '"]').classList.add('active');
    document.getElementById('topbarTitle').textContent = TAB_TITLES[tab];
    ensureTabLoaded(tab);
  }

  function ensureTabLoaded(tab, force) {
    if (loadedTabs[tab] && !force) return;
    loadedTabs[tab] = true;
    if (tab === 'dashboard') loadDashboard();
    if (tab === 'portfolio') loadPortfolio();
    if (tab === 'admin') loadAdmin();
    if (tab === 'research') loadResearchTab_();
  }

  document.querySelectorAll('.nav-btn').forEach(function (btn) {
    btn.addEventListener('click', function () { activateTab(btn.getAttribute('data-tab')); });
  });

  refreshBtn.addEventListener('click', function () {
    var activeTab = document.querySelector('.nav-btn.active').getAttribute('data-tab');
    // 最新戰報的重新整理分兩種完全不同量級的動作（單純重讀已存好的結果 vs. 真的去抓證交所
    // 資料重算），原本點一下圖示就直接跑最重的那條路徑，使用者分不清楚接下來要等多久、
    // 會不會消耗資料額度，改成明確彈出兩個選項讓使用者自己選。
    if (activeTab === 'dashboard') { showRefreshActionSheet_(); return; }
    if (activeTab === 'portfolio') withSpin(loadPortfolio());
    else if (activeTab === 'admin') withSpin(loadAdmin());
  });

  /** 通用 bottom sheet 開關（action sheet 跟個股詳情 modal 共用同一套顯示/隱藏邏輯）。 */
  function openSheet_(overlayEl) { overlayEl.classList.remove('hidden'); }
  function closeSheet_(overlayEl) { overlayEl.classList.add('hidden'); }

  var refreshActionSheet = document.getElementById('refreshActionSheet');
  function showRefreshActionSheet_() {
    openSheet_(refreshActionSheet);
  }
  function hideRefreshActionSheet_() { closeSheet_(refreshActionSheet); }
  document.getElementById('refreshSheetCloseBtn').addEventListener('click', hideRefreshActionSheet_);
  document.getElementById('refreshSheetCancel').addEventListener('click', hideRefreshActionSheet_);
  refreshActionSheet.addEventListener('click', function (e) { if (e.target === refreshActionSheet) hideRefreshActionSheet_(); });
  document.getElementById('refreshSheetLight').addEventListener('click', function () {
    hideRefreshActionSheet_();
    withSpin(loadDashboard(false));
  });
  document.getElementById('refreshSheetRecompute').addEventListener('click', function () {
    hideRefreshActionSheet_();
    withSpin(loadDashboard(true));
  });

  // ---------- 最新戰報 ----------
  var STRATEGY_HINT = {
    '🛑 止盈/止損': 'var(--red)',
    '🛡️ 持股守護': 'var(--green)',
    '🚀 趨勢啟動': 'var(--accent)',
    '🔥 趨勢領航': 'var(--amber)'
  };

  /**
   * 篩選漏斗明細：不管是「0 檔訊號」自動叫出來、還是使用者主動按按鈕叫出來（不管當次篩選結果
   * 是 0 檔還是有訊號），畫面都一樣——不只在「沒訊號」時才看得到漏斗，平常也能拿來確認每一關
   * 卡掉了多少檔股票，或用來對照不同篩選/因子版本之間漏斗人數的差異。
   * d.stages 是一份有順序的關卡清單（見 Analysis.gs screeningFunnelStages_），之後如果換一套
   * 不同的篩選/因子版本、關卡定義完全不同，伺服器端只要回傳同樣 {label, count, note} 形狀的
   * 陣列，這裡完全不用改。
   */
  function loadScreeningDiagnostics_(containerEl) {
    containerEl.innerHTML = '<div class="loading">讀取篩選漏斗明細中...</div>';
    callServer('getScreeningDiagnostics').then(function (d) {
      var headerNote = d.latestDate
        ? ('篩選漏斗明細（' + escapeHtml(d.latestDate) + '，共 ' + fmtNum(d.totalStocks, 0) + ' 檔股票，其中 ' + fmtNum(d.holdingCount, 0) + ' 檔是持股不算在漏斗內）：')
        : ('⚠️ 掃描到 ' + fmtNum(d.totalStocks, 0) + ' 檔資料，沒有找到任何一天可用的戰報資料——不是篩選篩掉的，' +
           '是根本沒讀到資料，請到「系統與資料後台」檢查資料來源設定／資料範圍是不是正常。');
      var rows = (d.stages || []).map(function (s) {
        return '<tr><td>' + escapeHtml(s.label) + '</td><td>' + fmtNum(s.count, 0) + (s.note ? '（' + escapeHtml(s.note) + '）' : '') + '</td></tr>';
      }).join('');
      // savedToReport 是 false（明確標記過，不是舊快取沒有這個欄位的 undefined）代表這份漏斗
      // 是「查看篩選漏斗明細」自己臨時算出來的，不是「重新計算戰報」存過的結果——如果剛好這次
      // 查到有訊號，一定要講清楚「還沒存檔」，不然使用者會覺得漏斗有數字、戰報頁卻是空的很怪。
      var unsavedNote = '';
      if (d.savedToReport === false && d.reportCount > 0) {
        unsavedNote = '<div class="error-box" style="margin-top:8px;">⚠️ 這是即時查詢結果：目前資料實際上會產生 ' +
          fmtNum(d.reportCount, 0) + ' 檔訊號，但這次「查看篩選漏斗明細」不會存檔——回到戰報頁按右上角🔄選' +
          '「重新計算戰報」才會真的存成正式戰報，並顯示在戰報列表裡。</div>';
      }
      containerEl.innerHTML = '<div class="meta-bar">' + headerNote + '</div>' + unsavedNote +
        (rows ? '<table class="simple-table"><tbody>' + rows + '</tbody></table>' +
          '<div class="meta-bar" style="margin-top:8px;">如果「無法計算」的數字接近總股票數，通常代表資料有問題（常見於 BigQuery external 模式欄位順序對錯）；' +
          '如果數字都正常但某一關就是掉到 0，代表確實沒有股票同時符合這麼嚴格的條件，是策略設計上會發生的正常情況。</div>' : '');
    }).catch(function (err) { containerEl.innerHTML = errorBox(err); });
  }

  /**
   * forceRefresh 為 false（頁面打開、切回這頁、或背景重新計算 job 剛做完）：只讀 Reports
   * 分頁上「最近一次」存的戰報，純讀取、絕對不會觸發任何計算，就算 BigQuery 那邊有問題也
   * 不會在單純打開頁面時爆出來；同時會先檢查一次有沒有背景 job 正在跑，有的話改顯示進度。
   * forceRefresh 為 true（action sheet 選「重新計算戰報」）：排一個背景 job，根據目前已有的
   * 歷史資料重新跑一次完整分析。向證交所抓新資料是另一件事，不在這裡做——要抓最新資料請到
   * 「系統與資料後台」→「立即測試執行」，抓完之後再回這裡選「重新計算戰報」。
   *
   * 用背景 job（時間觸發器）而不是直接同步呼叫 runAnalysisAndSave，是因為手機切到背景／
   * 螢幕關掉很容易讓瀏覽器中斷這次連線，google.script.run 的 success handler 永遠不會被
   * 觸發，畫面就卡死在「分析中」——即使 Apps Script 那邊其實已經算完了。改成排背景 job 後，
   * 這次呼叫只是「排工作」立刻回傳，實際運算在獨立觸發的執行裡進行，前端改用輪詢
   * getAnalysisJobStatus() 顯示進度，不受連線中斷影響。
   */
  function todayDateStr_() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  var DATA_SOURCE_LABEL = {
    native: 'Drive 月份檔案（native）',
    external: 'BigQuery external',
    materialized: 'BigQuery materialized'
  };

  function loadDashboard(forceRefresh) {
    if (forceRefresh) return startAnalysisRecomputeJob_();
    var listEl = document.getElementById('dashboardList');
    listEl.innerHTML = '<div class="loading">載入中...</div>';
    return withSpin(callServer('getAnalysisJobStatus')).then(function (jobState) {
      if (jobState && jobState.status === 'running') {
        showAnalysisJobRunning_();
        pollAnalysisJob_();
        return;
      }
      return renderCachedDashboard_(false);
    }).catch(function (err) {
      document.getElementById('dashboardMeta').textContent = '';
      listEl.innerHTML = errorBox(err);
    });
  }

  function showAnalysisJobRunning_() {
    document.getElementById('dashboardMeta').textContent = '';
    document.getElementById('dashboardList').innerHTML =
      '<div class="loading">⏳ 背景重新計算戰報中，可以切到別的畫面或關掉螢幕，不會中斷這個工作，' +
      '完成後回來就會看到最新戰報...</div>';
  }

  /** action sheet「重新計算戰報」呼叫：排一個背景 job 就立刻回傳，不用等分析真的跑完。 */
  function startAnalysisRecomputeJob_() {
    showAnalysisJobRunning_();
    return withSpin(callServer('startAnalysisJob')).then(function () {
      pollAnalysisJob_();
    }).catch(function (err) { document.getElementById('dashboardList').innerHTML = errorBox(err); });
  }

  var analysisJobPollTimer_ = null;
  function stopAnalysisJobPoll_() {
    if (analysisJobPollTimer_) { clearInterval(analysisJobPollTimer_); analysisJobPollTimer_ = null; }
  }

  /** 背景工作是在獨立的時間觸發器裡跑的，這裡只是每隔幾秒讀一次目前狀態——就算這個分頁被
   *  關掉、切到背景、輪詢中斷，工作本身完全不受影響，回來重新打開頁面（loadDashboard 一開始
   *  就會檢查一次 job 狀態）就能看到最新（甚至已經做完的）結果，不需要靠這個分頁「撐著」。 */
  function pollAnalysisJob_() {
    stopAnalysisJobPoll_();
    var poll = function () {
      callServer('getAnalysisJobStatus').then(function (state) {
        if (!state || state.status === 'running') return;
        stopAnalysisJobPoll_();
        if (state.status === 'error') {
          document.getElementById('dashboardList').innerHTML = errorBox('背景重新計算失敗：' + state.errorMessage);
          return;
        }
        renderCachedDashboard_(true);
      }).catch(function () {
        // 輪詢本身失敗（例如剛好網路不穩）不代表背景工作失敗，畫面維持現狀，下一次輪詢再試
      });
    };
    poll();
    analysisJobPollTimer_ = setInterval(poll, 3000);
  }

  /** 純讀取 Reports 分頁「最近一次」戰報並渲染，不觸發任何計算。autoShowDiagnostics 為 true
   *  時（剛跑完一次背景重新計算），會直接展開篩選漏斗明細，不用使用者多按一次——不管這次結果
   *  是「掃描到資料但 0 檔訊號」還是「連掃描都掃到 0 筆」，都能立刻看到原因，不用像這次一樣
   *  跑完背景 job 只看到「沒有戰報」四個字卻不知道到底是哪一段出問題。 */
  function renderCachedDashboard_(autoShowDiagnostics) {
    var listEl = document.getElementById('dashboardList');
    var metaEl = document.getElementById('dashboardMeta');
    listEl.innerHTML = '<div class="loading">載入中...</div>';
    return callServer('getCachedDashboardReport').then(function (result) {
      if (result && result.error) {
        // getCachedDashboardReport 自己接住例外、把錯誤內容放進回傳值，而不是讓整次 RPC
        // 失敗——這樣才看得出「真的沒有戰報」跟「讀取途中出錯」是兩件不同的事，不會只看到
        // 一句「目前還沒有任何戰報」卻不知道背後其實是壞掉了。
        metaEl.textContent = '';
        listEl.innerHTML = errorBox('讀取戰報時發生錯誤：' + result.error);
        return;
      }
      if (!result || !result.latestDate) {
        metaEl.textContent = '目前還沒有任何戰報，按右上角🔄選「重新計算戰報」產生一次。';
        listEl.innerHTML = '<div class="form-actions"><button type="button" class="btn-secondary" id="screeningFunnelBtn">🔍 查看篩選漏斗明細</button></div>';
        document.getElementById('screeningFunnelBtn').addEventListener('click', openScreeningFunnelSheet_);
        openScreeningFunnelSheet_();
        return;
      }
      var isToday = result.latestDate === todayDateStr_();
      var rangeNote = result.lookbackStart ? '　使用資料：' + result.lookbackStart + ' ~ ' + result.latestDate : '';
      var sourceNote = result.dataSourceMode ? '　資料來源：' + (DATA_SOURCE_LABEL[result.dataSourceMode] || result.dataSourceMode) : '';
      var noteParts = [];
      if (!isToday) {
        noteParts.push('不是今天，若今天資料已公布，先到「系統與資料後台」按「立即測試執行」抓取，再回來選「重新計算戰報」');
      }
      metaEl.textContent = '戰報日期：' + result.latestDate + '　共 ' + result.report.length + ' 檔訊號' + rangeNote + sourceNote +
        (noteParts.length ? '　' + noteParts.join('；') : '');

      var actionsHtml =
        '<div class="form-actions" style="margin-bottom:10px;">' +
        (result.report.length > 0 ? '<button type="button" class="btn-secondary" id="aiTopPicksBtn">🧠 AI 掃描全部候選，推薦前三檔</button>' : '') +
        '<button type="button" class="btn-secondary" id="screeningFunnelBtn">🔍 查看篩選漏斗明細</button>' +
        '</div>' +
        (result.report.length > 0 ? '<div id="aiTopPicksResult" style="margin-bottom:10px;"></div>' : '');

      if (result.report.length === 0) {
        listEl.innerHTML = actionsHtml + '<div class="empty-hint">這天沒有符合條件的訊號</div>';
        document.getElementById('screeningFunnelBtn').addEventListener('click', openScreeningFunnelSheet_);
        if (autoShowDiagnostics) openScreeningFunnelSheet_();
        return;
      }
      listEl.innerHTML = actionsHtml +
        result.report.map(function (r) {
        var color = STRATEGY_HINT[r['操作策略']] || 'var(--text)';
        var code = r['證券代號'];
        var predReturn = r['因子模型_預測1月報酬'];
        var predResist = r['因子模型_預測抗跌力'];
        var predictedLine = (predReturn === null || predReturn === undefined) ? '' :
          '<div class="stock-card-note" style="opacity:0.8;">因子模型預測：1個月 ' +
          (predReturn >= 0 ? '+' : '') + fmtNum(predReturn * 100, 1) + '%' +
          (predResist === null || predResist === undefined ? '' : '　抗跌力 ' + (predResist >= 0 ? '+' : '') + fmtNum(predResist * 100, 2) + '%') +
          '</div>';
        return '<div class="stock-card">' +
          '<div class="stock-card-head stock-card-open" data-code="' + escapeHtml(code) + '" style="cursor:pointer;">' +
          '<span><span class="stock-card-code">' + escapeHtml(code) + '</span>' +
          '<span class="stock-card-name">' + escapeHtml(r['證券名稱']) + '</span></span>' +
          '<span class="stock-card-score">' + fmtNum(r['Armor_Score'], 1) + '</span>' +
          '</div>' +
          '<div class="stock-card-strategy" style="color:' + color + '">' + escapeHtml(r['操作策略']) + ' · ' + escapeHtml(r['建議動作']) + '</div>' +
          '<div class="stock-card-note">' + escapeHtml(r['實相解讀']) + '</div>' +
          predictedLine +
          '<div class="form-actions">' +
          '<a class="stock-card-link" href="' + escapeHtml(r['監控連結']) + '" target="_blank" rel="noopener">Goodinfo ↗</a>' +
          '<button type="button" class="btn-secondary ai-diagnose-btn" data-code="' + escapeHtml(code) + '">🧠 AI 深度診斷</button>' +
          '</div>' +
          '<div id="aiResult-' + escapeHtml(code) + '"></div>' +
          '</div>';
      }).join('');
      listEl.querySelectorAll('.stock-card-open').forEach(function (headEl) {
        headEl.addEventListener('click', function () { openStockDetailModal_(headEl.getAttribute('data-code')); });
      });
      listEl.querySelectorAll('.ai-diagnose-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          runAiDiagnosisForButton_(btn.getAttribute('data-code'), document.getElementById('aiResult-' + btn.getAttribute('data-code')));
        });
      });
      document.getElementById('aiTopPicksBtn').addEventListener('click', function () {
        runAiTopPicksForButton_(document.getElementById('aiTopPicksResult'));
      });
      document.getElementById('screeningFunnelBtn').addEventListener('click', openScreeningFunnelSheet_);
    }).catch(function (err) {
      metaEl.textContent = '';
      listEl.innerHTML = errorBox(err);
    });
  }

  var AI_PROVIDER_LABEL = { claude: 'Claude API', gemini: 'Gemini API' };

  /** 「AI 掃描全部候選，推薦前三檔」：跟單檔深度診斷不同量級的任務，只用戰報已經算好的
   *  量化欄位做橫向比較，不會對每一檔都額外抓 Goodinfo（候選一多成本會爆掉）。 */
  function runAiTopPicksForButton_(containerEl) {
    var providerLabel = AI_PROVIDER_LABEL[window.__aiProvider] || 'AI';
    containerEl.innerHTML = '<div class="loading">AI 掃描全部候選中，會需要一點時間（要呼叫 ' + providerLabel + '）...</div>';
    withSpin(callServer('runAiTopPicks')).then(function (res) {
      containerEl.innerHTML =
        '<div class="ai-report">' +
        '<div class="meta-bar">掃描 ' + fmtNum(res.candidateCount, 0) + ' 檔候選（' + escapeHtml(res.date) + '）' +
        (res.cost !== undefined ? '　本次預估費用 $' + fmtNum(res.cost, 4) : '') + '</div>' +
        renderMarkdownLite(res.text) +
        '</div>';
    }).catch(function (err) { containerEl.innerHTML = errorBox(err); });
  }

  /** 供戰報卡片與股票詳情 modal 共用：跑一次 AI 診斷並把結果渲染進指定容器。 */
  function runAiDiagnosisForButton_(code, containerEl) {
    var providerLabel = AI_PROVIDER_LABEL[window.__aiProvider] || 'AI';
    containerEl.innerHTML = '<div class="loading">AI 診斷中，會需要一點時間（要呼叫 ' + providerLabel + ' + 抓 Goodinfo）...</div>';
    withSpin(callServer('runAiDiagnosis', [code])).then(function (results) {
      var res = results[0];
      if (!res.ok) { containerEl.innerHTML = errorBox(res.error); return; }
      containerEl.innerHTML =
        '<div class="ai-report">' +
        '<div>最終建議：<span class="ai-verdict-badge">' + escapeHtml(res.verdict) + '</span>' +
        (res.cost !== undefined ? '　<span class="meta-bar" style="display:inline;">本次預估費用 $' + fmtNum(res.cost, 4) + '</span>' : '') + '</div>' +
        renderMarkdownLite(res.text) +
        '</div>';
    }).catch(function (err) { containerEl.innerHTML = errorBox(err); });
  }

  /** 輕量 markdown -> HTML（只處理 AI 診斷模板用到的標題/表格/引用/粗體/清單，不是完整 markdown 解析器）。 */
  function renderMarkdownLite(md) {
    if (!md) return '';
    var lines = String(md).split(/\r?\n/);
    var out = [];
    var tableRows = [];

    function inlineMd(s) {
      return escapeHtml(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    }
    function flushTable() {
      if (tableRows.length === 0) return;
      var rowsHtml = tableRows.map(function (cells, idx) {
        var tag = idx === 0 ? 'th' : 'td';
        return '<tr>' + cells.map(function (c) { return '<' + tag + '>' + inlineMd(c.trim()) + '</' + tag + '>'; }).join('') + '</tr>';
      }).join('');
      out.push('<div class="table-scroll"><table class="simple-table">' + rowsHtml + '</table></div>');
      tableRows = [];
    }

    lines.forEach(function (line) {
      var tableMatch = line.match(/^\s*\|(.+)\|\s*$/);
      if (tableMatch) {
        var cells = tableMatch[1].split('|');
        var isSeparator = cells.every(function (c) { return /^\s*:?-+:?\s*$/.test(c); });
        if (!isSeparator) tableRows.push(cells);
        return;
      }
      flushTable();

      if (/^\s*---+\s*$/.test(line)) { out.push('<hr>'); return; }
      var h = line.match(/^(#{1,6})\s+(.*)$/);
      if (h) { out.push('<h' + (h[1].length <= 2 ? 4 : 5) + '>' + inlineMd(h[2]) + '</h' + (h[1].length <= 2 ? 4 : 5) + '>'); return; }
      var bq = line.match(/^>\s?(.*)$/);
      if (bq) { out.push('<blockquote>' + inlineMd(bq[1]) + '</blockquote>'); return; }
      var li = line.match(/^\s*[*-]\s+(.*)$/);
      if (li) { out.push('<div class="md-li">• ' + inlineMd(li[1]) + '</div>'); return; }
      if (line.trim() === '') return;
      out.push('<p>' + inlineMd(line) + '</p>');
    });
    flushTable();
    return out.join('\n');
  }

      '<div class="chart-card"><h4>法人買賣超（投信+外資+自營商合計，股數）</h4>' +
      '<canvas id="' + instCanvasId + '" height="160"></canvas></div>' +

      '<div class="table-scroll">' + renderScoreHistoryTable(data.scoreHistory) + '</div></div>' +
      '<div class="form-actions" style="margin-bottom:2px;">' +
      '<button type="button" class="btn-secondary" id="quickAddBtn-' + prefix + '">+ 快捷加入持股</button>' +
      '</div>' +

      '<div class="form-actions"><button type="button" class="btn-primary" id="stockAiDiagnoseBtn-' + prefix + '">🧠 針對 ' + escapeHtml(data.code) + ' 跑一次 AI 診斷</button></div>' +
      '<div id="stockAiResult-' + prefix + '"></div>' +
      '<div id="stockAiHistory-' + prefix + '"></div></div>';

    renderPriceChartInto_(priceCanvasId, prefix, data.series);
    renderInstChartInto_(instCanvasId, prefix, data.series);
    document.getElementById('stockAiDiagnoseBtn-' + prefix).addEventListener('click', function () {
      runAiDiagnosisForButton_(data.code, document.getElementById('stockAiResult-' + prefix));

    loadAiDiagnosisHistoryInto_(data.code, document.getElementById('stockAiHistory-' + prefix));

  /** { prefix: { price: Chart, inst: Chart } }——每個 render 目標（main 分頁 / modal）各自的
   *  Chart.js 實例分開存，避免兩邊同時存在時互相 destroy 到對方的圖表。 */
  var stockCharts_ = {};

  function renderPriceChartInto_(canvasId, prefix, series) {
    var ctx = document.getElementById(canvasId).getContext('2d');
    stockCharts_[prefix] = stockCharts_[prefix] || {};
    if (stockCharts_[prefix].price) stockCharts_[prefix].price.destroy();
    stockCharts_[prefix].price = new Chart(ctx, {
      type: 'line',
      data: {
        labels: series.map(function (r) { return r.date; }),
        datasets: [
          { label: '收盤價', data: series.map(function (r) { return r.close; }), borderColor: '#2563eb', pointRadius: 0, tension: 0.1 },
          { label: 'MA5', data: series.map(function (r) { return r.ma5; }), borderColor: '#16a34a', pointRadius: 0, borderWidth: 1 },
          { label: 'MA20', data: series.map(function (r) { return r.ma20; }), borderColor: '#d97706', pointRadius: 0, borderWidth: 1 },
          { label: 'MA60', data: series.map(function (r) { return r.ma60; }), borderColor: '#9333ea', pointRadius: 0, borderWidth: 1 }
        ]
      },
      options: {
        responsive: true,
        interaction: { mode: 'index', intersect: false },
        scales: { x: { ticks: { maxTicksLimit: 6 } } },
        plugins: { legend: { labels: { boxWidth: 12, font: { size: 11 } } } }
      }
    });
  }

  function renderInstChartInto_(canvasId, prefix, series) {
    var ctx = document.getElementById(canvasId).getContext('2d');
    stockCharts_[prefix] = stockCharts_[prefix] || {};
    if (stockCharts_[prefix].inst) stockCharts_[prefix].inst.destroy();
    stockCharts_[prefix].inst = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: series.map(function (r) { return r.date; }),
        datasets: [{
          label: '法人買賣超',
          data: series.map(function (r) { return r.instNet; }),
          backgroundColor: series.map(function (r) { return r.instNet >= 0 ? '#dc2626' : '#16a34a'; })
        }]
      },
      options: {
        responsive: true,
        scales: { x: { ticks: { maxTicksLimit: 6 } } },
        plugins: { legend: { display: false } }
      }
    });
  }

  /**
   * 「立即重新整理」（materialized 模式）改成背景 job：資料夾裡檔案一多，要讀每個檔案的
   * 標題列 + 跑 CREATE OR REPLACE TABLE AS SELECT，容易超過瀏覽器/行動網路能穩定撐住的
   * 連線時間，跟因子迴歸、重新計算戰報是同一類問題。這次呼叫只是「排工作」立刻回傳，
   * 前端改用輪詢 getMaterializeJobStatus() 顯示進度，並明確列出涵蓋了哪幾個來源檔案
   * （只顯示數字看不出是不是漏掉了預期的檔案）。
   */
  document.getElementById('bqMaterializeBtn').addEventListener('click', function () {
    var resultEl = document.getElementById('bqDbActionResult');
    resultEl.innerHTML = '<div class="loading">⏳ 背景重新整理中，可以切到別的畫面或關掉螢幕，不會中斷，資料量大時可能要一兩分鐘...</div>';
    withSpin(callServer('startMaterializeJob')).then(function () {
      pollMaterializeJob_();

  var materializePollTimer_ = null;
  function stopMaterializePoll_() {

  }

  function pollMaterializeJob_() {
    stopMaterializePoll_();
    var poll = function () {
      callServer('getMaterializeJobStatus').then(function (state) {
        if (!state || state.status === 'running') return;
        stopMaterializePoll_();
        renderMaterializeJobResult_(state);
      }).catch(function () {
        // 輪詢本身失敗（例如剛好網路不穩）不代表背景工作失敗，畫面維持現狀，下一次輪詢再試
      });
    };
    poll();
    materializePollTimer_ = setInterval(poll, 3000);
  }

  function renderMaterializeJobResult_(state) {
    var resultEl = document.getElementById('bqDbActionResult');
    if (state.status === 'error') { resultEl.innerHTML = errorBox('背景重新整理失敗：' + state.errorMessage); return; }
    var names = state.fileNames || [];
    resultEl.innerHTML = '<div class="meta-bar">✅ 已重新整理，涵蓋 ' + fmtNum(state.fileCount, 0) + ' 個來源檔案' +

  /** 「系統與資料後台」頁籤打開時檢查一次，避免使用者關掉分頁又重新打開後，完全不知道背景工作
   *  跑到哪、甚至早就做完了。只有真的有 job（狀態是 running）時才顯示/開始輪詢。 */
  function checkMaterializeJobOnLoad_() {

        document.getElementById('bqDbActionResult').innerHTML =

        pollMaterializeJob_();
        return;
      }
      if (state && (state.status === 'done' || state.status === 'error')) renderMaterializeJobResult_(state);
    }).catch(function () { /* 開機檢查失敗不擋其他頁面內容載入 */ });
  }

  function loadBqMaterializedStatus_() {

  document.getElementById('bqSyncBtn').addEventListener('click', function () {

    withSpin(callServer('listSyncableMonths')).then(function (months) {
      if (!months.length) {
        resultEl.innerHTML = '<div class="meta-bar">⚠️ 目前歷史資料夾裡沒有 <code>YYYY-MM_ALL_COMBINED.csv</code> 格式的月份檔案可以同步。' +
          '如果資料夾裡是舊格式的彙整表（例如「起始日_結束日_ALL_COMBINED.csv」），要先用上面「匯入既有彙整表」' +
          '把它匯入成月份檔案，才會有東西可以同步到 BigQuery。</div>';
        return;
      }
      runBqSyncLoop_(months, 0, [], resultEl);
    }).catch(function (err) { resultEl.innerHTML = errorBox(err); });
  });

  function runBqSyncLoop_(months, index, done, resultEl) {
    if (index >= months.length) {
      resultEl.innerHTML = '<div class="meta-bar">✅ 已同步 ' + done.length + ' 個月份：' + done.join(', ') + '</div>';
      return;
    }
    var month = months[index];
    resultEl.innerHTML = '<div class="loading">同步中（' + (index + 1) + ' / ' + months.length + '）：' + month + '_ALL_COMBINED.csv ...</div>';
    withSpin(callServer('syncOneMonthToBigQuery', month)).then(function () {
      done.push(month);
      runBqSyncLoop_(months, index + 1, done, resultEl);
    }).catch(function (err) {
      resultEl.innerHTML = '<div class="meta-bar">已同步：' + done.join(', ') + '</div>' +
        errorBox('同步「' + month + '」失敗：' + (err.message || err));
    });
  }

  /**
   * 「執行因子迴歸」改成背景 job：BQML 對兩個 label 各跑一次訓練+評估+取權重，實測常常超過
   * 手機瀏覽器能穩定撐住的連線時間，切到背景更容易連線直接中斷，變成「NetworkError: 連線
   * 失敗，原因 HTTP 0」——即使 BigQuery 那邊其實還在跑或已經跑完。改成排背景 job 後，這次
   * 呼叫只是「排工作」立刻回傳，前端改用輪詢 getFactorRegressionJobStatus() 顯示進度。
   */
  document.getElementById('bqRegressionBtn').addEventListener('click', function () {
    var resultEl = document.getElementById('bqActionResult');
    resultEl.innerHTML = '<div class="loading">⏳ 背景執行因子迴歸中，可以切到別的畫面或關掉螢幕，不會中斷這個工作，通常要一到兩分鐘...</div>';
    withSpin(callServer('startFactorRegressionJob', null)).then(function () {
      pollFactorRegressionJob_();
    }).catch(function (err) { resultEl.innerHTML = errorBox(err); });
  });

  var factorRegressionPollTimer_ = null;
  function stopFactorRegressionPoll_() {
    if (factorRegressionPollTimer_) { clearInterval(factorRegressionPollTimer_); factorRegressionPollTimer_ = null; }
  }

  /** 背景工作是在獨立的時間觸發器裡跑的，這裡只是每隔幾秒讀一次目前狀態——就算這個分頁被
   *  關掉、切到背景、輪詢中斷，工作本身完全不受影響。 */
  function pollFactorRegressionJob_() {
    stopFactorRegressionPoll_();
    var poll = function () {
      callServer('getFactorRegressionJobStatus').then(function (state) {
        if (!state || state.status === 'running') return;
        stopFactorRegressionPoll_();
        renderFactorRegressionJobResult_(state);
      }).catch(function () {
        // 輪詢本身失敗（例如剛好網路不穩）不代表背景工作失敗，畫面維持現狀，下一次輪詢再試
      });
    };
    poll();
    factorRegressionPollTimer_ = setInterval(poll, 3000);
  }

  function renderFactorRegressionJobResult_(state) {
    var resultEl = document.getElementById('bqActionResult');
    if (state.status === 'error') { resultEl.innerHTML = errorBox('背景執行因子迴歸失敗：' + state.errorMessage); return; }
    var rows = (state.results || []).map(function (r) {
      if (r.error) return '<div class="meta-bar">' + escapeHtml(r.labelName || r.labelKey) + '：失敗（' + escapeHtml(r.error) + '）</div>';
      var topFeatures = Object.keys(r.weights).slice(0, 5).map(function (k) {
        return k + ': ' + fmtNum(r.weights[k], 4);
      }).join('、');
      return '<div class="meta-bar"><b>' + escapeHtml(r.labelName) + '</b>　R² = ' + fmtNum(r.r2, 4) +
        '<br>權重最高的因子：' + escapeHtml(topFeatures) + '</div>';
    }).join('');
    resultEl.innerHTML = rows || '<div class="empty-hint">沒有結果</div>';
    loadFactorModelHistory_();
  }

  /** 「策略研究」頁籤打開時檢查一次，避免使用者關掉分頁又重新打開後，完全不知道背景工作
   *  跑到哪、甚至早就做完了。只有真的有 job（狀態是 running）時才顯示/開始輪詢。 */
  function checkFactorRegressionJobOnLoad_() {
    return callServer('getFactorRegressionJobStatus').then(function (state) {
      if (state && state.status === 'running') {
        document.getElementById('bqActionResult').innerHTML =
          '<div class="loading">⏳ 背景執行因子迴歸中，可以切到別的畫面或關掉螢幕，不會中斷這個工作...</div>';
        pollFactorRegressionJob_();
        return;
      }
      if (state && (state.status === 'done' || state.status === 'error')) renderFactorRegressionJobResult_(state);
    }).catch(function () { /* 開機檢查失敗不擋其他頁面內容載入 */ });
  }

  function loadFactorModelHistory_() {

      tableEl.querySelectorAll('button[data-ts]').forEach(function (btn) {

  // ---------- 排程佇列（彙整三個背景 job 的狀態，見 JobQueue.gs） ----------
  var JOB_STATUS_LABEL = { idle: '閒置', running: '⏳ 執行中', done: '✅ 完成', error: '⚠️ 錯誤', cancelled: '已取消' };
  var JOB_STATUS_COLOR = {
    idle: 'var(--text-muted)', running: 'var(--accent)', done: 'var(--green)',
    error: 'var(--red)', cancelled: 'var(--amber)'
  };
  var jobQueuePollTimer_ = null;

  function stopJobQueuePoll_() {
    if (jobQueuePollTimer_) { clearInterval(jobQueuePollTimer_); jobQueuePollTimer_ = null; }
  }

  function loadJobQueue_() {
    var listEl = document.getElementById('jobQueueList');
    return callServer('getJobQueueOverview').then(renderJobQueue_).catch(function (err) { listEl.innerHTML = errorBox(err); });
  }

  // 時間觸發器有時候不知道什麼原因就是沒有真的被 Apps Script 觸發，狀態會卡在 running
  // 卻再也不會有進度更新；「更新時間」超過這個門檻還是 running，就提醒使用者可能已經卡住。
  var JOB_STALE_THRESHOLD_MS = 10 * 60 * 1000;

  function stopJobPollByKey_(key) {
    if (key === 'analysis') stopAnalysisJobPoll_();
    else if (key === 'backfill') stopBackfillPoll_();
    else if (key === 'factorRegression') stopFactorRegressionPoll_();
    else if (key === 'materialize') stopMaterializePoll_();
  }

  function renderJobQueue_(jobs) {
    var listEl = document.getElementById('jobQueueList');
    listEl.innerHTML = jobs.map(function (j) {
      var statusLabel = JOB_STATUS_LABEL[j.status] || j.status;
      var color = JOB_STATUS_COLOR[j.status] || 'var(--text)';
      var updatedLabel = j.updatedAt ? new Date(j.updatedAt).toLocaleString('zh-TW') : '';
      var staleWarning = '';
      if (j.status === 'running' && j.updatedAt && (Date.now() - j.updatedAt) > JOB_STALE_THRESHOLD_MS) {
        var minutesAgo = Math.round((Date.now() - j.updatedAt) / 60000);
        staleWarning = '<div class="error-box" style="margin-top:6px;">⚠️ 已經 ' + minutesAgo + ' 分鐘沒有更新，' +
          '很可能是時間觸發器沒有被正常觸發、卡住了，可以按下面「重新啟動」或「刪除」處理。</div>';
      }
      var actionBtns = '';
      if (j.canRestart) actionBtns += '<button type="button" class="btn-secondary job-restart-btn" data-key="' + escapeHtml(j.key) + '">🔄 重新啟動</button>';
      if (j.canDelete) actionBtns += '<button type="button" class="btn-danger job-delete-btn" data-key="' + escapeHtml(j.key) + '">🗑 刪除</button>';
      return '<div class="stock-card">' +
        '<div class="stock-card-head"><span class="stock-card-code">' + escapeHtml(j.label) + '</span>' +
        '<span style="color:' + color + '; font-weight:700;">' + escapeHtml(statusLabel) + '</span></div>' +
        (updatedLabel ? '<div class="stock-card-note">更新時間：' + escapeHtml(updatedLabel) + '</div>' : '') +
        (j.detail ? '<div class="stock-card-note">' + escapeHtml(j.detail) + '</div>' : '') +
        (j.errorMessage ? '<div class="error-box" style="margin-top:6px;">' + escapeHtml(j.errorMessage) + '</div>' : '') +
        staleWarning +
        (actionBtns ? '<div class="form-actions">' + actionBtns + '</div>' : '') +
        '</div>';
    }).join('');
    listEl.querySelectorAll('.job-restart-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var key = btn.getAttribute('data-key');
        var job = jobs.filter(function (j) { return j.key === key; })[0];
        if (job && job.status === 'running' &&
          !confirm('這個工作目前顯示「執行中」。如果它其實還在背景跑（只是比較慢），重新啟動可能讓兩個工作同時執行、\n' +
            '互相覆蓋彼此的進度；確定它是卡住了（更新時間很久以前）才重新啟動。要繼續嗎？')) return;
        withSpin(callServer('restartJob', key)).then(function () {
          loadJobQueue_();
          // 順便接上該 job 自己頁籤上的進度輪詢，不用切過去該頁籤才看得到即時進度。
          if (key === 'analysis') pollAnalysisJob_();
          else if (key === 'backfill') pollBackfillStatus_();
          else if (key === 'factorRegression') pollFactorRegressionJob_();
          else if (key === 'materialize') pollMaterializeJob_();
        }).catch(function (err) { alert(err.message || err); });
      });
    });
    listEl.querySelectorAll('.job-delete-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var key = btn.getAttribute('data-key');
        if (!confirm('確定要清除這個背景工作的狀態嗎？如果它其實還在執行中，清除只是不再顯示/追蹤，\n' +
          '不會真的中斷那次執行，它跑完後寫回的結果可能會讓這張卡片重新出現。')) return;
        withSpin(callServer('deleteJob', key)).then(function () {
          stopJobPollByKey_(key);
          loadJobQueue_();
        }).catch(function (err) { alert(err.message || err); });
      });
    });
    // 只要還有工作在跑，就每隔幾秒自動重新整理這個區塊；全部結束就停止輪詢，避免無意義的背景請求。
    if (jobs.some(function (j) { return j.status === 'running'; })) {
      if (!jobQueuePollTimer_) jobQueuePollTimer_ = setInterval(loadJobQueue_, 4000);
    } else {
      stopJobQueuePoll_();
    }
  }

  document.getElementById('jobQueueRefreshBtn').addEventListener('click', function () { withSpin(loadJobQueue_()); });

  /** 「強制清空所有背景工作」：把四個 job 狀態都清回 idle，並刪掉任何殘留的相關時間觸發器
   *  （不會動到「每日自動排程」本身）。給「感覺卡住了但排程佇列什麼都沒顯示執行中」的情況用。 */
  document.getElementById('stopAllJobsBtn').addEventListener('click', function () {
    if (!confirm('確定要強制清空所有背景工作嗎？這會把四個工作的狀態都重設成閒置，並刪除任何殘留的相關時間觸發器（不會影響「每日自動排程」）。如果有工作其實還在背景執行中，這個動作不會真的中斷它，只是不再追蹤/顯示。')) return;
    var el = document.getElementById('stopAllJobsResult');
    el.innerHTML = '<div class="loading">清空中...</div>';
    withSpin(callServer('stopAllJobs')).then(function (res) {
      el.innerHTML = '<div class="meta-bar">✅ 已清空所有背景工作狀態，額外刪除 ' + fmtNum(res.removedTriggerCount, 0) + ' 個殘留觸發器。</div>';
      stopAnalysisJobPoll_(); stopBackfillPoll_(); stopFactorRegressionPoll_(); stopMaterializePoll_();
      loadJobQueue_();
    }).catch(function (err) { el.innerHTML = errorBox(err); });
  });

  /** 「測試伺服器連線」：最單純的 google.script.run 往返測試，不碰任何試算表/BigQuery。
   *  如果連這個都失敗/逾時，代表問題出在 RPC 或整個部署本身，不是任何特定功能函式的邏輯。 */
  document.getElementById('pingServerBtn').addEventListener('click', function () {
    var el = document.getElementById('pingServerResult');
    var clientStart = Date.now();
    el.innerHTML = '<div class="loading">呼叫中...</div>';
    withSpin(callServer('pingServer')).then(function (res) {
      var roundTripMs = Date.now() - clientStart;
      if (!res) {
        el.innerHTML = '<div class="error-box">⚠️ 連最單純的 ping 都回傳 null/undefined——問題在 google.script.run 或部署本身，不是任何特定功能函式的邏輯。</div>';
        return;
      }

  function uploadHistoryFileInChunks(text, fileName, resultEl) {
    var CHUNK_CHARS = 2 * 1024 * 1024; // 每段約 2MB 文字，避免單次呼叫塞太大
    var lines = text.split(/\r\n|\n/);
    var chunks = [];
    var cur = '';
    for (var i = 0; i < lines.length; i++) {
      var lineWithBreak = lines[i] + '\n';
      if (cur.length > 0 && cur.length + lineWithBreak.length > CHUNK_CHARS) {
        chunks.push(cur);
        cur = '';
      }
      cur += lineWithBreak;
    }
    if (cur.length > 0) chunks.push(cur);
    sendUploadChunk_(chunks, 0, null, fileName, resultEl);
  }

  function sendUploadChunk_(chunks, index, fileId, fileName, resultEl) {
    resultEl.innerHTML = '<div class="loading">上傳中（第 ' + (index + 1) + ' / ' + chunks.length + ' 段）...</div>';
    withSpin(callServer('uploadHistoryFileChunk', fileId, chunks[index], fileName)).then(function (res) {
      if (index + 1 < chunks.length) {
        sendUploadChunk_(chunks, index + 1, res.fileId, fileName, resultEl);
      } else {
        resultEl.innerHTML = '<div class="meta-bar">✅ 上傳完成，開始匯入...</div>';
        var uploadedFileId = res.fileId;
        runImportLoop(uploadedFileId, 0, resultEl, 0, function () {
          // 上傳用的暫存原始檔匯完就沒用了，清掉避免堆積在歷史資料資料夾裡
          callServer('deleteFile', uploadedFileId).catch(function () { /* 清理失敗不影響匯入結果，忽略即可 */ });
        });
      }
    }).catch(function (err) { resultEl.innerHTML = errorBox(err); });
  }

  function runImportLoop(input, startRow, resultEl, iteration, onDone) {
    if (iteration > 50) {
      resultEl.innerHTML = errorBox('已經連續匯入 50 批還沒結束，先停下來確認一下檔案內容或執行紀錄，需要的話可以再手動繼續。');
      return;
    }
    resultEl.innerHTML = '<div class="loading">匯入中' + (startRow > 0 ? '（已處理 ' + startRow + ' 列）' : '') + '，資料量大時請耐心等候...</div>';
    withSpin(callServer('importHistoryFromDriveFile', input, startRow)).then(function (res) {
      if (res.done) {
        resultEl.innerHTML = '<div class="meta-bar">✅ 匯入完成，共處理 ' + res.totalRows + ' 列（來源：' + escapeHtml(res.fileName) + '）</div>';
        loadedTabs.dashboard = false;
        if (onDone) onDone();
      } else {
        resultEl.innerHTML = '<div class="meta-bar">處理中… 已完成 ' + res.processedThrough + ' / ' + res.totalRows + ' 列，自動繼續下一批…</div>';
        runImportLoop(input, res.nextStart, resultEl, iteration + 1, onDone);
      }
    }).catch(function (err) { resultEl.innerHTML = errorBox(err); });
  }

  var backfillPollTimer_ = null;
  function stopBackfillPoll_() {

  /** 背景工作是在獨立的時間觸發器裡跑的，這裡只是每隔幾秒讀一次目前狀態顯示出來——
   *  就算這個分頁被關掉、切到背景、輪詢中斷，工作本身完全不受影響，回來重新打開頁面
   *  再呼叫一次就能看到最新（甚至已經做完的）結果，不需要靠這個分頁「撐著」。 */
  function pollBackfillStatus_() {
    stopBackfillPoll_();
    var poll = function () {
      callServer('getBackfillJobStatus').then(renderBackfillStatus_).catch(function () {
        // 輪詢本身失敗（例如剛好網路不穩）不代表背景工作失敗，畫面維持現狀，下一次輪詢再試
      });
    };
    poll();
    backfillPollTimer_ = setInterval(poll, 3000);
  }

  function renderBackfillStatus_(state) {
    var resultEl = document.getElementById('remergeResult');
    if (!state || state.status === 'idle') { resultEl.innerHTML = ''; return; }

    var summary = '<div class="meta-bar">已處理：成功 ' + state.succeeded.length + ' 天、略過 ' + state.skipped.length + ' 天' +
      (state.failed.length ? '、失敗 ' + state.failed.length + ' 天' : '') + '</div>';
    var failHtml = state.failed.length ?
      '<div class="table-scroll"><table class="simple-table"><thead><tr><th>日期</th><th>錯誤</th></tr></thead><tbody>' +
      state.failed.map(function (f) { return '<tr><td>' + escapeHtml(f.date) + '</td><td>' + escapeHtml(f.error) + '</td></tr>'; }).join('') +
      '</tbody></table></div>' : '';

    if (state.status === 'running') {
      resultEl.innerHTML = '<div class="loading">⏳ 背景執行中，目前處理到：' + escapeHtml(state.cursor || state.startStr) +
        '（可以切到別的畫面或關掉螢幕，不會中斷這個工作，回來再打開這頁就會看到最新進度）</div>' + summary + failHtml +
        '<div class="form-actions"><button type="button" class="btn-danger" id="remergeCancelBtn">取消</button></div>';
      document.getElementById('remergeCancelBtn').addEventListener('click', function () {
        callServer('cancelBackfillJob').then(renderBackfillStatus_);
      });
      return;
    }
    stopBackfillPoll_();
    if (state.status === 'done') {
      resultEl.innerHTML = '<div class="meta-bar">✅ 完成</div>' + summary + failHtml;
      loadedTabs.dashboard = false;
    } else if (state.status === 'cancelled') {
      resultEl.innerHTML = '<div class="meta-bar">已取消（處理到：' + escapeHtml(state.cursor || '') + '）</div>' + summary + failHtml;
    } else if (state.status === 'error') {
      resultEl.innerHTML = summary + failHtml + errorBox('背景工作發生錯誤：' + state.errorMessage) +
        '<div class="form-actions"><button type="button" class="btn-secondary" id="remergeResumeBtn">從中斷處繼續</button></div>';
      document.getElementById('remergeResumeBtn').addEventListener('click', function () {
        withSpin(callServer('startBackfillJob', state.cursor || state.startStr, state.endStr)).then(function () {
          pollBackfillStatus_();
        }).catch(function (err) { resultEl.innerHTML = errorBox(err); });
      });
    }
  }

  /** 「系統與資料後台」頁籤打開時檢查一次，避免使用者關掉分頁又重新打開後，完全不知道背景工作
   *  跑到哪、甚至早就做完了。只有真的有 job（不是 idle）時才顯示/開始輪詢。 */
  function checkBackfillStatusOnLoad_() {
    return callServer('getBackfillJobStatus').then(function (state) {
      if (state && state.status === 'running') { pollBackfillStatus_(); return; }
      if (state && (state.status === 'done' || state.status === 'cancelled' || state.status === 'error')) {
        renderBackfillStatus_(state);
      }
    }).catch(function () { /* 開機檢查失敗不擋其他頁面內容載入 */ });
  }

  function formatBytesJs_(bytes) {
    if (!bytes) return '0 B';
    var units = ['B', 'KB', 'MB', 'GB', 'TB'];
    var v = bytes, i = 0;
    while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
    return v.toFixed(1) + ' ' + units[i];
  }

    return withSpin(callServer('getHistoryOverview')).then(function (o) {
      if (o.mode === 'external' || o.mode === 'materialized') {
        if (!o.min) { el.innerHTML = '<div class="empty-hint">歷史資料夾裡還沒有任何資料</div>'; return; }
        var modeLabel = o.mode === 'materialized' ? 'materialized，自動整理進 BigQuery 原生表' : 'external，直接讀 Drive 檔案';
        el.innerHTML = '<div class="meta-bar">資料來源：BigQuery（' + modeLabel + '）' +
          (o.lastRefresh ? '　上次重新整理：' + escapeHtml(o.lastRefresh) : '') + '</div>' +
          '<table class="simple-table"><tbody>' +
          '<tr><td>資料日期範圍</td><td>' + escapeHtml(o.min) + ' ～ ' + escapeHtml(o.max) + '</td></tr>' +
          '<tr><td>交易日數</td><td>' + fmtNum(o.tradingDays, 0) + '</td></tr>' +
          '<tr><td>股票數（去重後）</td><td>' + fmtNum(o.stockCount, 0) + (o.stockCount > 3000 ? ' ⚠️ 台股上市櫃合計不到兩千檔，這個數字明顯太高，很可能是 stock_id 格式不一致，按下面「檢查股票代號格式」看細節' : '') + '</td></tr>' +
          '<tr><td>總列數（去重後）</td><td>' + fmtNum(o.rowCount, 0) + '</td></tr>' +
          (o.sizeLabel ? '<tr><td>資料大小</td><td>' + escapeHtml(o.sizeLabel) + '</td></tr>' : '') +
          '</tbody></table>';
      } else {
        el.innerHTML = '<div class="meta-bar">資料來源：Apps Script 直讀 Drive 月份檔案（native）</div>' +
          '<table class="simple-table"><tbody>' +
          '<tr><td>資料日期範圍</td><td>' + (o.min ? escapeHtml(o.min) + ' ～ ' + escapeHtml(o.max) : '尚無資料') + '</td></tr>' +
          '<tr><td>月份檔案數</td><td>' + fmtNum(o.monthsAvailable, 0) + '</td></tr>' +
          '</tbody></table>' +
          '<div class="meta-bar" style="margin-top:8px;">要看更完整的統計（股票數、總列數），到「研究」→「因子回歸模型」把資料來源模式切成 external。</div>';
      }
    }).catch(function (err) { el.innerHTML = errorBox(err); });
  }

  document.getElementById('overviewRefreshBtn').addEventListener('click', function () { loadHistoryOverview_(); });

  document.getElementById('stockIdQualityBtn').addEventListener('click', function () {
    var el = document.getElementById('stockIdQualityResult');
    el.innerHTML = '<div class="loading">檢查中...</div>';
    withSpin(callServer('getHistoryStockIdQualityCheck')).then(function (q) {
      var lengthRows = q.byLength.map(function (r) {
        return '<tr><td>' + fmtNum(r.length, 0) + ' 碼</td><td>' + fmtNum(r.rows, 0) + '</td><td>' + fmtNum(r.distinctIds, 0) + '</td></tr>';
      }).join('');
      var topRows = q.topStocks.map(function (r) {
        return '<tr><td>' + escapeHtml(r.stockId) + '</td><td>' + fmtNum(r.rows, 0) + '</td></tr>';
      }).join('');
      var rareRows = q.rareStocks.map(function (r) {
        return '<tr><td>「' + escapeHtml(r.stockId) + '」</td><td>' + fmtNum(r.rows, 0) + '</td></tr>';
      }).join('');
      el.innerHTML =
        '<div class="meta-bar" style="margin-top:8px;">依「stock_id 字元長度」分組——正常應該幾乎全部是 4 碼（5 碼通常是 ETF），' +
        '如果出現大量非 4/5 碼、或某個長度底下「相異值」遠多於「列數／129」，代表格式跑掉了：</div>' +
        '<table class="simple-table"><thead><tr><td>長度</td><td>列數</td><td>相異 stock_id 數</td></tr></thead><tbody>' + lengthRows + '</tbody></table>' +
        '<div class="meta-bar" style="margin-top:8px;">出現次數最多的 20 個 stock_id（正常股票應該接近交易日數）：</div>' +
        '<table class="simple-table"><thead><tr><td>stock_id</td><td>列數</td></tr></thead><tbody>' + topRows + '</tbody></table>' +
        '<div class="meta-bar" style="margin-top:8px;">出現次數最少的 20 個 stock_id（格式跑掉的變體通常只出現個幾次，注意有沒有多餘空白/換行）：</div>' +
        '<table class="simple-table"><thead><tr><td>stock_id</td><td>列數</td></tr></thead><tbody>' + rareRows + '</tbody></table>';
    }).catch(function (err) { el.innerHTML = errorBox(err); });
  });

  /** 「檢查日期格式」：history_raw 有些列的 date_str 如果格式不是 yyyy-MM-dd（例如舊版寫入邏輯
   *  留下的 'yyyy/MM/dd'），會被 SAFE_CAST(date_str AS DATE) 悄悄忽略，讓最新戰報卡在「格式
   *  正確的最後一天」不會往前進。這裡先查有幾列，使用者確認後才真的刪除（刪除是不可逆的，
   *  刪掉之後那幾天要另外用「手動抓取/重新彙整區間」重新抓一次）。 */
  document.getElementById('malformedDateCheckBtn').addEventListener('click', function () {
    var el = document.getElementById('malformedDateResult');
    el.innerHTML = '<div class="loading">檢查中...</div>';
    withSpin(callServer('getMalformedDateRowCount')).then(function (r) {
      if (r.count === 0) {
        el.innerHTML = '<div class="meta-bar">✅ 沒有發現日期格式錯誤的資料。</div>';
        return;
      }
      el.innerHTML = '<div class="error-box">⚠️ 發現 ' + fmtNum(r.count, 0) + ' 列 history_raw 的日期格式不是 yyyy-MM-dd，' +
        '這些列會讓「最新戰報」卡在格式正確的最後一天讀不到更新的資料。</div>' +
        '<div class="form-actions"><button type="button" class="btn-danger" id="malformedDateCleanupBtn">刪除這些格式錯誤的列</button></div>' +
        '<div class="meta-bar" style="margin-top:6px;">刪除後那幾天等於沒有資料，要另外到「手動抓取/重新彙整區間」把那幾天重新抓一次（這次會用正確格式寫入，不會再壞掉）。</div>';
      document.getElementById('malformedDateCleanupBtn').addEventListener('click', function () {
        if (!confirm('確定要刪除這 ' + r.count + ' 列格式錯誤的資料嗎？刪除後要另外重新抓取那幾天，這個動作無法復原。')) return;
        el.innerHTML = '<div class="loading">刪除中...</div>';
        withSpin(callServer('cleanupMalformedDateRows')).then(function (res) {
          var dates = res.affectedDates || [];
          var rangeNote = dates.length ? ('，受影響日期：' + dates[0] + ' ~ ' + dates[dates.length - 1] + '（共 ' + dates.length + ' 天）') : '';
          el.innerHTML = '<div class="meta-bar">✅ 已刪除 ' + fmtNum(res.deletedCount, 0) + ' 列' + rangeNote + '。</div>' +
            (dates.length ? '<div class="form-actions"><button type="button" class="btn-primary" id="malformedDateFillRemergeBtn">填入下面「手動抓取/重新彙整區間」表單</button></div>' : '');
          if (dates.length) {
            document.getElementById('malformedDateFillRemergeBtn').addEventListener('click', function () {
              document.getElementById('remergeStart').value = dates[0];
              document.getElementById('remergeEnd').value = dates[dates.length - 1];
              document.getElementById('remergeStart').scrollIntoView({ behavior: 'smooth', block: 'center' });
            });
          }
        }).catch(function (err) { el.innerHTML = errorBox(err); });
      });
    }).catch(function (err) { el.innerHTML = errorBox(err); });
  });

  function loadRunLog() {
    return callServer('getRecentRunLogs', 50).then(function (logs) {
      var el = document.getElementById('runLogList');
      if (!logs.length) { el.innerHTML = '<div class="empty-hint">尚無執行紀錄</div>'; return; }
      el.innerHTML = logs.map(function (l) {
        var cls = l['狀態'] === '成功' ? 'ok' : (l['狀態'] === '失敗' ? 'fail' : 'skip');
        return '<div class="log-item"><span class="log-status ' + cls + '">[' + escapeHtml(l['狀態']) + ']</span> ' +
          escapeHtml(l['時間戳記']) + ' · ' + escapeHtml(l['類型']) + '<br>' + escapeHtml(l['訊息']) + '</div>';
      }).join('');
    });
  }

  var currentFolder = 'archive';
  document.querySelectorAll('.folder-tab-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('.folder-tab-btn').forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      currentFolder = btn.getAttribute('data-folder');
      loadFileList(currentFolder);
    });
  });

  function loadFileList(folderKey) {
    var el = document.getElementById('fileList');
    el.innerHTML = '<div class="loading">載入中...</div>';
    return callServer('listFiles', folderKey).then(function (files) {
      if (!files.length) { el.innerHTML = '<div class="empty-hint">這個資料夾目前沒有檔案</div>'; return; }
      el.innerHTML = files.map(function (f) {
        return '<div class="file-item"><div><div>' + escapeHtml(f.name) + '</div>' +
          '<div class="file-meta">' + escapeHtml(f.sizeLabel) + ' · ' + escapeHtml(f.updated) + '</div></div>' +
          '<div class="form-actions" style="margin:0;"><a href="' + escapeHtml(f.url) + '" target="_blank" rel="noopener">開啟</a>' +
          '<button type="button" class="btn-danger file-delete" data-id="' + escapeHtml(f.id) + '">刪除</button></div></div>';
      }).join('');
      el.querySelectorAll('.file-delete').forEach(function (btn) {
        btn.addEventListener('click', function () {
          if (!confirm('確定要刪除這個檔案嗎？（會移到 Google Drive 垃圾桶）')) return;
          callServer('deleteFile', btn.getAttribute('data-id')).then(function () { loadFileList(currentFolder); });
        });
      });
    }).catch(function (err) { el.innerHTML = errorBox(err); });
  }


  // ---------- App 開機 ----------
  function boot() {
    var today = new Date().toISOString().slice(0, 10);
    document.getElementById('btEnd').value = today;
    var d = new Date(); d.setDate(d.getDate() - 30);
    document.getElementById('btStart').value = d.toISOString().slice(0, 10);

    callServer('bootstrap').then(function (info) {
      window.__spreadsheetUrl = info.spreadsheetUrl;
      window.__aiProvider = info.aiProvider;
      document.getElementById('spreadsheetLink').setAttribute('href', info.spreadsheetUrl);
      document.getElementById('historyFolderLink').setAttribute('href', info.historyFolderUrl || '#');
      loadDashboard();
    }).catch(function (err) {
      document.getElementById('dashboardList').innerHTML = errorBox(err);
    });
  }

  boot();
})();
</script>

<script>
(function () {
  'use strict';

  // ---------- 共用工具 ----------
  function escapeHtml(s) {
    return String(s === null || s === undefined ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function callServer(fnName) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      var runner = google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(function (err) { reject(err); });
      runner[fnName].apply(runner, args);
    });
  }

  function fmtNum(v, digits) {
    if (v === null || v === undefined || isNaN(v)) return '-';
    return Number(v).toLocaleString('zh-TW', { maximumFractionDigits: digits === undefined ? 2 : digits });
  }

  function errorBox(msg) {
    return '<div class="error-box">⚠️ ' + escapeHtml(msg && msg.message ? msg.message : msg) + '</div>';
  }

  var refreshBtn = document.getElementById('refreshBtn');
  function withSpin(promise) {
    refreshBtn.classList.add('spinning');
    return promise.finally(function () { refreshBtn.classList.remove('spinning'); });
  }

  // ---------- Tab 切換 ----------
  var TAB_TITLES = {
    dashboard: '戰報與個股', portfolio: '持股庫存',
    research: '策略研究', admin: '系統與資料後台'
  };
  var loadedTabs = {};

  function activateTab(tab) {
    document.querySelectorAll('.tab-panel').forEach(function (el) { el.classList.remove('active'); });
    document.querySelectorAll('.nav-btn').forEach(function (el) { el.classList.remove('active'); });
    document.getElementById('tab-' + tab).classList.add('active');
    document.querySelector('.nav-btn[data-tab="' + tab + '"]').classList.add('active');
    document.getElementById('topbarTitle').textContent = TAB_TITLES[tab];
    ensureTabLoaded(tab);
  }

  function ensureTabLoaded(tab, force) {
    if (loadedTabs[tab] && !force) return;
    loadedTabs[tab] = true;
    if (tab === 'dashboard') loadDashboard();
    if (tab === 'portfolio') loadPortfolio();
    if (tab === 'admin') loadAdmin();
    if (tab === 'research') loadResearchTab_();
  }

  document.querySelectorAll('.nav-btn').forEach(function (btn) {
    btn.addEventListener('click', function () { activateTab(btn.getAttribute('data-tab')); });
  });

  refreshBtn.addEventListener('click', function () {
    var activeTab = document.querySelector('.nav-btn.active').getAttribute('data-tab');
    // 最新戰報的重新整理分兩種完全不同量級的動作（單純重讀已存好的結果 vs. 真的去抓證交所
    // 資料重算），原本點一下圖示就直接跑最重的那條路徑，使用者分不清楚接下來要等多久、
    // 會不會消耗資料額度，改成明確彈出兩個選項讓使用者自己選。
    if (activeTab === 'dashboard') { showRefreshActionSheet_(); return; }
    if (activeTab === 'portfolio') withSpin(loadPortfolio());
    else if (activeTab === 'admin') withSpin(loadAdmin());
  });

  /** 通用 bottom sheet 開關（action sheet 跟個股詳情 modal 共用同一套顯示/隱藏邏輯）。 */
  function openSheet_(overlayEl) { overlayEl.classList.remove('hidden'); }
  function closeSheet_(overlayEl) { overlayEl.classList.add('hidden'); }

  var refreshActionSheet = document.getElementById('refreshActionSheet');
  function showRefreshActionSheet_() {
    openSheet_(refreshActionSheet);
  }
  function hideRefreshActionSheet_() { closeSheet_(refreshActionSheet); }
  document.getElementById('refreshSheetCloseBtn').addEventListener('click', hideRefreshActionSheet_);
  document.getElementById('refreshSheetCancel').addEventListener('click', hideRefreshActionSheet_);
  refreshActionSheet.addEventListener('click', function (e) { if (e.target === refreshActionSheet) hideRefreshActionSheet_(); });
  document.getElementById('refreshSheetLight').addEventListener('click', function () {
    hideRefreshActionSheet_();
    withSpin(loadDashboard(false));
  });
  document.getElementById('refreshSheetRecompute').addEventListener('click', function () {
    hideRefreshActionSheet_();
    withSpin(loadDashboard(true));
  });

  // ---------- 最新戰報 ----------
  var STRATEGY_HINT = {
    '🛑 止盈/止損': 'var(--red)',
    '🛡️ 持股守護': 'var(--green)',
    '🚀 趨勢啟動': 'var(--accent)',
    '🔥 趨勢領航': 'var(--amber)'
  };

  /**
   * 篩選漏斗明細：不管是「0 檔訊號」自動叫出來、還是使用者主動按按鈕叫出來（不管當次篩選結果
   * 是 0 檔還是有訊號），畫面都一樣——不只在「沒訊號」時才看得到漏斗，平常也能拿來確認每一關
   * 卡掉了多少檔股票，或用來對照不同篩選/因子版本之間漏斗人數的差異。
   * d.stages 是一份有順序的關卡清單（見 Analysis.gs screeningFunnelStages_），之後如果換一套
   * 不同的篩選/因子版本、關卡定義完全不同，伺服器端只要回傳同樣 {label, count, note} 形狀的
   * 陣列，這裡完全不用改。
   */
  function loadScreeningDiagnostics_(containerEl) {
    containerEl.innerHTML = '<div class="loading">讀取篩選漏斗明細中...</div>';
    callServer('getScreeningDiagnostics').then(function (d) {
      var headerNote = d.latestDate
        ? ('篩選漏斗明細（' + escapeHtml(d.latestDate) + '，共 ' + fmtNum(d.totalStocks, 0) + ' 檔股票，其中 ' + fmtNum(d.holdingCount, 0) + ' 檔是持股不算在漏斗內）：')
        : ('⚠️ 掃描到 ' + fmtNum(d.totalStocks, 0) + ' 檔資料，沒有找到任何一天可用的戰報資料——不是篩選篩掉的，' +
           '是根本沒讀到資料，請到「系統與資料後台」檢查資料來源設定／資料範圍是不是正常。');
      var rows = (d.stages || []).map(function (s) {
        return '<tr><td>' + escapeHtml(s.label) + '</td><td>' + fmtNum(s.count, 0) + (s.note ? '（' + escapeHtml(s.note) + '）' : '') + '</td></tr>';
      }).join('');
      // savedToReport 是 false（明確標記過，不是舊快取沒有這個欄位的 undefined）代表這份漏斗
      // 是「查看篩選漏斗明細」自己臨時算出來的，不是「重新計算戰報」存過的結果——如果剛好這次
      // 查到有訊號，一定要講清楚「還沒存檔」，不然使用者會覺得漏斗有數字、戰報頁卻是空的很怪。
      var unsavedNote = '';
      if (d.savedToReport === false && d.reportCount > 0) {
        unsavedNote = '<div class="error-box" style="margin-top:8px;">⚠️ 這是即時查詢結果：目前資料實際上會產生 ' +
          fmtNum(d.reportCount, 0) + ' 檔訊號，但這次「查看篩選漏斗明細」不會存檔——回到戰報頁按右上角🔄選' +
          '「重新計算戰報」才會真的存成正式戰報，並顯示在戰報列表裡。</div>';
      }
      containerEl.innerHTML = '<div class="meta-bar">' + headerNote + '</div>' + unsavedNote +
        (rows ? '<table class="simple-table"><tbody>' + rows + '</tbody></table>' +
          '<div class="meta-bar" style="margin-top:8px;">如果「無法計算」的數字接近總股票數，通常代表資料有問題（常見於 BigQuery external 模式欄位順序對錯）；' +
          '如果數字都正常但某一關就是掉到 0，代表確實沒有股票同時符合這麼嚴格的條件，是策略設計上會發生的正常情況。</div>' : '');
    }).catch(function (err) { containerEl.innerHTML = errorBox(err); });
  }

  /**
   * forceRefresh 為 false（頁面打開、切回這頁、或背景重新計算 job 剛做完）：只讀 Reports
   * 分頁上「最近一次」存的戰報，純讀取、絕對不會觸發任何計算，就算 BigQuery 那邊有問題也
   * 不會在單純打開頁面時爆出來；同時會先檢查一次有沒有背景 job 正在跑，有的話改顯示進度。
   * forceRefresh 為 true（action sheet 選「重新計算戰報」）：排一個背景 job，根據目前已有的
   * 歷史資料重新跑一次完整分析。向證交所抓新資料是另一件事，不在這裡做——要抓最新資料請到
   * 「系統與資料後台」→「立即測試執行」，抓完之後再回這裡選「重新計算戰報」。
   *
   * 用背景 job（時間觸發器）而不是直接同步呼叫 runAnalysisAndSave，是因為手機切到背景／
   * 螢幕關掉很容易讓瀏覽器中斷這次連線，google.script.run 的 success handler 永遠不會被
   * 觸發，畫面就卡死在「分析中」——即使 Apps Script 那邊其實已經算完了。改成排背景 job 後，
   * 這次呼叫只是「排工作」立刻回傳，實際運算在獨立觸發的執行裡進行，前端改用輪詢
   * getAnalysisJobStatus() 顯示進度，不受連線中斷影響。
   */
  function todayDateStr_() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  /** N 天前的日期字串，給「策略研究」底下幾個表單的預設區間用（近 30 天），
   *  避免使用者每次都要自己手動點日期選擇器才知道要填什麼。 */
  function daysAgoDateStr_(n) {
    var d = new Date();
    d.setDate(d.getDate() - n);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  // 「策略研究」底下的表單預設近 30 天區間，使用者一進來就有可以直接按下去的預設值，
  // 不用自己先搞懂要填什麼日期才敢按按鈕。
  document.getElementById('fsStart').value = daysAgoDateStr_(30);
  document.getElementById('fsEnd').value = todayDateStr_();
  document.getElementById('btStart').value = daysAgoDateStr_(30);
  document.getElementById('btEnd').value = todayDateStr_();

  var DATA_SOURCE_LABEL = {
    native: 'Drive 月份檔案（native）',
    external: 'BigQuery external',
    materialized: 'BigQuery materialized'
  };

  function loadDashboard(forceRefresh) {
    if (forceRefresh) return startAnalysisRecomputeJob_();
    var listEl = document.getElementById('dashboardList');
    listEl.innerHTML = '<div class="loading">載入中...</div>';
    return withSpin(callServer('getAnalysisJobStatus')).then(function (jobState) {
      if (jobState && jobState.status === 'running') {
        showAnalysisJobRunning_();
        pollAnalysisJob_();
        return;
      }
      return renderCachedDashboard_(false);
    }).catch(function (err) {
      document.getElementById('dashboardMeta').textContent = '';
      listEl.innerHTML = errorBox(err);
    });
  }

  function showAnalysisJobRunning_() {
    document.getElementById('dashboardMeta').textContent = '';
    document.getElementById('dashboardList').innerHTML =
      '<div class="loading">⏳ 背景重新計算戰報中，可以切到別的畫面或關掉螢幕，不會中斷這個工作，' +
      '完成後回來就會看到最新戰報...</div>';
  }

  /** action sheet「重新計算戰報」呼叫：排一個背景 job 就立刻回傳，不用等分析真的跑完。 */
  function startAnalysisRecomputeJob_() {
    showAnalysisJobRunning_();
    return withSpin(callServer('startAnalysisJob')).then(function () {
      pollAnalysisJob_();
    }).catch(function (err) { document.getElementById('dashboardList').innerHTML = errorBox(err); });
  }

  var analysisJobPollTimer_ = null;
  function stopAnalysisJobPoll_() {
    if (analysisJobPollTimer_) { clearInterval(analysisJobPollTimer_); analysisJobPollTimer_ = null; }
  }

  /** 背景工作是在獨立的時間觸發器裡跑的，這裡只是每隔幾秒讀一次目前狀態——就算這個分頁被
   *  關掉、切到背景、輪詢中斷，工作本身完全不受影響，回來重新打開頁面（loadDashboard 一開始
   *  就會檢查一次 job 狀態）就能看到最新（甚至已經做完的）結果，不需要靠這個分頁「撐著」。 */
  function pollAnalysisJob_() {
    stopAnalysisJobPoll_();
    var poll = function () {
      callServer('getAnalysisJobStatus').then(function (state) {
        if (!state || state.status === 'running') return;
        stopAnalysisJobPoll_();
        if (state.status === 'error') {
          document.getElementById('dashboardList').innerHTML = errorBox('背景重新計算失敗：' + state.errorMessage);
          return;
        }
        if (state.strategyError) {
          // 目前選用的篩選邏輯（factor_model_rank／hybrid）需要先套用一版因子迴歸模型，
          // 這不是例外/失敗，是明確的設定問題，直接把原因顯示出來，不要默默落到「沒有戰報」
          // 卻不知道為什麼。
          document.getElementById('dashboardMeta').textContent = '';
          document.getElementById('dashboardList').innerHTML = errorBox(state.strategyError);
          return;
        }
        renderCachedDashboard_(true);
      }).catch(function () {
        // 輪詢本身失敗（例如剛好網路不穩）不代表背景工作失敗，畫面維持現狀，下一次輪詢再試
      });
    };
    poll();
    analysisJobPollTimer_ = setInterval(poll, 3000);
  }

  /** 純讀取 Reports 分頁「最近一次」戰報並渲染，不觸發任何計算。autoShowDiagnostics 為 true
   *  時（剛跑完一次背景重新計算），會直接展開篩選漏斗明細，不用使用者多按一次——不管這次結果
   *  是「掃描到資料但 0 檔訊號」還是「連掃描都掃到 0 筆」，都能立刻看到原因，不用像這次一樣
   *  跑完背景 job 只看到「沒有戰報」四個字卻不知道到底是哪一段出問題。 */
  function renderCachedDashboard_(autoShowDiagnostics) {
    var listEl = document.getElementById('dashboardList');
    var metaEl = document.getElementById('dashboardMeta');
    listEl.innerHTML = '<div class="loading">載入中...</div>';
    return callServer('getCachedDashboardReport').then(function (result) {
      if (result && result.error) {
        // getCachedDashboardReport 自己接住例外、把錯誤內容放進回傳值，而不是讓整次 RPC
        // 失敗——這樣才看得出「真的沒有戰報」跟「讀取途中出錯」是兩件不同的事，不會只看到
        // 一句「目前還沒有任何戰報」卻不知道背後其實是壞掉了。
        metaEl.textContent = '';
        listEl.innerHTML = errorBox('讀取戰報時發生錯誤：' + result.error);
        return;
      }
      if (!result || !result.latestDate) {
        metaEl.textContent = '目前還沒有任何戰報，按右上角🔄選「重新計算戰報」產生一次。';
        listEl.innerHTML = '<div class="form-actions"><button type="button" class="btn-secondary" id="screeningFunnelBtn">🔍 查看篩選漏斗明細</button></div>';
        document.getElementById('screeningFunnelBtn').addEventListener('click', openScreeningFunnelSheet_);
        openScreeningFunnelSheet_();
        return;
      }
      var isToday = result.latestDate === todayDateStr_();
      var rangeNote = result.lookbackStart ? '　使用資料：' + result.lookbackStart + ' ~ ' + result.latestDate : '';
      var sourceNote = result.dataSourceMode ? '　資料來源：' + (DATA_SOURCE_LABEL[result.dataSourceMode] || result.dataSourceMode) : '';
      var noteParts = [];
      if (!isToday) {
        noteParts.push('不是今天，若今天資料已公布，先到「系統與資料後台」按「立即測試執行」抓取，再回來選「重新計算戰報」');
      }
      metaEl.textContent = '戰報日期：' + result.latestDate + '　共 ' + result.report.length + ' 檔訊號' + rangeNote + sourceNote +
        (noteParts.length ? '　' + noteParts.join('；') : '');

      var actionsHtml =
        '<div class="form-actions" style="margin-bottom:10px;">' +
        '<button type="button" class="btn-secondary" id="screeningFunnelBtn">🔍 查看篩選漏斗明細</button>' +
        '</div>' +
        (result.report.length > 0 ? '<div id="aiTopPicksSection" style="margin-bottom:10px;"></div>' : '');

      if (result.report.length === 0) {
        listEl.innerHTML = actionsHtml + '<div class="empty-hint">這天沒有符合條件的訊號</div>';
        document.getElementById('screeningFunnelBtn').addEventListener('click', openScreeningFunnelSheet_);
        if (autoShowDiagnostics) openScreeningFunnelSheet_();
        return;
      }
      listEl.innerHTML = actionsHtml +
        result.report.map(function (r) {
        var color = STRATEGY_HINT[r['操作策略']] || 'var(--text)';
        var code = r['證券代號'];
        var predReturn = r['因子模型_預測1月報酬'];
        var predResist = r['因子模型_預測抗跌力'];
        var predictedLine = (predReturn === null || predReturn === undefined) ? '' :
          '<div class="stock-card-note" style="opacity:0.8;">因子模型預測：1個月 ' +
          (predReturn >= 0 ? '+' : '') + fmtNum(predReturn * 100, 1) + '%' +
          (predResist === null || predResist === undefined ? '' : '　抗跌力 ' + (predResist >= 0 ? '+' : '') + fmtNum(predResist * 100, 2) + '%') +
          '</div>';
        return '<div class="stock-card">' +
          '<div class="stock-card-head stock-card-open" data-code="' + escapeHtml(code) + '" style="cursor:pointer;">' +
          '<span><span class="stock-card-code">' + escapeHtml(code) + '</span>' +
          '<span class="stock-card-name">' + escapeHtml(r['證券名稱']) + '</span></span>' +
          '<span class="stock-card-score">' + fmtNum(r['Armor_Score'], 1) + '</span>' +
          '</div>' +
          '<div class="stock-card-strategy" style="color:' + color + '">' + escapeHtml(r['操作策略']) + ' · ' + escapeHtml(r['建議動作']) + '</div>' +
          '<div class="stock-card-note">' + escapeHtml(r['實相解讀']) + '</div>' +
          predictedLine +
          '<div class="form-actions">' +
          '<a class="stock-card-link" href="' + escapeHtml(r['監控連結']) + '" target="_blank" rel="noopener">Goodinfo ↗</a>' +
          '</div>' +
          '<div id="aiResult-' + escapeHtml(code) + '"></div>' +
          '</div>';
      }).join('');
      listEl.querySelectorAll('.stock-card-open').forEach(function (headEl) {
        headEl.addEventListener('click', function () { openStockDetailModal_(headEl.getAttribute('data-code')); });
      });
      result.report.forEach(function (r) {
        var code = r['證券代號'];
        initAiDiagnosisSection_(document.getElementById('aiResult-' + code), code, '深度診斷', '🧠 AI 深度診斷', function () {
          return runAiTaskAsJob_('diagnosis', { codes: [code] }).then(function (results) { return results[0]; });
        });
      });
      initTopPicksSection_(document.getElementById('aiTopPicksSection'));
      document.getElementById('screeningFunnelBtn').addEventListener('click', openScreeningFunnelSheet_);
    }).catch(function (err) {
      metaEl.textContent = '';
      listEl.innerHTML = errorBox(err);
    });
  }

  var AI_PROVIDER_LABEL = { claude: 'Claude API', gemini: 'Gemini API' };

  /** 輕量 markdown -> HTML（只處理 AI 診斷模板用到的標題/表格/引用/粗體/清單，不是完整 markdown 解析器）。
   *  表格改成「一列一張 key-value 卡片」而不是原生 <table>，避免財務指標表在手機螢幕上欄位被擠壓變形
   *  （表頭第一欄當卡片標題，其餘欄位變成 label/value 兩兩一行）。 */
  function renderMarkdownLite(md) {
    if (!md) return '';
    var lines = String(md).split(/\r?\n/);
    var out = [];
    var tableRows = [];

    function inlineMd(s) {
      return escapeHtml(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    }
    function flushTable() {
      if (tableRows.length < 2) { tableRows = []; return; } // 只有表頭、沒有資料列就不用輸出
      var headers = tableRows[0].map(function (c) { return c.trim(); });
      var cardsHtml = tableRows.slice(1).map(function (cells) {
        var title = (cells[0] || '').trim();
        var kvHtml = headers.slice(1).map(function (h, i) {
          var val = (cells[i + 1] || '').trim();
          if (!val) return '';
          return '<div class="kv-row"><span class="kv-label">' + inlineMd(h) + '</span><span class="kv-value">' + inlineMd(val) + '</span></div>';
        }).join('');
        return '<div class="md-table-card"><div class="md-table-card-title">' + inlineMd(title) + '</div>' + kvHtml + '</div>';
      }).join('');
      out.push('<div class="md-table-cards">' + cardsHtml + '</div>');
      tableRows = [];
    }

    lines.forEach(function (line) {
      var tableMatch = line.match(/^\s*\|(.+)\|\s*$/);
      if (tableMatch) {
        var cells = tableMatch[1].split('|');
        var isSeparator = cells.every(function (c) { return /^\s*:?-+:?\s*$/.test(c); });
        if (!isSeparator) tableRows.push(cells);
        return;
      }
      flushTable();

      if (/^\s*---+\s*$/.test(line)) { out.push('<hr>'); return; }
      var h = line.match(/^(#{1,6})\s+(.*)$/);
      if (h) { out.push('<h' + (h[1].length <= 2 ? 4 : 5) + '>' + inlineMd(h[2]) + '</h' + (h[1].length <= 2 ? 4 : 5) + '>'); return; }
      var bq = line.match(/^>\s?(.*)$/);
      if (bq) { out.push('<blockquote>' + inlineMd(bq[1]) + '</blockquote>'); return; }
      var li = line.match(/^\s*[*-]\s+(.*)$/);
      if (li) { out.push('<div class="md-li">• ' + inlineMd(li[1]) + '</div>'); return; }
      if (line.trim() === '') return;
      out.push('<p>' + inlineMd(line) + '</p>');
    });
    flushTable();
    return out.join('\n');
  }

  /** 把 AI 診斷內容依標題拆段：第一個出現的標題（診斷模板固定是 H2 報告標題）留在頂部簡介、
   *  不摺疊；之後每個標題各自變成一個可摺疊區塊的邊界。不綁死特定標題文字，AI 輸出的標題
   *  措辭若有些微出入也不會整段解析失敗。 */
  function splitMarkdownSections_(md) {
    var lines = String(md || '').split(/\r?\n/);
    var intro = [];
    var sections = [];
    var current = null;
    var sawFirstHeader = false;
    lines.forEach(function (line) {
      var h = line.match(/^(#{1,6})\s+(.*)$/);
      if (h) {
        if (!sawFirstHeader) { intro.push(line); sawFirstHeader = true; return; }
        current = { title: h[2].trim(), lines: [] };
        sections.push(current);
        return;
      }
      if (current) current.lines.push(line); else intro.push(line);
    });
    return { intro: intro.join('\n'), sections: sections };
  }

  function pickSectionIcon_(title) {
    if (/CoVE|驗證|警示/.test(title)) return '🛡️';
    if (/財務|EPS|ROE|現金流|三表/.test(title)) return '📑';
    if (/護城河|產業|競爭力/.test(title)) return '🏢';
    if (/籌碼|技術|流派|辯證|動能/.test(title)) return '📊';
    return '📄';
  }

  /** 決策結論置頂橫幅：一打開就先看到最終建議，不用滑到最底部才找得到。verdict 是空字串或
   *  「未明確」時不畫（例如 Top3 橫向比較沒有單一決策）。 */
  var AI_VERDICT_UP_ = ['強力買入', '分批布局', '強力續抱', '分批獲利入袋'];
  var AI_VERDICT_DOWN_ = ['立刻退出', '觸發止損平倉', '彈升減碼'];
  function renderAiVerdictBanner_(verdict, reason) {
    if (!verdict || verdict === '未明確') return '';
    var cls = AI_VERDICT_UP_.indexOf(verdict) !== -1 ? 'up' : (AI_VERDICT_DOWN_.indexOf(verdict) !== -1 ? 'down' : '');
    return '<div class="ai-verdict-banner ' + cls + '">' +
      '<div class="ai-verdict-banner-label">最終操作決策</div>' +
      '<div class="ai-verdict-banner-value">' + escapeHtml(verdict) + '</div>' +
      (reason ? '<div class="ai-verdict-banner-reason">' + escapeHtml(reason) + '</div>' : '') +
      '</div>';
  }

  /** 對應 AiDiagnosis.gs 的 extractCoreReason_，前端直接從診斷全文抓「核心理由」那一行，
   *  不用為了這幾個字多打一次 RPC。 */
  function extractCoreReasonClient_(text) {
    var m = String(text || '').match(/\*\*核心理由：\*\*\s*(.+)/);
    return m ? m[1].trim() : '';
  }

  /** 內文依標題拆成手風琴摺疊區塊；「最終操作決策」那段已經在置頂橫幅顯示過，這裡不重複列出，
   *  避免使用者展開最後一個區塊卻只看到跟橫幅一樣的內容。第一個區塊預設展開，其餘收合。 */
  function renderAiDiagnosisReportBody_(text) {
    var parsed = splitMarkdownSections_(text);
    var html = parsed.intro ? renderMarkdownLite(parsed.intro) : '';
    html += parsed.sections
      .filter(function (s) { return !/最終操作決策|最終建議/.test(s.title); })
      .map(function (s) {
        return '<details class="info-collapse ai-section">' +
          '<summary>' + pickSectionIcon_(s.title) + ' ' + escapeHtml(s.title) + '</summary>' +
          '<div class="info-body">' + renderMarkdownLite(s.lines.join('\n')) + '</div>' +
          '</details>';
      }).join('');
    return html;
  }

  /** AI 診斷報告完整呈現：（可選）決策結論置頂橫幅 + 費用/快取時間戳記 + 內容手風琴。
   *  res 至少要有 text；verdict/cost 沒有就不畫對應區塊。opts.cacheLabel / opts.metaExtra
   *  是額外要顯示在頂部 meta-bar 的文字（例如「📅 歷史診斷紀錄（... 產出）」）。 */
  function renderAiDiagnosisReport_(res, opts) {
    opts = opts || {};
    var reason = extractCoreReasonClient_(res.text);
    var metaParts = [];
    if (opts.cacheLabel) metaParts.push(opts.cacheLabel);
    if (opts.metaExtra) metaParts.push(opts.metaExtra);
    if (res.cost !== undefined && res.cost !== null) metaParts.push('本次預估費用 $' + fmtNum(res.cost, 4));
    return '<div class="ai-report">' +
      (metaParts.length ? '<div class="meta-bar">' + metaParts.map(function (p) { return escapeHtml(p); }).join('　') + '</div>' : '') +
      renderAiVerdictBanner_(res.verdict, reason) +
      renderAiDiagnosisReportBody_(res.text) +
      '</div>';
  }

  /**
   * AI 診斷／續抱診斷／Top3 都改成背景 job：Goodinfo 抓取 + LLM 呼叫合計常常十幾秒到快一
   * 分鐘，手機瀏覽器切到背景很容易讓連線直接中斷，變成「NetworkError: 連線失敗，原因
   * HTTP 0」——即使 AI 那邊其實還在跑或已經跑完（跟因子迴歸模型／回測背景 job 同樣的問題，
   * 見 AiDiagnosis.gs 的說明）。startAiDiagnosisJob 只是排工作、立刻回傳，這裡輪詢
   * getAiDiagnosisJobStatus() 直到完成，resolve/reject 出跟直接呼叫 runAiDiagnosis／
   * runPortfolioHoldDiagnosis／runAiTopPicks 一樣的結果形狀，呼叫端不用區分「背景跑」
   * 還是「同步呼叫」。超過 2 分鐘沒有結果視為可能卡住，改成報錯而不是無限等待。
   */
  function runAiTaskAsJob_(taskType, payload) {
    return callServer('startAiDiagnosisJob', taskType, payload).then(function () {
      return new Promise(function (resolve, reject) {
        var attempts = 0;
        var maxAttempts = 40; // 40 次 * 3 秒 = 2 分鐘
        var poll = function () {
          attempts++;
          callServer('getAiDiagnosisJobStatus').then(function (state) {
            if (!state || state.status === 'running') {
              if (attempts >= maxAttempts) {
                reject(new Error('AI 任務執行太久沒有回應，可能是背景工作卡住了，請稍後到「系統與資料後台」的排程佇列查看或重新啟動'));
                return;
              }
              setTimeout(poll, 3000);
              return;
            }
            if (state.status === 'error') { reject(new Error(state.errorMessage || 'AI 任務失敗')); return; }
            resolve(state.result);
          }).catch(function () {
            // 輪詢本身失敗（例如剛好網路不穩）不代表任務失敗，跟其他背景 job 輪詢一樣繼續重試
            if (attempts >= maxAttempts) { reject(new Error('AI 任務執行太久沒有回應')); return; }
            setTimeout(poll, 3000);
          });
        };
        poll();
      });
    });
  }

  /**
   * 共用「cache-first AI 診斷區塊」：容器一開始先查同一檔股票／同一種診斷類型過去是否已經
   * 存過結果，有的話直接顯示（標明是快取），主按鈕降級成次要的「🔄 重新花費 API 重新分析」；
   * 沒有快取才顯示主要按鈕、等使用者主動點才花錢呼叫 API。
   * runFn() 要回傳 promise，resolve 出單一結果物件 { ok, verdict, text, cost, error }
   * （runAiDiagnosis 回傳的是陣列，呼叫端要自己取 results[0] 再包一層 promise 傳進來）。
   */
  function initAiDiagnosisSection_(containerEl, code, diagnosisType, primaryLabel, runFn) {
    containerEl.innerHTML = '<div class="loading">載入診斷紀錄中...</div>';
    callServer('getAiDiagnosisHistoryForCode', code).then(function (history) {
      var cached = history.filter(function (h) { return h.diagnosisType === diagnosisType; })[0] || null;
      renderAiDiagnosisSection_(containerEl, primaryLabel, cached, runFn);
    }).catch(function () { renderAiDiagnosisSection_(containerEl, primaryLabel, null, runFn); });
  }

  function renderAiDiagnosisSection_(containerEl, primaryLabel, entry, runFn) {
    var btnLabel = entry ? '🔄 重新花費 API 重新分析' : primaryLabel;
    var resultHtml = '';
    if (entry) {
      var opts = entry.fresh
        ? (entry.groundingDisabled ? { metaExtra: '⚠️ 這次已停用即時搜尋（Google Search grounding 連續失敗後改用純資料判斷）' } : {})
        : { cacheLabel: '📅 歷史診斷紀錄（' + entry.timestamp + ' 產出）' };
      resultHtml = renderAiDiagnosisReport_(entry, opts);
    }
    containerEl.innerHTML =
      '<div class="form-actions"><button type="button" class="' + (entry ? 'btn-secondary' : 'btn-primary') + ' ai-run-btn">' + escapeHtml(btnLabel) + '</button></div>' +
      '<div class="ai-result-slot">' + resultHtml + '</div>';
    containerEl.querySelector('.ai-run-btn').addEventListener('click', function () {
      runAiDiagnosisSection_(containerEl, primaryLabel, runFn);
    });
  }

  function runAiDiagnosisSection_(containerEl, primaryLabel, runFn) {
    var providerLabel = AI_PROVIDER_LABEL[window.__aiProvider] || 'AI';
    var runBtn = containerEl.querySelector('.ai-run-btn');
    if (runBtn) runBtn.disabled = true;
    containerEl.querySelector('.ai-result-slot').innerHTML = '<div class="loading">⏳ 背景執行 AI 診斷中（要呼叫 ' + providerLabel + ' + 抓 Goodinfo），可以切到別的畫面，不會中斷這個工作，通常十幾秒到一分鐘...</div>';
    withSpin(runFn()).then(function (res) {
      if (!res.ok) { containerEl.querySelector('.ai-result-slot').innerHTML = errorBox(res.error); if (runBtn) runBtn.disabled = false; return; }
      renderAiDiagnosisSection_(containerEl, primaryLabel, { verdict: res.verdict, text: res.text, cost: res.cost, fresh: true, groundingDisabled: res.groundingDisabled }, runFn);
    }).catch(function (err) {
      containerEl.querySelector('.ai-result-slot').innerHTML = errorBox(err);
      if (runBtn) runBtn.disabled = false;
    });
  }

  /** 更早的診斷紀錄（排除目前已經顯示在上面的最新一筆），收合在最下面，需要時才展開看，
   *  只有股票詳情 modal 這種本來就有較多版面的地方才顯示，戰報卡片、持股卡片不放。 */
  function loadOlderAiDiagnosisHistoryInto_(code, el, diagnosisType) {
    if (!el) return;
    callServer('getAiDiagnosisHistoryForCode', code).then(function (history) {
      var older = history.filter(function (h) { return h.diagnosisType === diagnosisType; }).slice(1);
      if (!older.length) { el.innerHTML = ''; return; }
      el.innerHTML = '<details class="info-collapse"><summary>更早的診斷紀錄（' + older.length + ' 筆）</summary><div class="info-body">' +
        older.map(function (h) {
          return '<div class="ai-report"><div class="meta-bar">' + escapeHtml(h.date) + '　最終建議：<span class="ai-verdict-badge">' + escapeHtml(h.verdict) + '</span></div>' +
            renderAiDiagnosisReportBody_(h.text) + '</div>';
        }).join('') + '</div></details>';
    }).catch(function () { el.innerHTML = ''; });
  }

  /** 「AI 掃描全部候選，推薦前三檔」：cache-first，跟單檔深度診斷不同量級的任務，只用戰報
   *  已經算好的量化欄位做橫向比較，不會對每一檔都額外抓 Goodinfo（候選一多成本會爆掉）。 */
  function initTopPicksSection_(containerEl) {
    containerEl.innerHTML = '<div class="loading">載入快取中...</div>';
    callServer('getLatestTopPicksResult').then(function (cached) {
      renderTopPicksSection_(containerEl, cached);
    }).catch(function () { renderTopPicksSection_(containerEl, null); });
  }

  function renderTopPicksSection_(containerEl, entry) {
    var btnLabel = entry ? '🔄 重新花費 API 重新掃描' : '🧠 AI 掃描全部候選，推薦前三檔';
    var resultHtml = '';
    if (entry) {
      var opts = entry.fresh
        ? {
            metaExtra: '掃描 ' + fmtNum(entry.candidateCount, 0) + ' 檔候選（' + entry.date + '）' +
              (entry.groundingDisabled ? '　⚠️ 已停用即時搜尋' : ''),
            cost: entry.cost
          }
        : { cacheLabel: '📅 歷史推薦紀錄（' + entry.timestamp + ' 產出）' };
      resultHtml = renderAiDiagnosisReport_({ text: entry.text, cost: entry.fresh ? entry.cost : undefined }, opts);
    }
    containerEl.innerHTML =
      '<div class="form-actions"><button type="button" class="' + (entry ? 'btn-secondary' : 'btn-primary') + '" id="aiTopPicksBtn">' + escapeHtml(btnLabel) + '</button></div>' +
      '<div class="ai-result-slot">' + resultHtml + '</div>';
    document.getElementById('aiTopPicksBtn').addEventListener('click', function () {
      runAiTopPicksForButton_(containerEl);
    });
  }

  /** 跟單檔深度診斷不同量級的任務，只用戰報已經算好的量化欄位做橫向比較。 */
  function runAiTopPicksForButton_(containerEl) {
    var providerLabel = AI_PROVIDER_LABEL[window.__aiProvider] || 'AI';
    var btn = document.getElementById('aiTopPicksBtn');
    if (btn) btn.disabled = true;
    containerEl.querySelector('.ai-result-slot').innerHTML = '<div class="loading">⏳ 背景執行 AI 掃描全部候選中（要呼叫 ' + providerLabel + '），可以切到別的畫面，不會中斷這個工作...</div>';
    withSpin(runAiTaskAsJob_('topPicks', null)).then(function (res) {
      renderTopPicksSection_(containerEl, { text: res.text, cost: res.cost, candidateCount: res.candidateCount, date: res.date, fresh: true, groundingDisabled: res.groundingDisabled });
    }).catch(function (err) {
      containerEl.querySelector('.ai-result-slot').innerHTML = errorBox(err);
      if (btn) btn.disabled = false;
    });
  }

  // ---------- 持股庫存（一檔股票可能有多筆分批買進的 lot） ----------
  var pfForm = document.getElementById('portfolioForm');
  var pfClearBtn = document.getElementById('pfClearBtn');

  function loadPortfolio() {
    var listEl = document.getElementById('portfolioList');
    listEl.innerHTML = '<div class="loading">載入中...</div>';
    return callServer('getPortfolio').then(function (items) {
      if (!items.length) {
        listEl.innerHTML = '<div class="empty-hint">尚未新增任何持股</div>';
        return;
      }
      listEl.innerHTML = items.map(renderPortfolioCard_).join('');
      wirePortfolioCardEvents_(listEl);
      items.forEach(function (it) {
        initAiDiagnosisSection_(document.getElementById('pfHoldResult-' + it.code), it.code, '持股續抱診斷', '🧠 持股續抱診斷', function () {
          return runAiTaskAsJob_('hold', { code: it.code });
        });
      });
    }).catch(function (err) { listEl.innerHTML = errorBox(err); });
  }

  function renderPortfolioCard_(it) {
    var profit = (it.cost && it.latestClose !== null) ? (it.latestClose - it.cost) / it.cost * 100 : null;
    var profitHtml = profit === null ? '' :
      '<div class="stock-card-strategy" style="color:' + (profit >= 0 ? 'var(--green)' : 'var(--red)') + '">' +
      '現價 ' + fmtNum(it.latestClose) + '　未實現損益 ' + (profit >= 0 ? '+' : '') + fmtNum(profit, 1) + '%</div>';
    var signalHtml = '';
    if (it.signal && it.signal.strategy) {
      var color = STRATEGY_HINT[it.signal.strategy] || 'var(--text)';
      signalHtml = '<div class="stock-card-strategy" style="color:' + color + '">' +
        escapeHtml(it.signal.strategy) + (it.signal.action ? ' · ' + escapeHtml(it.signal.action) : '') +
        '<span class="stock-card-action">（' + escapeHtml(it.signal.date) + ' 戰報）</span></div>';
    }
    var lotsHtml = it.lots.map(function (lot) {
      return '<div class="kv-row"><span class="kv-label">' + escapeHtml(lot.buyDate || '-') + '　' +
        fmtNum(lot.shares, 0) + ' 股 @ ' + fmtNum(lot.cost) + (lot.note ? '　' + escapeHtml(lot.note) : '') + '</span>' +
        '<span class="kv-value">' +
        '<button type="button" class="btn-link pf-lot-edit" data-lot="' + escapeHtml(lot.id) + '" data-code="' + escapeHtml(it.code) + '">編輯</button> ' +
        '<button type="button" class="btn-link danger pf-lot-delete" data-lot="' + escapeHtml(lot.id) + '">刪除</button>' +
        '</span></div>';
    }).join('');
    return '<div class="stock-card" data-portfolio-code="' + escapeHtml(it.code) + '">' +
      '<div class="stock-card-head stock-card-open" data-code="' + escapeHtml(it.code) + '" style="cursor:pointer;">' +
      '<span><span class="stock-card-code">' + escapeHtml(it.code) + '</span>' +
      '<span class="stock-card-name">' + escapeHtml(it.name) + '</span></span>' +
      '</div>' +
      '<div class="stock-card-note">加權平均成本 ' + fmtNum(it.cost) + '　共 ' + fmtNum(it.totalShares, 0) + ' 股（' +
      fmtNum(it.totalShares / 1000, 2) + ' 張）　最早買進 ' + escapeHtml(it.buyDate || '-') + '</div>' +
      profitHtml + signalHtml +
      (it.note ? '<div class="stock-card-note">備註：' + escapeHtml(it.note) + '</div>' : '') +
      '<details class="info-collapse"><summary>買進明細（' + it.lots.length + ' 筆）</summary><div class="info-body">' + lotsHtml + '</div></details>' +
      '<div class="form-actions">' +
      '<button type="button" class="btn-secondary pf-add-lot" data-code="' + escapeHtml(it.code) + '" data-name="' + escapeHtml(it.name) + '">＋ 加碼買進</button>' +
      '<button type="button" class="btn-primary pf-close-position" data-code="' + escapeHtml(it.code) + '" data-name="' + escapeHtml(it.name) + '" data-cost="' + it.cost + '" data-shares="' + it.totalShares + '">💰 標示已賣出/結案</button>' +
      '</div>' +
      '<div id="pfHoldResult-' + escapeHtml(it.code) + '"></div>' +
      '</div>';
  }

  function wirePortfolioCardEvents_(listEl) {
    listEl.querySelectorAll('.stock-card-open').forEach(function (headEl) {
      headEl.addEventListener('click', function () { openStockDetailModal_(headEl.getAttribute('data-code')); });
    });
    listEl.querySelectorAll('.pf-add-lot').forEach(function (btn) {
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        startNewPortfolioLot_(btn.getAttribute('data-code'), btn.getAttribute('data-name'));
      });
    });
    listEl.querySelectorAll('.pf-lot-edit').forEach(function (btn) {
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        fillPortfolioLotForm_(btn.getAttribute('data-code'), btn.getAttribute('data-lot'));
      });
    });
    listEl.querySelectorAll('.pf-lot-delete').forEach(function (btn) {
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        if (!confirm('確定要刪除這筆買進紀錄嗎？')) return;
        callServer('deletePortfolioLot', btn.getAttribute('data-lot')).then(function () { loadPortfolio(); });
      });
    });
    listEl.querySelectorAll('.pf-close-position').forEach(function (btn) {
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        openPfCloseSheet_(btn.getAttribute('data-code'), btn.getAttribute('data-name'), toNumOrNull_(btn.getAttribute('data-cost')), toNumOrNull_(btn.getAttribute('data-shares')));
      });
    });
  }

  function toNumOrNull_(v) { var n = parseFloat(v); return isNaN(n) ? null : n; }

  /** 表單重置成「新增這筆持有」的初始狀態（不綁定任何既有股票/lot）。 */
  function resetPortfolioForm_() {
    pfForm.reset();
    document.getElementById('portfolioFormTitle').textContent = '新增持股';
    document.getElementById('pfLotId').value = '';
    var submitBtn = document.getElementById('pfSubmitBtn');
    submitBtn.textContent = '＋ 新增這筆持有';
    submitBtn.disabled = false;
  }

  /** 「＋ 加碼買進」：代號/名稱鎖定成這檔股票，其餘欄位清空讓使用者填這筆新的買進紀錄。 */
  function startNewPortfolioLot_(code, name) {
    resetPortfolioForm_();
    document.getElementById('portfolioFormTitle').textContent = code + ' 加碼買進';
    document.getElementById('pfCode').value = code;
    document.getElementById('pfName').value = name || '';
    document.getElementById('pfBuyDate').value = todayDateStr_();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function fillPortfolioLotForm_(code, lotId) {
    callServer('getPortfolio').then(function (items) {
      var it = items.filter(function (x) { return x.code === code; })[0];
      var lot = it && it.lots.filter(function (l) { return l.id === lotId; })[0];
      if (!lot) { alert('找不到這筆買進紀錄，可能已被刪除，請重新整理後再試一次'); return; }
      document.getElementById('portfolioFormTitle').textContent = '編輯買進紀錄 ' + code;
      document.getElementById('pfLotId').value = lot.id;
      document.getElementById('pfCode').value = code;
      document.getElementById('pfName').value = it.name || '';
      document.getElementById('pfBuyDate').value = lot.buyDate || '';
      document.getElementById('pfCost').value = lot.cost;
      document.getElementById('pfShares').value = lot.shares;
      document.getElementById('pfNote').value = lot.note || '';
      document.getElementById('pfSubmitBtn').textContent = '儲存修改';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  }

  pfClearBtn.addEventListener('click', resetPortfolioForm_);

  pfForm.addEventListener('submit', function (e) {
    e.preventDefault();
    var submitBtn = document.getElementById('pfSubmitBtn');
    // 送出中按鈕會被 disable，這裡再擋一次是防呆——避免使用者在等回應（尤其網路不穩、
    // 連線被中斷看起來像「沒反應」時）又點一次，結果同一筆買進被送出兩次以上。
    if (submitBtn.disabled) return;
    var item = {
      lotId: document.getElementById('pfLotId').value || '',
      code: document.getElementById('pfCode').value.trim(),
      name: document.getElementById('pfName').value.trim(),
      buyDate: document.getElementById('pfBuyDate').value,
      cost: parseFloat(document.getElementById('pfCost').value),
      shares: parseFloat(document.getElementById('pfShares').value),
      note: document.getElementById('pfNote').value.trim()
    };
    var savingLabel = submitBtn.textContent;
    submitBtn.disabled = true;
    submitBtn.textContent = '儲存中...';
    callServer('savePortfolioItem', item).then(function () {
      resetPortfolioForm_();
      loadPortfolio();
    }).catch(function (err) {
      alert(err.message || err);
      submitBtn.disabled = false;
      submitBtn.textContent = savingLabel;
    });
  });

  // ---------- 持股結案（標示已賣出）與歷史結案紀錄 ----------
  var pfCloseSheet = document.getElementById('pfCloseSheet');
  var pfCloseForm = document.getElementById('pfCloseForm');

  function openPfCloseSheet_(code, name, cost, shares) {
    document.getElementById('pfCloseSheetTitle').textContent = '標示已賣出／結案：' + code + ' ' + (name || '');
    document.getElementById('pfCloseCode').value = code;
    document.getElementById('pfCloseSummary').textContent =
      (cost !== null ? '加權平均成本 ' + fmtNum(cost) : '') + (shares !== null ? '　共 ' + fmtNum(shares, 0) + ' 股' : '') +
      '　賣出後這檔股票目前「持有中」的買進紀錄會一起結案，移到「歷史結案紀錄」。';
    document.getElementById('pfCloseSellDate').value = todayDateStr_();
    document.getElementById('pfCloseSellPrice').value = '';

  }
  document.getElementById('pfCloseSheetCloseBtn').addEventListener('click', function () { closeSheet_(pfCloseSheet); });
  document.getElementById('pfCloseCancelBtn').addEventListener('click', function () { closeSheet_(pfCloseSheet); });
  pfCloseSheet.addEventListener('click', function (e) { if (e.target === pfCloseSheet) closeSheet_(pfCloseSheet); });

  pfCloseForm.addEventListener('submit', function (e) {
    e.preventDefault();
    var code = document.getElementById('pfCloseCode').value;
    var sellDate = document.getElementById('pfCloseSellDate').value;
    var sellPrice = parseFloat(document.getElementById('pfCloseSellPrice').value);
    callServer('closePortfolioPosition', code, sellDate, sellPrice).then(function () {
      closeSheet_(pfCloseSheet);
      loadPortfolio();
    }).catch(function (err) { alert(err.message || err); });
  });

  function loadPortfolioHistory_() {
    var listEl = document.getElementById('portfolioHistoryList');
    listEl.innerHTML = '<div class="loading">載入中...</div>';
    return callServer('getClosedPortfolioHistory').then(function (groups) {
      if (!groups.length) { listEl.innerHTML = '<div class="empty-hint">尚無已結案的持股</div>'; return; }
      listEl.innerHTML = groups.map(function (g) {
        var realized = g.realizedPct;
        var color = realized === null ? 'var(--text)' : (realized >= 0 ? 'var(--green)' : 'var(--red)');
        return '<div class="stock-card">' +
          '<div class="stock-card-head"><span><span class="stock-card-code">' + escapeHtml(g.code) + '</span>' +
          '<span class="stock-card-name">' + escapeHtml(g.name) + '</span></span></div>' +
          '<div class="stock-card-note">買進 ' + escapeHtml(g.buyDate || '-') + '　@ ' + fmtNum(g.avgCost) +
          '　→　賣出 ' + escapeHtml(g.sellDate || '-') + '　@ ' + fmtNum(g.sellPrice) + '</div>' +
          '<div class="stock-card-note">共 ' + fmtNum(g.totalShares, 0) + ' 股</div>' +
          '<div class="stock-card-strategy" style="color:' + color + '">已實現損益 ' +
          (realized === null ? '-' : ((realized >= 0 ? '+' : '') + fmtNum(realized, 1) + '%　' + (g.realizedAmount >= 0 ? '+' : '') + fmtNum(g.realizedAmount, 0) + ' 元')) +
          '</div></div>';
      }).join('');
    }).catch(function (err) { listEl.innerHTML = errorBox(err); });

  // ---------- 股票代號/名稱自動完成（共用：戰報搜尋列、持股表單代號/名稱雙向連動） ----------
  /** 幫 inputEl 掛上 250ms debounce 的代號/名稱搜尋（依 searchStockCodes 對最近 History
   *  資料做代號或名稱關鍵字比對），選到一筆結果時呼叫 onPick(code, name)。 */
  function wireStockAutocomplete_(inputEl, resultsEl, onPick) {
    var timer = null;
    inputEl.addEventListener('input', function () {
      clearTimeout(timer);
      var q = inputEl.value.trim();
      if (!q) { resultsEl.innerHTML = ''; return; }
      timer = setTimeout(function () {
        callServer('searchStockCodes', q).then(function (results) {
          if (!results.length) { resultsEl.innerHTML = '<div class="search-result-item">找不到符合的股票</div>'; return; }
          resultsEl.innerHTML = results.map(function (r) {
            return '<div class="search-result-item" data-code="' + escapeHtml(r.code) + '" data-name="' + escapeHtml(r.name) + '">' +
              escapeHtml(r.code) + ' ' + escapeHtml(r.name) + '</div>';
          }).join('');
          resultsEl.querySelectorAll('.search-result-item[data-code]').forEach(function (el) {
            el.addEventListener('click', function () {
              resultsEl.innerHTML = '';
              onPick(el.getAttribute('data-code'), el.getAttribute('data-name'));
            });
          });
        });
      }, 250);
    });
    document.addEventListener('click', function (e) {
      if (!resultsEl.contains(e.target) && e.target !== inputEl) resultsEl.innerHTML = '';
    });
  }

  var stockSearchInput = document.getElementById('stockSearchInput');
  wireStockAutocomplete_(stockSearchInput, document.getElementById('stockSearchResults'), function (code) {
    stockSearchInput.value = '';
    openStockDetailModal_(code);
  });

  var pfCodeInput = document.getElementById('pfCode');
  var pfNameInput = document.getElementById('pfName');
  wireStockAutocomplete_(pfCodeInput, document.getElementById('pfCodeResults'), function (code, name) {
    pfCodeInput.value = code;
    if (name) pfNameInput.value = name;
  });
  wireStockAutocomplete_(pfNameInput, document.getElementById('pfNameResults'), function (code, name) {
    pfCodeInput.value = code;
    pfNameInput.value = name;
  });

  /** 使用者直接打完代號就按 tab/點別的欄位（沒有點自動完成下拉選單）時，離開代號欄位就順便
   *  查一次代號對應的名稱幫忙帶出來，供輸入時確認是不是要買的那一檔——跟自動完成下拉選單是
   *  互補的兩種填法，不是取代。查不到就不動，不強行清空或改寫使用者已經打的代號。 */
  pfCodeInput.addEventListener('blur', function () {
    var raw = pfCodeInput.value.trim();
    if (!raw || pfNameInput.value.trim()) return;
    // 用 getStockNameByCode（不限日期範圍查這一檔股票）而不是 searchStockCodes（只看最近
    // 10 天，給打字自動完成用）——冷門股或最近沒被每日掃描選中的話，10 天內查不到，
    // 但這裡查名字只查一檔股票，不受那個限制。
    callServer('getStockNameByCode', raw).then(function (result) {
      if (result) { pfCodeInput.value = result.code; pfNameInput.value = result.name; }
    }).catch(function () { /* 查不到就算了，不影響使用者自己填代號/名稱 */ });
  });

  /**
   * 個股詳情的完整畫面（走勢圖＋法人買賣超＋歷史 Armor_Score＋AI 診斷）是一個可重用的 render
   * 函式，唯一的呈現位置是「股票詳情 modal」（從戰報搜尋／卡片、持股庫存卡片點進來）。
   * prefix 保留給未來同頁同時開多個 modal 實例時區分 canvas id / Chart.js 實例用。
   */
  /** 買賣力道評估卡片的說明文字（info icon 用原生 title tooltip，不用另外做彈窗元件）。
   *  刻意跟下面的「AI 深度診斷」分開說明：這裡是「當下這個價位，買賣盤氣氛偏多還是偏空」
   *  的短期戰術參考，不看公司體質；AI 深度診斷才是回答「這家公司值不值得繼續抱／加碼」。 */
  var RT_QUOTE_TOOLTIP_ = '評估分數（0~100）＝委買委賣力道比 × 60% ＋ 現價在當日高低區間的相對位置 × 40%。' +
    '力道比＝委買五檔量 ÷ (委買五檔量＋委賣五檔量)；區間位置＝愈接近當日最低點分數愈高。' +
    '分數 ≥65 標示「偏向有利買進」，≤35 標示「偏向有利賣出」，只反映「當下」掛單簿與價位，' +
    '不看公司體質、不看持股成本、不是操作建議，資料來源是證交所看盤系統的即時報價端點，' +
    '只有交易時間內才查得到，且不是正式文件化的公開 API，沒有官方保證格式不會改版。';

  function renderStockDetailInto_(containerEl, prefix, data) {
    if (!data.series.length) {
      containerEl.innerHTML = '<div class="empty-hint">目前沒有 ' + escapeHtml(data.code) + ' 的歷史資料</div>';
      return;
    }
    var priceCanvasId = 'priceChartCanvas-' + prefix;
    var instCanvasId = 'instChartCanvas-' + prefix;
    containerEl.innerHTML =
      '<div class="chart-card"><h4>' + escapeHtml(data.code) + ' ' + escapeHtml(data.name) + '　收盤價 / MA5 / MA20 / MA60</h4>' +
      '<canvas id="' + priceCanvasId + '" height="220"></canvas></div>' +
      '<div class="chart-card"><h4>🎯 買賣力道評估（即時內外盤） <span title="' + escapeHtml(RT_QUOTE_TOOLTIP_) + '" style="cursor:help; color:var(--text-muted);">ⓘ</span></h4>' +
      '<div class="meta-bar" style="margin-bottom:6px;">回答「當下這個價位，買賣盤偏多還是偏空」——跟下面的「AI 深度診斷」是分開的兩件事：AI 深度診斷看公司體質，這裡只看當下的掛單與價位。</div>' +
      '<div id="rtQuoteBody-' + prefix + '">' +
      '<button type="button" class="btn-secondary" id="rtQuoteBtn-' + prefix + '">🔄 查詢即時內外盤</button>' +
      '<div class="meta-bar" style="margin-top:6px;">只在交易時間內查得到資料，僅供輔助參考，不是操作建議。</div>' +
      '</div></div>' +
      '<div class="chart-card"><h4>法人買賣超（投信+外資+自營商合計，股數）</h4>' +
      '<canvas id="' + instCanvasId + '" height="160"></canvas></div>' +
      '<div class="chart-card"><h4>歷史 Armor_Score / 操作策略（每日戰報累積紀錄）</h4>' +
      '<div class="table-scroll">' + renderScoreHistoryTable(data.scoreHistory) + '</div></div>' +
      '<div class="form-actions" style="margin-bottom:2px;">' +
      '<button type="button" class="btn-secondary" id="quickAddBtn-' + prefix + '">+ 快捷加入持股</button>' +
      '</div>' +
      '<div class="chart-card"><h4>AI 深度診斷</h4>' +
      '<div id="stockAiSection-' + prefix + '"></div>' +
      '<div id="stockAiHistory-' + prefix + '" style="margin-top:8px;"></div></div>';

    renderPriceChartInto_(priceCanvasId, prefix, data.series);
    renderInstChartInto_(instCanvasId, prefix, data.series);
    wireRealtimeQuoteBtn_(prefix, data.code);
    initAiDiagnosisSection_(
      document.getElementById('stockAiSection-' + prefix), data.code, '深度診斷',
      '🧠 針對 ' + data.code + ' 跑一次 AI 診斷',
      function () { return runAiTaskAsJob_('diagnosis', { codes: [data.code] }).then(function (results) { return results[0]; }); }
    );
    loadOlderAiDiagnosisHistoryInto_(data.code, document.getElementById('stockAiHistory-' + prefix), '深度診斷');
    document.getElementById('quickAddBtn-' + prefix).addEventListener('click', function () {
      openQuickAddPortfolio_(data.code, data.name, data.series);
    });
  }

  /** 「查詢即時內外盤」按鈕只在使用者按下去才呼叫（不隨個股詳情自動載入）：這支端點限速
   *  每 5 秒 3 次請求，只做單檔查詢用途，不能像走勢圖那樣一開 modal 就自動打。 */
  function wireRealtimeQuoteBtn_(prefix, code) {
    var btn = document.getElementById('rtQuoteBtn-' + prefix);
    if (btn) btn.addEventListener('click', function () { loadRealtimeQuote_(prefix, code); });
  }

  function loadRealtimeQuote_(prefix, code) {
    var bodyEl = document.getElementById('rtQuoteBody-' + prefix);
    if (!bodyEl) return;
    bodyEl.innerHTML = '<div class="loading">查詢即時內外盤中...</div>';
    callServer('getRealtimeQuote', code).then(function (q) {
      if (!q.ok) {
        bodyEl.innerHTML = '<div class="empty-hint">' + escapeHtml(q.message) + '</div>' +
          '<div class="form-actions" style="margin-top:6px; margin-bottom:0;">' +
          '<button type="button" class="btn-secondary" id="rtQuoteBtn-' + prefix + '">🔄 重新查詢</button></div>';
        wireRealtimeQuoteBtn_(prefix, code);
        return;
      }
      var v = q.verdict || {};
      var verdictColor = v.score === null || v.score === undefined ? 'var(--text-muted)' :
        (v.score >= 65 ? 'var(--red)' : (v.score <= 35 ? 'var(--green)' : 'var(--text-muted)'));
      var askRows = q.askLevels.map(function (l, i) { return { label: '賣' + (i + 1), price: l.price, volume: l.volume }; }).reverse();
      var bidRows = q.bidLevels.map(function (l, i) { return { label: '買' + (i + 1), price: l.price, volume: l.volume }; });
      var tableRows = askRows.concat(bidRows).map(function (r) {
        return '<tr><td>' + r.label + '</td><td>' + fmtNum(r.price, 2) + '</td><td>' + fmtNum(r.volume, 0) + '</td></tr>';
      }).join('');
      bodyEl.innerHTML =
        '<div style="font-size:20px; font-weight:700; color:' + verdictColor + ';">' + escapeHtml(v.label || '') +
        (v.score === null || v.score === undefined ? '' : '　' + fmtNum(v.score, 1) + ' 分') + '</div>' +
        '<div class="meta-bar" style="margin:2px 0 8px;">' + escapeHtml(v.detail || '') +
        (q.buyRatio === null ? '' : '　委買力道 ' + fmtNum(q.buyRatio * 100, 1) + '%') + '</div>' +
        '<div class="meta-bar">成交價 ' + fmtNum(q.latestPrice, 2) + '　累積成交量 ' + fmtNum(q.accumulatedVolume, 0) +
        (q.timestamp ? '　' + new Date(q.timestamp).toLocaleTimeString('zh-TW') : '') + '</div>' +
        '<table class="simple-table" style="margin-top:6px;"><thead><tr><th>檔位</th><th>價格</th><th>量</th></tr></thead><tbody>' + tableRows + '</tbody></table>' +
        '<div class="form-actions" style="margin-top:6px; margin-bottom:0;">' +
        '<button type="button" class="btn-secondary" id="rtQuoteBtn-' + prefix + '">🔄 重新查詢</button></div>';
      wireRealtimeQuoteBtn_(prefix, code);
    }).catch(function (err) {
      bodyEl.innerHTML = errorBox(err) +
        '<div class="form-actions" style="margin-top:6px; margin-bottom:0;">' +
        '<button type="button" class="btn-secondary" id="rtQuoteBtn-' + prefix + '">🔄 重新查詢</button></div>';
      wireRealtimeQuoteBtn_(prefix, code);
    });
  }

  function renderScoreHistoryTable(rows) {
    if (!rows || !rows.length) return '<div class="empty-hint">尚無戰報歷史紀錄</div>';
    var recent = rows.slice(-30).reverse();
    var body = recent.map(function (r) {
      return '<tr><td>' + escapeHtml(r.date) + '</td><td>' + fmtNum(r.armorScore, 1) + '</td>' +
        '<td>' + escapeHtml(r.strategy || '-') + '</td><td>' + escapeHtml(r.action || '-') + '</td></tr>';
    }).join('');
    return '<table class="simple-table"><thead><tr><th>日期</th><th>Armor_Score</th><th>策略</th><th>建議</th></tr></thead><tbody>' + body + '</tbody></table>';
  }

  /** { prefix: { price: Chart, inst: Chart } }——每個 render 目標（main 分頁 / modal）各自的
   *  Chart.js 實例分開存，避免兩邊同時存在時互相 destroy 到對方的圖表。 */
  var stockCharts_ = {};

  function renderPriceChartInto_(canvasId, prefix, series) {
    var ctx = document.getElementById(canvasId).getContext('2d');
    stockCharts_[prefix] = stockCharts_[prefix] || {};
    if (stockCharts_[prefix].price) stockCharts_[prefix].price.destroy();
    stockCharts_[prefix].price = new Chart(ctx, {
      type: 'line',
      data: {
        labels: series.map(function (r) { return r.date; }),
        datasets: [
          { label: '收盤價', data: series.map(function (r) { return r.close; }), borderColor: '#2563eb', pointRadius: 0, tension: 0.1 },
          { label: 'MA5', data: series.map(function (r) { return r.ma5; }), borderColor: '#16a34a', pointRadius: 0, borderWidth: 1 },
          { label: 'MA20', data: series.map(function (r) { return r.ma20; }), borderColor: '#d97706', pointRadius: 0, borderWidth: 1 },
          { label: 'MA60', data: series.map(function (r) { return r.ma60; }), borderColor: '#9333ea', pointRadius: 0, borderWidth: 1 }
        ]
      },
      options: {
        responsive: true,
        interaction: { mode: 'index', intersect: false },
        scales: { x: { ticks: { maxTicksLimit: 6 } } },
        plugins: { legend: { labels: { boxWidth: 12, font: { size: 11 } } } }
      }
    });
  }

  function renderInstChartInto_(canvasId, prefix, series) {
    var ctx = document.getElementById(canvasId).getContext('2d');
    stockCharts_[prefix] = stockCharts_[prefix] || {};
    if (stockCharts_[prefix].inst) stockCharts_[prefix].inst.destroy();
    stockCharts_[prefix].inst = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: series.map(function (r) { return r.date; }),
        datasets: [{
          label: '法人買賣超',
          data: series.map(function (r) { return r.instNet; }),
          backgroundColor: series.map(function (r) { return r.instNet >= 0 ? '#dc2626' : '#16a34a'; })
        }]
      },
      options: {
        responsive: true,
        scales: { x: { ticks: { maxTicksLimit: 6 } } },
        plugins: { legend: { display: false } }
      }
    });
  }

  // ---------- 股票詳情 modal（從戰報搜尋／卡片、持股庫存卡片點進來） ----------
  var stockDetailSheet = document.getElementById('stockDetailSheet');
  var stockDetailSheetBody = document.getElementById('stockDetailSheetBody');
  var stockDetailSheetTitle = document.getElementById('stockDetailSheetTitle');

  function openStockDetailModal_(code) {
    stockDetailSheetTitle.textContent = code;
    stockDetailSheetBody.innerHTML = '<div class="loading">載入走勢中...</div>';
    openSheet_(stockDetailSheet);
    return callServer('getStockTimeSeries', code).then(function (data) {
      stockDetailSheetTitle.textContent = data.code + ' ' + data.name;
      renderStockDetailInto_(stockDetailSheetBody, 'modal', data);
    }).catch(function (err) { stockDetailSheetBody.innerHTML = errorBox(err); });

  document.getElementById('stockDetailSheetCloseBtn').addEventListener('click', function () { closeSheet_(stockDetailSheet); });
  stockDetailSheet.addEventListener('click', function (e) { if (e.target === stockDetailSheet) closeSheet_(stockDetailSheet); });

  /** 篩選漏斗明細改成彈出式 modal（跟股票詳情共用同一套 bottom sheet 元件），不佔用最新戰報
   *  主畫面的版面——那裡應該優先留給股票卡片跟 AI 診斷本身，篩選漏斗是輔助診斷資訊，
   *  需要時才點開看，不用一直卡在主要內容中間。 */
  var screeningFunnelSheet = document.getElementById('screeningFunnelSheet');
  var screeningFunnelSheetBody = document.getElementById('screeningFunnelSheetBody');
  function openScreeningFunnelSheet_() {
    openSheet_(screeningFunnelSheet);
    loadScreeningDiagnostics_(screeningFunnelSheetBody);
  }
  document.getElementById('screeningFunnelSheetCloseBtn').addEventListener('click', function () { closeSheet_(screeningFunnelSheet); });
  screeningFunnelSheet.addEventListener('click', function (e) { if (e.target === screeningFunnelSheet) closeSheet_(screeningFunnelSheet); });

  /** modal 裡「+ 快捷加入持股」：帶著代號/名稱/現價/今天日期跳去持股庫存表單，
   *  使用者確認或調整成本/日期後還是要自己按「儲存」，不會沒經過確認就直接寫入。 */
  function openQuickAddPortfolio_(code, name, series) {
    var latestClose = series.length ? series[series.length - 1].close : null;
    resetPortfolioForm_();
    document.getElementById('pfCode').value = code;
    document.getElementById('pfName').value = name || '';
    document.getElementById('pfCost').value = latestClose !== null ? latestClose : '';
    document.getElementById('pfBuyDate').value = todayDateStr_();
    closeSheet_(stockDetailSheet);
    activateTab('portfolio');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // ---------- 子分頁切換（研究頁的回測/因子迴歸、持股庫存的持有中/歷史結案共用同一套元件） ----------
  // 每組 .sub-tabs 各自管自己那一組按鈕/面板，不用 document 全域 querySelectorAll，
  // 避免切換持股庫存的子分頁時，不小心把研究頁的子分頁 active 狀態也清掉（反之亦然）。
  document.querySelectorAll('.sub-tabs').forEach(function (group) {
    var scope = group.parentElement;
    group.querySelectorAll('.sub-tab-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        group.querySelectorAll('.sub-tab-btn').forEach(function (b) { b.classList.remove('active'); });
        Array.prototype.forEach.call(scope.children, function (p) {
          if (p.classList.contains('sub-tab-panel')) p.classList.remove('active');
        });
        btn.classList.add('active');
        var targetId = btn.getAttribute('data-target');
        document.getElementById(targetId).classList.add('active');
        if (targetId === 'pftab-history') loadPortfolioHistory_();
      });
    });
  });

  document.querySelectorAll('#btTargetChips .chip-select').forEach(function (chip) {
    chip.addEventListener('click', function () {
      document.querySelectorAll('#btTargetChips .chip-select').forEach(function (c) { c.classList.remove('active'); });
      chip.classList.add('active');
      document.getElementById('btTarget').value = chip.getAttribute('data-value');
    });
  });

  var lastBacktestResult = null;

  /** 「戰報勝率報告」：核心指標 header（勝率/平均報酬/最大回落）+ 可摺疊的逐筆觸發明細，
   *  取代原本只丟一份純文字表格、還要另外存檔去 Drive 看的做法。 */
  function renderBacktestResult_(resultEl, res) {
    if (!res || res.error) { resultEl.innerHTML = errorBox((res && res.error) || '沒有回測結果'); document.getElementById('btSaveBtn').disabled = true; return; }
    lastBacktestResult = res;
    document.getElementById('btSaveBtn').disabled = !(res.trades && res.trades.length);
    if (res.warning) { resultEl.innerHTML = errorBox((res.strategyLabel ? '［' + res.strategyLabel + '］' : '') + res.warning); return; }

    var s = res.summary;
    var summaryHtml = '<div class="backtest-summary">' +
      '<div class="meta-bar" style="margin-bottom:0;">' + escapeHtml(res.strategyLabel || '') + '　' +
      escapeHtml(res.startDay) + ' ~ ' + escapeHtml(res.endDay) +
      '　共 ' + s.signalCount + ' 筆進場訊號　目標報酬 ' + res.targetProfit + '%</div>' +
      '<div class="backtest-stat-row">' +
      '<div class="backtest-stat"><div class="bs-label">🏆 策略勝率</div><div class="bs-value ' + (s.winRate >= 50 ? 'up' : 'down') + '">' + fmtNum(s.winRate, 1) + '%</div></div>' +
      '<div class="backtest-stat"><div class="bs-label">📈 平均報酬</div><div class="bs-value ' + (s.avgReturn >= 0 ? 'up' : 'down') + '">' + (s.avgReturn >= 0 ? '+' : '') + fmtNum(s.avgReturn, 1) + '%</div></div>' +
      '<div class="backtest-stat"><div class="bs-label">📉 最大回落</div><div class="bs-value down">-' + fmtNum(s.maxDrawdown, 1) + '%</div></div>' +
      '</div>' +
      '<div class="meta-bar" style="margin-bottom:0;">🎯 目標達成率 ' + fmtNum(s.targetHitRate, 1) + '%　平均持有 ' + fmtNum(s.avgDaysHeld, 1) + ' 個交易日</div>' +
      '</div>';

    var rows = res.trades.map(function (t) {
      var ret = t['最終報酬%'];
      return '<tr><td>' + escapeHtml(t['證券代號']) + ' ' + escapeHtml(t['證券名稱']) + '</td>' +
        '<td>' + escapeHtml(t['進場日']) + '</td><td>' + escapeHtml(t['出場日']) + '</td>' +
        '<td>' + escapeHtml(t['出場結果']) + '</td>' +
        '<td style="color:' + (ret >= 0 ? 'var(--green)' : 'var(--red)') + ';font-weight:600;">' + (ret >= 0 ? '+' : '') + fmtNum(ret, 1) + '%</td></tr>';
    }).join('');
    var detailHtml = '<details class="info-collapse"><summary>查看 ' + res.trades.length + ' 檔歷史觸發明細</summary>' +
      '<div class="table-scroll"><table class="simple-table"><thead><tr>' +
      '<th>股票</th><th>進場日</th><th>出場日</th><th>出場結果</th><th>最終報酬</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
      '</details>';

    resultEl.innerHTML = summaryHtml + detailHtml;
  }

  var backtestPollTimer_ = null;
  function stopBacktestPoll_() {
    if (backtestPollTimer_) { clearInterval(backtestPollTimer_); backtestPollTimer_ = null; }
  }
  function pollBacktestJob_() {
    stopBacktestPoll_();
    var poll = function () {
      callServer('getBacktestV17JobStatus').then(function (state) {
        if (!state || state.status === 'running') return;
        stopBacktestPoll_();
        renderBacktestJobResult_(state);
      }).catch(function () {
        // 輪詢本身失敗不代表背景工作失敗，畫面維持現狀，下一次輪詢再試
      });
    };
    poll();
    backtestPollTimer_ = setInterval(poll, 3000);
  }
  function renderBacktestJobResult_(state) {
    var resultEl = document.getElementById('backtestResult');
    if (state.status === 'error') { resultEl.innerHTML = errorBox('背景回測失敗：' + state.errorMessage); return; }
    if (state.mode === 'all') { renderBacktestAllResult_(resultEl, state.result); return; }
    renderBacktestResult_(resultEl, state.result);
  }

  /** 「一次跑全部版本比對」結果：每種篩選邏輯版本各一張卡片並排比較，重用跟單一策略回測
   *  一樣的核心指標樣式（.backtest-stat-row），缺模型/沒有訊號的版本明確顯示原因，不會因為
   *  某一版跑不出結果就讓整批比對失敗。 */
  function renderBacktestAllResult_(resultEl, res) {
    if (!res || res.error) { resultEl.innerHTML = errorBox((res && res.error) || '沒有回測結果'); return; }
    document.getElementById('btSaveBtn').disabled = true; // 全部比對沒有單一份 trades 可以存檔
    var order = ['rule_v17', 'factor_model_rank', 'hybrid'];
    var html = '<div class="meta-bar">' + escapeHtml(res.startDay) + ' ~ ' + escapeHtml(res.endDay) +
      '　目標報酬 ' + res.targetProfit + '%（三種篩選邏輯版本比對）</div>';
    order.forEach(function (key) {
      var r = (res.results || {})[key];
      if (!r) return;
      if (r.error) {
        html += '<div class="compare-card"><h4>' + escapeHtml(r.strategyLabel) + '</h4>' +
          '<div class="meta-bar" style="margin-bottom:0;">⚠️ ' + escapeHtml(r.error) + '</div></div>';
        return;
      }
      if (!r.summary) {
        html += '<div class="compare-card"><h4>' + escapeHtml(r.strategyLabel) + '</h4>' +
          '<div class="meta-bar" style="margin-bottom:0;">' + escapeHtml(r.warning || '無結果') + '</div></div>';
        return;
      }
      var s = r.summary;
      html += '<div class="compare-card"><h4>' + escapeHtml(r.strategyLabel) + '</h4>' +
        '<div class="backtest-stat-row">' +
        '<div class="backtest-stat"><div class="bs-label">🏆 勝率</div><div class="bs-value ' + (s.winRate >= 50 ? 'up' : 'down') + '">' + fmtNum(s.winRate, 1) + '%</div></div>' +
        '<div class="backtest-stat"><div class="bs-label">📈 平均報酬</div><div class="bs-value ' + (s.avgReturn >= 0 ? 'up' : 'down') + '">' + (s.avgReturn >= 0 ? '+' : '') + fmtNum(s.avgReturn, 1) + '%</div></div>' +
        '<div class="backtest-stat"><div class="bs-label">📉 最大回落</div><div class="bs-value down">-' + fmtNum(s.maxDrawdown, 1) + '%</div></div>' +
        '</div>' +
        '<div class="meta-bar" style="margin-bottom:0;">共 ' + s.signalCount + ' 筆訊號　目標達成率 ' + fmtNum(s.targetHitRate, 1) + '%</div>' +
        '</div>';
    });
    resultEl.innerHTML = html;
  }
  /** 「策略研究」頁籤打開時檢查一次，避免使用者關掉分頁又重新打開後不知道回測跑到哪。 */
  function checkBacktestJobOnLoad_() {
    return callServer('getBacktestV17JobStatus').then(function (state) {
      if (state && state.status === 'running') {
        document.getElementById('backtestResult').innerHTML =
          '<div class="loading">⏳ 背景回測中，可以切到別的畫面或關掉螢幕，不會中斷這個工作...</div>';
        pollBacktestJob_();
        return;
      }
      if (state && (state.status === 'done' || state.status === 'error')) renderBacktestJobResult_(state);
    }).catch(function () { /* 開機檢查失敗不擋其他頁面內容載入 */ });
  }

  /**
   * 「開始回測歷史戰報」改成背景 job：要對進場區間內每一天都跑一次完整的因子計算，
   * 資料量比平常戰報大不少，手機瀏覽器容易連線中斷，改成排背景 job 後這次呼叫立刻回傳，
   * 前端改用輪詢 getBacktestV17JobStatus() 顯示進度。
   */
  document.getElementById('backtestForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var start = document.getElementById('btStart').value;
    var end = document.getElementById('btEnd').value;
    var target = parseFloat(document.getElementById('btTarget').value) || 5;
    var strategyKey = document.getElementById('btStrategySelect').value;
    var resultEl = document.getElementById('backtestResult');
    resultEl.innerHTML = '<div class="loading">⏳ 背景回測中，可以切到別的畫面或關掉螢幕，不會中斷這個工作，資料量大時可能要一兩分鐘...</div>';
    document.getElementById('btSaveBtn').disabled = true;
    withSpin(callServer('startBacktestV17Job', start, end, target, strategyKey)).then(function () {
      pollBacktestJob_();
    }).catch(function (err) { resultEl.innerHTML = errorBox(err); });
  });
  /** 「🆚 一次跑全部版本比對」：只抓一次資料、對三種篩選邏輯版本各跑一次模擬（見
   *  Backtest.gs runBacktestAllStrategies_），跟單一策略回測共用同一個背景 job/輪詢機制。 */
  document.getElementById('btAllStrategiesBtn').addEventListener('click', function () {
    var start = document.getElementById('btStart').value;
    var end = document.getElementById('btEnd').value;
    var target = parseFloat(document.getElementById('btTarget').value) || 5;
    var resultEl = document.getElementById('backtestResult');
    resultEl.innerHTML = '<div class="loading">⏳ 背景回測全部版本中，可以切到別的畫面或關掉螢幕，不會中斷這個工作，資料量大時可能要一兩分鐘...</div>';
    document.getElementById('btSaveBtn').disabled = true;
    withSpin(callServer('startBacktestAllStrategiesJob', start, end, target)).then(function () {
      pollBacktestJob_();
    }).catch(function (err) { resultEl.innerHTML = errorBox(err); });
  });
  document.getElementById('btSaveBtn').addEventListener('click', function () {
    if (!lastBacktestResult) return;
    callServer('saveBacktestToDrive', lastBacktestResult).then(function (f) {
      alert('已存檔：' + f.name);
    }).catch(function (err) { alert(err.message || err); });
  });

  /** FactorScan.gs 候選因子代碼 -> 中文名詞（跟因子回歸模型的 FACTOR_CODE_CN 是不同來源的
   *  兩組欄位，這裡是 computeFactorScanFields_ 算出來的研究用因子，不是 BQML 的候選欄位）。 */
  var FACTOR_SCAN_CN = {
    Inst_Streak: '法人連買天數',
    Inst_Participation: '法人參與度',
    Trend_Score: '趨勢動能',
    IBF_20D: '下跌接手率',
    Safety_Rank: '安全邊際分數'
  };
  function factorScanCn_(code) { return FACTOR_SCAN_CN[code] || code; }

  /** 相關係數 r 的白話品質分級：跟因子回歸模型的 R² 燈號是不同量級的指標（這裡是單因子跟
   *  未來5日報酬率的 Pearson r，不是迴歸模型的 R²），門檻分開訂。 */
  function corrTier_(r) {
    if (r === null || r === undefined || isNaN(r)) return { emoji: '⚪', text: '無法計算', cls: 'cold' };
    if (r >= 0.3) return { emoji: '🟢🔥', text: '強正相關（熱門有效）', cls: 'hot' };
    if (r >= 0.1) return { emoji: '🟡', text: '中度相關（中性）', cls: 'mid' };
    return { emoji: '🔴❄️', text: '弱／負相關（近期失效或反向）', cls: 'cold' };
  }

  var lastFactorScanResult = null;
  document.getElementById('factorScanForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var start = document.getElementById('fsStart').value || null;
    var end = document.getElementById('fsEnd').value || null;
    var resultEl = document.getElementById('factorScanResult');
    resultEl.innerHTML = '<div class="loading">掃描中，資料量大時可能要一點時間...</div>';
    document.getElementById('fsSaveBtn').disabled = true;
    withSpin(callServer('runFactorCorrelationScan', start, end)).then(function (res) {
      if (res.warning) { resultEl.innerHTML = errorBox(res.warning); return; }
      if (!res.correlations.length) { resultEl.innerHTML = '<div class="empty-hint">沒有可分析的資料</div>'; return; }
      lastFactorScanResult = res;
      document.getElementById('fsSaveBtn').disabled = false;

      var maxAbs = Math.max.apply(null, res.correlations.map(function (c) { return Math.abs(c.correlation || 0); })) || 1;
      var rowsHtml = res.correlations.map(function (c) {
        var tier = corrTier_(c.correlation);
        var widthPct = Math.round(Math.abs(c.correlation || 0) / maxAbs * 100);
        return '<div class="heat-row">' +
          '<div class="heat-row-head"><span class="heat-row-name">' + tier.emoji + ' ' + escapeHtml(factorScanCn_(c.factor)) + '</span>' +
          '<span class="heat-row-r">r = ' + (c.correlation === null ? '-' : (c.correlation >= 0 ? '+' : '') + fmtNum(c.correlation, 2)) + '</span></div>' +
          '<div class="heat-bar-track"><div class="heat-bar-fill ' + tier.cls + '" style="width:' + widthPct + '%;"></div></div>' +
          '<div style="font-size:11px;color:var(--text-muted);margin-top:4px;">' + tier.text + '</div>' +
          '</div>';
      }).join('');
      resultEl.innerHTML = '<div class="meta-bar">樣本數 ' + res.sampleSize + '　（跟「未來5日報酬率」的關聯度，愈上面代表近期愈有效）</div>' +
        '<div class="heat-list">' + rowsHtml + '</div>';
    }).catch(function (err) { resultEl.innerHTML = errorBox(err); });
  });
  document.getElementById('fsSaveBtn').addEventListener('click', function () {
    if (!lastFactorScanResult) return;
    callServer('saveFactorScanToDrive', lastFactorScanResult).then(function (f) {
      alert('已存檔：' + f.name);
    }).catch(function (err) { alert(err.message || err); });
  });

  // ---------- 戰報篩選邏輯版本（可切換：規則式門檻 / 因子模型排名 / 混合） ----------

  function renderScreeningStrategyOptions_(data) {

  document.getElementById('screeningStrategyApplyBtn').addEventListener('click', function () {

        '　下次「重新計算戰報」就會用這一版邏輯。</div>';

  });

  // ---------- 因子回歸模型：人性化中文對照表 / R² 品質燈號 ----------

  /** BQML 候選因子欄位代碼 -> 使用者看得懂的中文名詞（對照 Config.gs 的 FACTOR_CANDIDATE_COLUMNS
   *  跟 Analysis.gs computeFactors_ 實際算法，跟後端欄位命名脫鉤，方便之後想換字眼不用動後端）。 */
  var FACTOR_CODE_CN = {
    inst_participation: '法人參與度',
    inst_part_ma5: '法人參與度（5日均）',
    ibf_20d: '下跌接手率',
    trend_score: '趨勢動能',
    ma20_slope: '20日均線斜率',
    vol_ratio: '成交量放大倍數',
    bias60: '60日乖離率',
    dividend_yield: '殖利率',
    pe_ratio: '本益比',
    pb_ratio: '股價淨值比'
  };
  function factorCodeCn_(code) { return FACTOR_CODE_CN[code] || code; }

  /** R2 是 0~1（甚至可能負值）的小數，畫面一律換算成百分比顯示；null/空字串/非數字一律顯示 '-'，
   *  不能讓 fmtNum(null*100) 誤算成看起來像「剛好 0%」的假數字。 */
  function pctOrDash_(v, digits) {
    if (v === null || v === undefined || v === '') return '-';
    var n = Number(v);
    if (isNaN(n)) return '-';
    return fmtNum(n * 100, digits === undefined ? 2 : digits) + '%';
  }

  /** 抗跌力／月報酬 R² 的白話品質燈號：>=8% 良好、4~8% 普通、<4% 偏弱（含負值）。
   *  月報酬預測力（kind='return'）另外處理：短期股價漲跌本身雜訊就很高，R² 偏低是常態，
   *  用紅色燈號反而會誤導使用者以為「這個模型壞了」，改用黃色 + 明確提醒僅供輔助。 */
  function r2Quality_(r2, kind) {
    if (r2 === null || r2 === undefined || r2 === '' || isNaN(Number(r2))) return { emoji: '⚪', text: '尚無資料' };
    var pct = Number(r2) * 100;
    if (kind === 'return') {
      if (pct >= 8) return { emoji: '🟢', text: '良好（相對少見，仍建議搭配其他指標）' };
      if (pct >= 4) return { emoji: '🟡', text: '中等（僅供輔助，勿單靠此下單）' };
      return { emoji: '🟡', text: '弱（金融短期漲跌雜訊高，僅供輔助，勿單靠此下單）' };
    }
    if (pct >= 8) return { emoji: '🟢', text: '強（適合大盤震盪時防禦）' };
    if (pct >= 4) return { emoji: '🟡', text: '中等' };
    return { emoji: '🔴', text: '弱' };
  }

  /** 「🌟 目前生效模型」卡片：白話呈現目前套用中的因子模型版本，見 FactorRegression.gs
   *  的 getActiveFactorModelSummary()。 */
  function loadActiveFactorModelCard_() {
    var el = document.getElementById('factorActiveModelCard');
    return callServer('getActiveFactorModelSummary').then(function (summary) {
      renderActiveModelCard_(el, summary);
    }).catch(function (err) { el.innerHTML = errorBox(err); });
  }

  function renderActiveModelCard_(el, summary) {
    if (!summary || !summary.active) {
      el.innerHTML = '<div class="highlight-card hc-empty"><h3>🌟 目前沒有套用中的因子模型版本</h3>' +
        '<div style="font-size:12px;">下面執行一次因子迴歸、套用其中一版之後，這裡會顯示白話版的模型效果。</div></div>';
      return;
    }
    var r1 = summary.return1m, dr = summary.downsideResistance;
    var versionLabel = summary.sameVersion ? (r1 ? r1.timestamp : dr.timestamp) :
      [r1 ? ('1個月報酬 ' + r1.timestamp) : null, dr ? ('抗跌力 ' + dr.timestamp) : null].filter(function (s) { return s; }).join('　');

    var r1Q = r1 ? r2Quality_(r1.r2, 'return') : null;
    var drQ = dr ? r2Quality_(dr.r2) : null;
    var factorCodes = (dr && dr.topFeatures.length) ? dr.topFeatures : (r1 ? r1.topFeatures : []);
    var factorsHtml = factorCodes.length ? factorCodes.map(factorCodeCn_).join('、') : '（尚無權重資料）';

    el.innerHTML =
      '<div class="highlight-card">' +
      '<h3>🌟 目前生效模型　' + escapeHtml(versionLabel) + ' 版</h3>' +
      (r1 ? '<div class="hc-metric"><span>月報酬預測力</span>' +
        '<span class="hc-metric-value">' + r1Q.emoji + ' ' + pctOrDash_(r1.r2) + '（' + r1Q.text + '）</span></div>' : '') +
      (dr ? '<div class="hc-metric"><span>大盤抗跌預測力</span>' +
        '<span class="hc-metric-value">' + drQ.emoji + ' ' + pctOrDash_(dr.r2) + '（' + drQ.text + '）</span></div>' : '') +
      '<div class="hc-factors">關鍵影響因子：' + escapeHtml(factorsHtml) + '</div>' +
      '<div class="hc-note">👉 此模型正用於「最新戰報」每檔股票的「因子模型預測分數」輔助欄位</div>' +

  function runBqSyncLoop_(months, index, done, resultEl) {

      done.push(month);
      runBqSyncLoop_(months, index + 1, done, resultEl);
    }).catch(function (err) {
      resultEl.innerHTML = '<div class="meta-bar">已同步：' + done.join(', ') + '</div>' +

  function pollFactorRegressionJob_() {

  /** job 完成後不直接把新模型的原始數字塞進畫面，而是先跟「目前套用中」的舊版本並列比較
   *  （見 renderCompareCard_），使用者自己決定要不要套用——不然使用者永遠不知道這次重新訓練
   *  到底有沒有比現在用的版本更好。 */
  function renderFactorRegressionJobResult_(state) {
    var resultEl = document.getElementById('bqActionResult');
    var compareEl = document.getElementById('factorCompareCard');
    if (state.status === 'error') {
      resultEl.innerHTML = errorBox('背景執行因子迴歸失敗：' + state.errorMessage);
      compareEl.innerHTML = '';
      return;
    }
    resultEl.innerHTML = '<div class="meta-bar">✅ 訓練完成，比對結果如下：</div>';
    callServer('getActiveFactorModelSummary').then(function (activeSummary) {
      renderCompareCard_(compareEl, state, activeSummary);
    }).catch(function () {
      renderCompareCard_(compareEl, state, { active: false });
    });
    loadFactorModelHistory_();
  }

  /** 新舊模型效果比對卡片：「舊」是呼叫當下實際套用中的版本（訓練本身不會自動套用，
   *  所以這裡查到的就是訓練開始前那個仍然生效的版本，不用另外在訓練前拍照存證）。 */
  function renderCompareCard_(compareEl, state, activeSummary) {
    var results = state.results || [];
    if (!results.length) { compareEl.innerHTML = ''; return; }
    var oldR2ByKey = {};
    if (activeSummary && activeSummary.active) {
      if (activeSummary.return1m) oldR2ByKey.return1m = activeSummary.return1m.r2;
      if (activeSummary.downsideResistance) oldR2ByKey.downsideResistance = activeSummary.downsideResistance.r2;
    }

    var rowsHtml = results.map(function (r) {
      if (r.error) {
        return '<div class="compare-row"><span>' + escapeHtml(r.labelName || r.labelKey) + '</span>' +
          '<span class="compare-delta down">訓練失敗：' + escapeHtml(r.error) + '</span></div>';
      }
      var oldR2 = oldR2ByKey[r.labelKey];
      var hasOld = oldR2 !== undefined && oldR2 !== null && oldR2 !== '';
      var deltaHtml;
      if (hasOld) {
        var deltaPct = (Number(r.r2) - Number(oldR2)) * 100;
        var cls = deltaPct > 0.001 ? 'up' : (deltaPct < -0.001 ? 'down' : 'flat');
        var arrow = deltaPct > 0.001 ? '📈 提升' : (deltaPct < -0.001 ? '📉 未提升' : '➡️ 持平');
        deltaHtml = '<span class="compare-delta ' + cls + '">' + arrow + ' ' + (deltaPct >= 0 ? '+' : '') + fmtNum(deltaPct, 2) + '%</span>';
      } else {
        deltaHtml = '<span class="compare-delta">（目前沒有套用中的版本可比較）</span>';
      }
      return '<div class="compare-row"><span>' + escapeHtml(r.labelName) + '　新 R² ' + pctOrDash_(r.r2) +
        (hasOld ? '　舊 R² ' + pctOrDash_(oldR2) : '') + '</span>' + deltaHtml + '</div>';
    }).join('');

    var hasSuccess = results.some(function (r) { return !r.error; });
    compareEl.innerHTML = '<div class="compare-card"><h4>🆚 新舊模型效果比對（' + escapeHtml(state.timestamp) + ' 版）</h4>' +
      rowsHtml +
      (hasSuccess ? '<div class="form-actions" style="margin-top:10px;">' +
        '<button type="button" class="btn-primary" id="factorApplyNewBtn">✅ 立即套用新版本</button>' +
        '<button type="button" class="btn-secondary" id="factorDiscardNewBtn">放棄，保留現有版本</button>' +
        '</div>' : '') +
      '</div>';

    if (!hasSuccess) return;
    document.getElementById('factorApplyNewBtn').addEventListener('click', function () {
      withSpin(callServer('applyFactorModel', state.timestamp)).then(function () {
        compareEl.innerHTML = '<div class="meta-bar">✅ 已套用 ' + escapeHtml(state.timestamp) + ' 版</div>';
        loadFactorModelHistory_();
        loadActiveFactorModelCard_();
      }).catch(function (err) { alert(err.message || err); });
    });
    document.getElementById('factorDiscardNewBtn').addEventListener('click', function () {
      compareEl.innerHTML = '';
    });
  }

  /** 「策略研究」頁籤打開時檢查一次，避免使用者關掉分頁又重新打開後，完全不知道背景工作
   *  跑到哪、甚至早就做完了。只有真的有 job（狀態是 running）時才顯示/開始輪詢。 */
  function checkFactorRegressionJobOnLoad_() {

        pollFactorRegressionJob_();

  /** 歷史版本紀錄：同一次「執行因子迴歸」會對兩個 label（1個月報酬 / 抗跌力）各寫一筆紀錄、
   *  時間戳記相同，這裡按時間戳記分組成「一個版本一列」——套用也是整版一起套用（見
   *  FactorRegression.gs applyFactorModel() 的說明），拆成兩行只會讓人搞不清楚「目前生效的
   *  到底是哪一版」。 */
  function loadFactorModelHistory_() {
    return callServer('getFactorModelHistory', 40).then(function (rows) {
      var tableEl = document.getElementById('factorModelHistoryTable');
      if (!rows.length) { tableEl.innerHTML = '<div class="empty-hint">還沒有執行紀錄</div>'; return; }

      var byTs = {};
      var order = [];
      rows.forEach(function (r) {
        var ts = r['執行時間'];
        if (!byTs[ts]) { byTs[ts] = {}; order.push(ts); }
        byTs[ts][r['標的Label']] = r;
      });

      var body = order.map(function (ts) {
        var group = byTs[ts];
        var r1 = group.return1m, dr = group.downsideResistance;
        var applied = (r1 && String(r1['目前套用版本'] || '').indexOf('套用中') !== -1) ||
          (dr && String(dr['目前套用版本'] || '').indexOf('套用中') !== -1);
        var statusHtml = applied ? '<span style="color:var(--green);font-weight:700;">🟢 當前套用中</span>' : '—';
        var actionHtml = applied ? '' :
          '<button type="button" class="btn-secondary factor-apply-btn" data-ts="' + escapeHtml(ts) + '">切換套用此版本</button>';
        return '<tr><td>' + escapeHtml(ts) + '</td>' +
          '<td>' + (r1 ? pctOrDash_(r1['R2']) : '-') + '</td>' +
          '<td>' + (dr ? pctOrDash_(dr['R2']) : '-') + '</td>' +
          '<td>' + statusHtml + '</td><td>' + actionHtml + '</td></tr>';
      }).join('');

      tableEl.innerHTML = '<div class="table-scroll"><table class="simple-table"><thead><tr>' +
        '<th>執行時間</th><th>1個月報酬 R²</th><th>抗跌力 R²</th><th>狀態</th><th>操作</th></tr></thead><tbody>' + body + '</tbody></table></div>';
      tableEl.querySelectorAll('.factor-apply-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          withSpin(callServer('applyFactorModel', btn.getAttribute('data-ts')))
            .then(function () { loadFactorModelHistory_(); loadActiveFactorModelCard_(); })
            .catch(function (err) { alert(err.message || err); });
        });
      });
    }).catch(function (err) { document.getElementById('factorModelHistoryTable').innerHTML = errorBox(err); });
  }

  // ---------- 排程佇列（彙整三個背景 job 的狀態，見 JobQueue.gs） ----------
  var JOB_STATUS_LABEL = { idle: '閒置', running: '⏳ 執行中', done: '✅ 完成', error: '⚠️ 錯誤', cancelled: '已取消' };
  var JOB_STATUS_COLOR = {
    idle: 'var(--text-muted)', running: 'var(--accent)', done: 'var(--green)',
    error: 'var(--red)', cancelled: 'var(--amber)'
  };
  var jobQueuePollTimer_ = null;

  function stopJobQueuePoll_() {
    if (jobQueuePollTimer_) { clearInterval(jobQueuePollTimer_); jobQueuePollTimer_ = null; }
  }

  function loadJobQueue_() {
    var listEl = document.getElementById('jobQueueList');
    return callServer('getJobQueueOverview').then(renderJobQueue_).catch(function (err) { listEl.innerHTML = errorBox(err); });
  }

  // 時間觸發器有時候不知道什麼原因就是沒有真的被 Apps Script 觸發，狀態會卡在 running
  // 卻再也不會有進度更新；「更新時間」超過這個門檻還是 running，就提醒使用者可能已經卡住。
  var JOB_STALE_THRESHOLD_MS = 10 * 60 * 1000;

  function stopJobPollByKey_(key) {
    if (key === 'analysis') stopAnalysisJobPoll_();
    else if (key === 'backfill') stopBackfillPoll_();

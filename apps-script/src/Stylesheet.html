<style>
  :root {
    --bg: #f4f5f7;
    --card-bg: #ffffff;
    --text: #1c1e21;
    --text-muted: #6b7280;
    --border: #e5e7eb;
    --accent: #2563eb;
    --green: #16a34a;
    --red: #dc2626;
    --amber: #d97706;
    --nav-height: 64px;
    --topbar-height: 52px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121316;
      --card-bg: #1c1e22;
      --text: #f2f3f5;
      --text-muted: #9aa0a6;
      --border: #2d2f34;
      --accent: #5b9dff;
      --green: #4ade80;
      --red: #f87171;
      --amber: #fbbf24;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  #app { display: flex; flex-direction: column; min-height: 100vh; }

  .topbar {
    position: sticky; top: 0; z-index: 10;
    height: var(--topbar-height);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 16px;
    background: var(--card-bg);
    border-bottom: 1px solid var(--border);
  }
  .topbar-title { font-size: 17px; font-weight: 700; }
  .icon-btn {
    border: none; background: transparent; font-size: 20px; color: var(--text);
    cursor: pointer; padding: 6px 10px; border-radius: 8px;
  }
  .icon-btn:active { background: var(--border); }
  .icon-btn.spinning { animation: spin 0.8s linear infinite; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  main#content {
    flex: 1;
    padding: 12px 12px calc(var(--nav-height) + 20px) 12px;
    max-width: 640px;
    width: 100%;
    margin: 0 auto;
  }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
    height: var(--nav-height);
    display: flex;
    background: var(--card-bg);
    border-top: 1px solid var(--border);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .nav-btn {
    flex: 1; border: none; background: transparent; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2px; color: var(--text-muted); font-size: 11px;
  }
  .nav-btn .nav-icon { font-size: 20px; }
  .nav-btn.active { color: var(--accent); }

  .meta-bar {
    font-size: 13px; color: var(--text-muted); margin-bottom: 10px;
  }

  .card-list { display: flex; flex-direction: column; gap: 10px; }
  .stock-card {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 14px;
  }
  .stock-card-head { display: flex; justify-content: space-between; align-items: baseline; }
  .stock-card-code { font-weight: 700; font-size: 15px; }
  .stock-card-name { color: var(--text-muted); font-size: 13px; margin-left: 6px; }
  .stock-card-score { font-weight: 700; font-size: 15px; color: var(--accent); }
  .stock-card-strategy { margin-top: 4px; font-size: 14px; font-weight: 600; }
  .stock-card-action { font-size: 13px; color: var(--text-muted); }
  .stock-card-note { font-size: 13px; margin-top: 4px; }
  .stock-card-link { font-size: 12px; color: var(--accent); text-decoration: none; }

  .loading, .empty-hint { text-align: center; color: var(--text-muted); padding: 24px 0; font-size: 14px; }
  .error-box {
    background: #fee2e2; color: #991b1b; border-radius: 10px; padding: 10px 12px; font-size: 13px; margin-bottom: 10px;
  }
  @media (prefers-color-scheme: dark) {
    .error-box { background: #3f1d1d; color: #fca5a5; }
  }

  .form-card {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px; display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px;
  }
  .form-card h3 { margin: 0 0 4px 0; font-size: 15px; }
  .form-card label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--text-muted); }
  .form-card input, .form-card select {
    font-size: 15px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text);
  }
  .checkbox-row { flex-direction: row !important; align-items: center; gap: 8px !important; }
  .form-actions { display: flex; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
  .btn-primary, .btn-secondary {
    border: none; border-radius: 8px; padding: 10px 16px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-secondary { background: var(--border); color: var(--text); }
  .btn-danger { background: var(--red); color: #fff; }
  button:disabled { opacity: 0.5; cursor: default; }

  .inline-form { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .inline-form input { flex: 1; min-width: 120px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text); }

  .chip-list { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .chip {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 999px;
    padding: 6px 10px; font-size: 12px; display: flex; align-items: center; gap: 6px;
  }
  .chip button { border: none; background: transparent; color: var(--red); cursor: pointer; font-size: 13px; }

  .search-bar { position: relative; margin-bottom: 12px; }
  .search-bar input {
    width: 100%; font-size: 15px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--card-bg); color: var(--text);
  }
  .search-results {
    position: absolute; left: 0; right: 0; top: 100%; z-index: 5;
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; margin-top: 4px;
    max-height: 260px; overflow-y: auto;
  }
  .search-result-item { padding: 10px 12px; font-size: 14px; cursor: pointer; border-bottom: 1px solid var(--border); }
  .search-result-item:last-child { border-bottom: none; }
  .search-result-item:active { background: var(--bg); }

  .chart-card {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px; margin-bottom: 12px;
  }
  .chart-card h4 { margin: 0 0 8px 0; font-size: 13px; color: var(--text-muted); }
  canvas { max-width: 100%; }

  table.simple-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.simple-table th, table.simple-table td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--border); }
  table.simple-table th { color: var(--text-muted); font-weight: 600; }
  .table-scroll { overflow-x: auto; }

  .sub-tabs, .folder-tabs { display: flex; gap: 8px; margin-bottom: 12px; }
  .sub-tab-btn, .folder-tab-btn {
    flex: 1; border: 1px solid var(--border); background: var(--card-bg); color: var(--text-muted);
    padding: 8px; border-radius: 8px; font-size: 13px; cursor: pointer;
  }
  .sub-tab-btn.active, .folder-tab-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .sub-tab-panel { display: none; }
  .sub-tab-panel.active { display: block; }

  .admin-section {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px; margin-bottom: 14px;
  }
  .admin-section h3 { margin: 0 0 10px 0; font-size: 15px; }
  .admin-section h4 { margin: 12px 0 8px 0; font-size: 13px; color: var(--text-muted); }
  .admin-section a { color: var(--accent); font-size: 13px; }

  .time-row { display: flex; align-items: center; gap: 6px; }
  .time-row select { flex: 1; }

  .log-list { display: flex; flex-direction: column; gap: 6px; max-height: 320px; overflow-y: auto; }
  .log-item { font-size: 12px; padding: 8px; border-radius: 8px; background: var(--bg); }
  .log-item .log-status { font-weight: 700; }
  .log-status.ok { color: var(--green); }
  .log-status.fail { color: var(--red); }
  .log-status.skip { color: var(--amber); }

  .file-list { display: flex; flex-direction: column; gap: 8px; }
  .file-item {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    background: var(--bg); border-radius: 8px; padding: 8px 10px; font-size: 13px;
  }
  .file-item .file-meta { color: var(--text-muted); font-size: 11px; }
  .file-item a { color: var(--accent); text-decoration: none; }

  .ai-report {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px; font-size: 13px; line-height: 1.6; margin-top: 10px;
  }
  .ai-report h4 { font-size: 15px; margin: 4px 0 8px 0; }
  .ai-report h5 { font-size: 13px; margin: 12px 0 6px 0; color: var(--accent); }
  .ai-report blockquote {
    margin: 6px 0; padding: 6px 10px; border-left: 3px solid var(--accent);
    background: var(--bg); border-radius: 0 6px 6px 0;
  }
  .ai-report .md-li { padding-left: 4px; margin: 2px 0; }
  .ai-report table.simple-table { margin: 6px 0; }
  .ai-report p { margin: 4px 0; }
  .ai-verdict-badge {
    display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700;
    background: var(--accent); color: #fff; margin-left: 6px;
  }

  /* 底部彈出式面板（bottom sheet）共用元件：action sheet（重新整理選項）跟個股詳情 modal 都用這套。 */
  .sheet-overlay {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(0, 0, 0, 0.5);
    display: flex; align-items: flex-end; justify-content: center;
  }
  .sheet-overlay.hidden { display: none; }
  .sheet-panel {
    background: var(--card-bg); width: 100%; max-width: 640px;
    border-radius: 16px 16px 0 0;
    padding: 14px 16px calc(16px + env(safe-area-inset-bottom)) 16px;
    max-height: 88vh; overflow-y: auto;
  }
  .sheet-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .sheet-header h3 { margin: 0; font-size: 16px; }
  .sheet-close-btn { border: none; background: transparent; font-size: 20px; color: var(--text-muted); cursor: pointer; padding: 4px 8px; }

  .action-sheet-btn {
    display: block; width: 100%; text-align: left; border: none; background: var(--bg); color: var(--text);
    border-radius: 10px; padding: 14px 16px; font-size: 15px; margin-bottom: 8px; cursor: pointer;
  }
  .action-sheet-btn .as-sub { display: block; font-size: 12px; color: var(--text-muted); margin-top: 2px; font-weight: 400; }
  .action-sheet-cancel {
    display: block; width: 100%; text-align: center; border: none; background: transparent;
    color: var(--text-muted); padding: 12px; font-size: 14px; cursor: pointer;
  }

  /* 因子回歸模型「目前生效模型」卡片：故意用跟其他卡片不同的深色/高亮底色，
     讓「這是目前真的在影響戰報的版本」在一堆歷史紀錄跟說明文字裡第一眼就看得到。 */
  .highlight-card {
    background: linear-gradient(135deg, #2563eb, #1e3a8a); color: #fff;
    border-radius: 12px; padding: 16px; margin-bottom: 14px;
  }
  @media (prefers-color-scheme: dark) {
    .highlight-card { background: linear-gradient(135deg, #1e3a8a, #172554); }
  }
  .highlight-card h3 { margin: 0 0 10px 0; font-size: 15px; }
  .highlight-card.hc-empty { background: var(--card-bg); color: var(--text); border: 1px dashed var(--border); }
  .highlight-card.hc-empty h3 { color: var(--text); }
  .hc-metric {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 13px; padding: 6px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.2);
  }
  .highlight-card.hc-empty .hc-metric { border-bottom-color: var(--border); }
  .hc-metric:last-of-type { border-bottom: none; }
  .hc-metric-value { font-weight: 700; }
  .hc-factors { font-size: 12px; margin-top: 8px; opacity: 0.92; line-height: 1.5; }
  .hc-note {
    font-size: 11px; margin-top: 10px; opacity: 0.8;
    border-top: 1px dashed rgba(255, 255, 255, 0.3); padding-top: 8px;
  }
  .highlight-card.hc-empty .hc-note { border-top-color: var(--border); }

  /* 摺疊式說明卡片（原本一大段文字改成點了才展開），用原生 <details> 不用額外寫開合邏輯。 */
  details.info-collapse {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px;
    padding: 10px 14px; margin-bottom: 14px; font-size: 13px;
  }
  details.info-collapse summary { cursor: pointer; font-weight: 600; list-style: none; }
  details.info-collapse summary::-webkit-details-marker { display: none; }
  details.info-collapse summary::before { content: '▸ '; }
  details.info-collapse[open] summary::before { content: '▾ '; }
  details.info-collapse[open] summary { margin-bottom: 8px; }
  details.info-collapse .info-body { color: var(--text-muted); line-height: 1.6; }

  /* 「執行因子迴歸」後跳出的新舊模型效果比對卡片。 */
  .compare-card {
    background: var(--card-bg); border: 2px solid var(--accent); border-radius: 12px;
    padding: 14px; margin-bottom: 14px;
  }
  .compare-card h4 { margin: 0 0 10px 0; font-size: 14px; }
  .compare-row {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    font-size: 13px; padding: 6px 0; border-bottom: 1px solid var(--border); flex-wrap: wrap;
  }
  .compare-row:last-of-type { border-bottom: none; }
  .compare-delta { font-weight: 700; white-space: nowrap; }
  .compare-delta.up { color: var(--green); }
  .compare-delta.down { color: var(--red); }
  .compare-delta.flat { color: var(--text-muted); }

  /* 因子相關性「因子有效性熱力榜」：橫條依相關係數絕對值排名，取代原本的純文字表格。 */
  .heat-list { display: flex; flex-direction: column; gap: 10px; }
  .heat-row { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
  .heat-row-head { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; margin-bottom: 6px; }
  .heat-row-name { font-weight: 600; }
  .heat-row-r { font-weight: 700; }
  .heat-bar-track { background: var(--bg); border-radius: 999px; height: 8px; overflow: hidden; }
  .heat-bar-fill { height: 100%; border-radius: 999px; }
  .heat-bar-fill.hot { background: var(--green); }
  .heat-bar-fill.mid { background: var(--amber); }
  .heat-bar-fill.cold { background: var(--red); }

  /* 目標報酬等可挑選的 chips（跟原本的 .chip 唯讀清單不同，這裡要能點選切換 active 狀態）。 */
  .chip-select-list { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip-select {
    border: 1px solid var(--border); background: var(--card-bg); color: var(--text);
    border-radius: 999px; padding: 6px 14px; font-size: 13px; cursor: pointer;
  }
  .chip-select.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* v17.0 策略回測「戰報勝率報告」核心指標卡片。 */
  .backtest-summary { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
  .backtest-stat-row { display: flex; gap: 8px; }
  .backtest-stat {
    flex: 1; background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 10px; text-align: center;
  }
  .backtest-stat .bs-label { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
  .backtest-stat .bs-value { font-size: 18px; font-weight: 700; }
  .backtest-stat .bs-value.up { color: var(--green); }
  .backtest-stat .bs-value.down { color: var(--red); }

  /* 「戰報篩選邏輯」版本選擇清單。 */
  .strategy-option {
    display: flex; align-items: flex-start; gap: 8px; padding: 10px; margin-bottom: 8px;
    border: 1px solid var(--border); border-radius: 10px; cursor: pointer; font-size: 13px;
  }
  .strategy-option input[type="radio"] { margin-top: 3px; flex-shrink: 0; }
</style>
